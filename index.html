Hatással lehetek rá”, kívül „Nem tudok változtatni rajta”.\n2. Mindenki felír 6–8 dolgot, ami mostanában foglalkoztatja (pl. jegyek, időjárás, egy barát viselkedése, saját alvásom), és elhelyezi őket a körökben.\n3. Párban megnézik egymás köreit: valóban jó helyen vannak a dolgok?\n4. Beszéljétek meg: hová megy el a legtöbb energiánk? Mit tehetünk a külső körrel (elfogadás, elengedés)?\n5. Feldolgozás: Melyik körben van a legtöbb dolgod? Mi az az egy dolog a belső körből, amivel ezen a héten foglalkozol? Mit engedsz el a külső körből?", "caution": "Hangsúlyozd: a külső körben lévő dolgok is fájhatnak, és ez rendben van. Az elfogadás nem azt jelenti, hogy nem számít.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC04-91", "theme_id": "t04", "name": "Ki vagyok különböző helyeken?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Összegyűjtjük, milyen szerepeink vannak (barát, testvér, sportoló, diák), mennyire vagyunk ugyanazok mindenhol, és melyik szerepben érezzük magunkat a legjobban önmagunknak.", "tools": "A4-es lapok, színes ceruzák", "keywords": "szerepek, identitás, hitelesség, önismeret, kontextus", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki a lap közepére írja a nevét, köré pedig a szerepeit (pl. nagytestvér, csapattag, osztálytárs, online én).\n2. Minden szerep mellé felírja, milyen olyankor (pl. hangos, türelmes, vicces, csendes).\n3. Bekarikázza azt a szerepet, amelyben a leginkább önmaga, és aláhúzza azt, amelyben a legkevésbé.\n4. Párban beszélgetnek: mi az, ami minden szerepemben ugyanaz?\n5. Feldolgozás: Rendben van-e, hogy máshol másmilyenek vagyunk? Mikor válik ez megterhelővé? Mi az, ami a legmélyebben te vagy, bárhol is vagy?", "caution": "Senkinek ne kelljen megmutatnia a teljes lapot. Az „online én” témánál kerüld az ítélkezést.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC05-91", "theme_id": "t05", "name": "Beszélőkör", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Beszélőtárggyal tartunk kört: csak az beszél, akinél a tárgy van, a többiek teljes figyelemmel hallgatnak, és senki nem reagál, nem tanácsol.", "tools": "egy beszélőtárgy (kő, labda, plüss)", "keywords": "beszélőkör, figyelem, tisztelet, meghallgatás, közösség", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mondd el a szabályokat: csak az beszél, akinél a tárgy van; a többiek nem szólnak közbe és nem kommentálnak; passzolni lehet; ami itt elhangzik, itt marad.\n2. Első kör (bemelegítés): Mi volt a héten egy jó pillanat?\n3. Második kör (mélyebb kérdés): Mi az, amit szeretnél, ha többen tudnának rólad? vagy Mi foglalkoztat mostanában?\n4. Harmadik kör: Mit vettél észre a többiek történeteiben?\n5. Feldolgozás: Milyen volt úgy beszélni, hogy senki nem szólt közbe? Milyen volt úgy hallgatni, hogy nem reagálhattál? Hol lenne jó ilyen kört tartani máskor is?", "caution": "A második kör kérdését a csoport hangulatához igazítsd. Te is vegyél részt a körben, de rövid válaszokkal.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC06-91", "theme_id": "t06", "name": "Névtelen gondok fala", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "9", "description": "Névtelenül felírjuk a mostani kisebb-nagyobb gondjainkat, a többiek pedig együttérző üzeneteket ragasztanak melléjük.", "tools": "két színű öntapadós cetli, falfelület vagy csomagolópapír", "keywords": "empátia, névtelenség, támogatás, közösség, együttérzés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki ír egy cetlire egy dolgot, ami mostanában nehéz neki (iskola, barátok, család, magam). Nem kell nagy dolog, és nem kell a saját kézírásával, nyomtatott betűkkel is írhat.\n2. A cetliket összekevered, és felragasztod a falra.\n3. Mindenki körbejár, elolvassa őket, és legalább három cetli mellé ír egy másik színű cetlire együttérző üzenetet (nem tanácsot): pl. „Ez nagyon nehéz lehet.” „Nem vagy egyedül.”\n4. Közösen elolvassátok, mennyi gond hasonlít egymásra.\n5. Feldolgozás: Meglepett, hogy mások mivel küzdenek? Milyen volt együttérző üzenetet írni? Ha a saját cetlid mellett üzenetet láttál, milyen érzés volt?", "caution": "Olvasd el a cetliket, mielőtt felragasztod őket. Ha veszélyre utaló üzenet van köztük (önsértés, bántalmazás), ne tedd ki, és kérj segítséget az iskolapszichológustól.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC07-91", "theme_id": "t07", "name": "A düh mögötti kérés", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Dühös mondatokból kibontjuk, mit szeretne valójában a beszélő, és kéréssé fogalmazzuk őket.", "tools": "mondatkártyák dühös mondatokkal", "keywords": "düh, kérés, szükséglet, EMK, átfogalmazás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Olvass fel egy mondatot: „Soha nem figyelsz rám!” Kérdezd meg: mit szeretne valójában, aki ezt mondja? (Figyelmet, időt, hogy meghallgassák.)\n2. Kiscsoportok kapnak mondatkártyákat (pl. „Mindig én csinálok mindent!” „Hagyj már békén!” „Tök mindegy, úgysem érdekel senkit!”).\n3. Minden mondatnál megkeresik: mit érez a beszélő, mire van szüksége, és mit kérhetne helyette.\n4. Néhány csoport eljátssza az eredeti és az új változatot.\n5. Feldolgozás: Miért könnyebb dühösen mondani, mint kérni? Melyik mondatot hallod a legtöbbször otthon vagy a barátaidtól? Mit kérnél valakitől ezen a héten?", "caution": "A düh nem rossz érzés, csak a kifejezése árthat. Ezt mondd ki.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC08-91", "theme_id": "t08", "name": "Fórumszínház", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "9", "description": "Egy rövid konfliktusjelenetet eljátszunk, a nézők pedig megállíthatják, beléphetnek egy szereplő helyére, és kipróbálhatnak más megoldást.", "tools": "jelenetvázlat, kevés kellék", "keywords": "fórumszínház, konfliktus, alternatívák, bátorság, szerepjáték", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Önként jelentkezők eljátszanak egy rövid jelenetet, ami rosszul végződik (pl. egy diákot kihagynak egy csoportmunkából, és a végén ő kapja a rossz jegyet).\n2. Játsszátok el újra. Most bárki kiálthat „Állj!”-t, beléphet egy szereplő helyére (nem a bántóéba), és kipróbálhat egy másik megoldást.\n3. Minden beavatkozás után kérdezd meg a csoportot: mi változott? Reális volt-e?\n4. 3–4 beavatkozás után állítsátok le a jelenetet.\n5. Feldolgozás: Melyik megoldás tűnt a legreálisabbnak? Mi kellett ahhoz, hogy valaki belépjen? Hol tudnál a valóságban is így belépni?", "caution": "A végén mindenki lépjen ki a szerepéből. Ügyelj, hogy a bántó szereplőt ne mindig ugyanaz játssza.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC08-92", "theme_id": "t08", "name": "Három válasz egy helyzetre", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Ugyanarra a helyzetre passzív, agresszív és asszertív választ adunk, és megnézzük, melyik mit vált ki.", "tools": "helyzetkártyák, a három stílus leírása a táblán", "keywords": "asszertivitás, passzivitás, agresszió, kommunikáció, önérvényesítés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mutasd be a három stílust: passzív (lenyelem, hogy ne legyen baj), agresszív (rátámadok a másikra), asszertív (kiállok magamért úgy, hogy a másikat is tisztelem).\n2. Olvass fel egy helyzetet (pl. valaki eléd áll a büfénél; a csoportmunkában a te ötletedet más mondja el a sajátjaként).\n3. Hármas csoportok mindhárom választ megfogalmazzák és eljátsszák.\n4. A csoport megbeszéli: mit érez a másik fél az egyes válaszokra, és mi lesz a helyzet vége?\n5. Feldolgozás: Melyik stílus a te alapbeállításod? Miért nehéz asszertívnak lenni? Melyik helyzetben gyakorolnád ezen a héten?", "caution": "Hangsúlyozd, hogy néha a passzív válasz is jó döntés lehet (pl. veszélyes helyzetben).  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC09-91", "theme_id": "t09", "name": "Mindenkinél egy darab", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Egy feladványt csak úgy lehet megoldani, ha mindenki megosztja a nála lévő információt. Megnézzük, mi segíti a közös gondolkodást.", "tools": "feladvány darabjai cetliken (pl. egy rejtvény, ahol mindenki egy-egy nyomot kap)", "keywords": "csapatmunka, információmegosztás, kommunikáció, figyelem, közös probléma", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Készíts elő egy rejtvényt (pl. „Ki melyik házban lakik?” típusú logikai feladvány), és bontsd szét a nyomokat úgy, hogy egy 5–6 fős csoportban mindenkinél 1–2 legyen.\n2. Szabály: a nyomokat csak szóban lehet megosztani, a cetlit nem lehet megmutatni.\n3. A csoportok 15 percig dolgoznak a megoldáson.\n4. Ha kész, a csoport elmagyarázza, hogyan jutottak el a megoldásig.\n5. Feldolgozás: Hogyan szerveződtetek meg? Volt-e, akinek a nyomát elfelejtették meghallgatni? Mi segítette és mi akadályozta a közös gondolkodást? Hol hasonlít ez egy iskolai csoportmunkára?", "caution": "Figyeld, hogy a csendesebbek nyomai is elhangozzanak. Ezt a feldolgozásban is érdemes szóba hozni.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC10-91", "theme_id": "t10", "name": "Ami a nehézből jött", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "9", "description": "Egy nehéz élményre visszatekintve megkeressük, mit tanultunk belőle, vagy mi jó született belőle, anélkül hogy a nehezet szépítenénk.", "tools": "A4-es lapok", "keywords": "hála, átkeretezés, reziliencia, tanulás, megküzdés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mondd el: néha egy nehéz helyzetből is születik valami, amiért később hálásak vagyunk (egy új barát, egy erősség, egy tanulság). Ez nem jelenti azt, hogy a nehéz jó volt.\n2. Mindenki felidéz egy múltbeli, már lezárt kisebb nehézséget, és felírja: Mi volt nehéz? Mit tanultam? Ki segített? Mi lett belőle?\n3. Párban, aki szeretné, megosztja a történetét, csak amennyit akar.\n4. Közösen gyűjtsétek össze a „tanulságokat” névtelenül a táblára.\n5. Feldolgozás: Miért fontos, hogy a nehezet ne szépítsük? Mire vagy hálás egy nehéz időszakból? Kinek köszönnéd meg, hogy akkor melletted volt?", "caution": "Kérd, hogy már lezárt, nem friss nehézséget válasszanak. Senkit ne kényszeríts arra, hogy egy fájdalmas élményben a jót keresse.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC12-91", "theme_id": "t12", "name": "Amikor eltávolodunk", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Beszélünk arról, hogy a barátságok változnak, és hogyan lehet jól kezelni, ha eltávolodunk valakitől, vagy valaki tőlünk.", "tools": "történetkártyák", "keywords": "barátság, változás, elengedés, kapcsolatok, gyász", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: ki az, aki 5 évvel ezelőtt a legjobb barátod volt? Most is az? (Csak gondolatban válaszoljanak.)\n2. Kiscsoportok kapnak egy történetet (pl. a barátod új társaságba került és ritkán keres; te kerültél új csapatba, és a régi barátod megsértődött; egy barátság egy vita után kihűlt).\n3. Megbeszélik: mit érezhet a két fél? Mit lehet tenni? Mikor érdemes harcolni egy barátságért, és mikor elengedni?\n4. Gyűjtsétek a táblára, hogyan lehet szépen eltávolodni (pl. nem kibeszélni, köszönni, nyitva hagyni az ajtót).\n5. Feldolgozás: Rendben van-e, hogy a barátságok változnak? Mit tanítottak neked a régi barátságaid? Kit keresnél meg szívesen újra?", "caution": "Ha valakinek friss, fájdalmas barátságvesztése van, kezeld óvatosan, és ne kérj tőle történetet.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC12-92", "theme_id": "t12", "name": "Pöttyök", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "9", "description": "Egy szavak nélküli csoportosulási játékon keresztül megtapasztaljuk, milyen érzés bekerülni vagy kimaradni, és hogyan alakulnak ki a klikkek.", "tools": "színes öntapadós pöttyök (néhány szín sokszor, egy-két szín csak egyszer)", "keywords": "kirekesztés, klikkek, csoportosulás, befogadás, tapasztalati tanulás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki becsukja a szemét, te pedig a homlokukra ragasztasz egy pöttyöt. A legtöbben valamelyik gyakori színt kapják, egy-két ember egyedi színt.\n2. Szabály: beszélni nem szabad, csak egy feladat van: „Alkossatok csoportokat.” (Ne mondd meg, mi alapján.)\n3. Figyeld meg, hogyan csoportosulnak, és mi történik az egyedi pöttyösökkel. Kb. 3 perc után állítsd le.\n4. Kérdezd meg először az egyedi pöttyösöket: mit éreztek? Aztán a többieket: miért szín szerint csoportosultatok, ha nem ez volt a feladat?\n5. Feldolgozás: Hol látunk ilyet a valóságban? Mi alapján csoportosulunk (stílus, zene, lakóhely)? Mit tehettek volna a többiek a magányos pöttyösökért? Mit viszel ebből az osztályba?", "caution": "Az egyedi pöttyöt olyan diák kapja, akiről tudod, hogy jól bírja. Soha ne olyan, aki valóban kívülálló a csoportban. A gyakorlat után mindenkit hozz vissza a körbe.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC13-91", "theme_id": "t13", "name": "Kirakat és raktár", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "A közösségi médiában a kirakatot látjuk, nem a raktárt. Megnézzük, hogyan hat ránk az összehasonlítás, és mit tehetünk ellene.", "tools": "két rajz a táblán: kirakat és raktár, cetlik", "keywords": "összehasonlítás, közösségi média, önértékelés, valóság, irigység", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Rajzolj egy kirakatot (szép, rendezett) és egy raktárt (kupi, dobozok). Mondd el: online a többiek kirakatát látjuk, de a saját raktárunkkal hasonlítjuk össze.\n2. Mindenki felír egy-egy példát: mi kerül egy posztba (kirakat), és mi marad ki belőle (raktár)? Pl. a nyaralásfotó 30 próbálkozásból, a veszekedés előtte.\n3. Kiscsoportok összegyűjtik, milyen érzéseket kelt bennünk a kirakatok nézegetése.\n4. Kitalálnak 3 „ellenszert” (pl. kikövetni, ami rosszul esik; emlékeztetni magam a raktárra; offline barátokkal lenni).\n5. Feldolgozás: Kinek a kirakatával hasonlítod össze magad a legtöbbször? Mit posztolnál, ha a raktárt is megmutatnád? Melyik ellenszert próbálod ki?", "caution": "A testképpel kapcsolatos összehasonlítást óvatosan kezeld. Ha étkezési problémára utaló jelet látsz, beszélj a diákkal négyszemközt, és kérj szakmai segítséget.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC14-91", "theme_id": "t14", "name": "Amit nem adok fel", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Megnézzük, miért olyan fontos tartozni valahová, és mi az a néhány érték, amit akkor sem adnánk fel, ha a társaság mást várna.", "tools": "A4-es lapok, tábla", "keywords": "összetartozás, értékek, kortárs nyomás, határok, önazonosság", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: miért olyan fontos, hogy valahová tartozzunk? Mi történik, ha kimaradunk? Gyűjtsétek a táblára.\n2. Mindenki felír 3 dolgot, amit szívesen megtenne a társasága kedvéért (pl. elmegy egy koncertre, amit nem szeret), és 3 dolgot, amit soha (pl. bántani valakit, hazudni a szüleinek valami fontosról).\n3. Párban beszélgetnek: hol a határ a kettő között? Mi dönti el?\n4. Közösen gyűjtsétek össze, mit lehet mondani, ha a társaság a „soha” listádról kér valamit.\n5. Feldolgozás: Mit veszítesz, ha feladod azt, ami fontos neked? Milyen az a barát, aki elfogadja a nemedet? Mi az a mondat, amit magadnak mondasz, amikor kitartasz?", "caution": "Ne kérd, hogy a „soha” listát a csoport előtt felolvassák.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC15-91", "theme_id": "t15", "name": "Az alvás titkai", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "9", "description": "Megnézzük, hogyan hat az alvás a hangulatra, a tanulásra és a stresszre, és mindenki kitalál egy kis változtatást.", "tools": "kvízkérdések, A4-es lapok", "keywords": "alvás, stressz, egészség, szokások, tanulás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kezdj egy rövid igaz–hamis kvízzel (pl. „A kamaszoknak 8–10 óra alvás kell.” „A telefon kék fénye segít elaludni.” „Hétvégén be lehet hozni a hét alváshiányát.”).\n2. Beszéljétek meg a válaszokat: mit tesz az agy alvás közben (rendezi a tanultakat, szabályozza az érzelmeket)?\n3. Mindenki felírja az átlagos lefekvési és ébredési idejét, és kiszámolja, mennyit alszik.\n4. Kiscsoportok összegyűjtik, mi segít elaludni és mi tart ébren.\n5. Feldolgozás: Mennyit alszol egy átlagos hétköznap? Mi az, ami a legtöbbször ébren tart? Mi az az egy kis változtatás, amit ezen a héten kipróbálsz?", "caution": "Ha valaki tartós alvászavarról vagy éjszakai szorongásról beszél, irányítsd iskolaorvoshoz vagy pszichológushoz.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC15-92", "theme_id": "t15", "name": "Támaszpontjaim", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Feltérképezzük, kire és mire támaszkodhatunk, ha nehéz: emberekre, helyekre, tevékenységekre és szakemberekre.", "tools": "A4-es lapok, színes ceruzák, iskolai segítők elérhetősége", "keywords": "támogatás, segítségkérés, kapcsolati háló, stressz, biztonság", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki a lap közepére rajzolja magát, köré négy kört: emberek, helyek, tevékenységek, szakemberek.\n2. Kitöltik: ki az, akit felhívhatok? Hol érzem magam biztonságban? Mi tölt fel? Melyik felnőtthöz vagy szakemberhez fordulhatok?\n3. Párban megnézik, melyik kör a legüresebb, és ötletet adnak egymásnak.\n4. Mutasd meg az iskola segítőinek elérhetőségét (iskolapszichológus, védőnő, osztályfőnök), és mondd el, hogyan lehet hozzájuk fordulni.\n5. Feldolgozás: Melyik támaszpontodat használod túl ritkán? Mi tart vissza a segítségkéréstől? Mit mondanál egy barátodnak, aki nem mer segítséget kérni?", "caution": "Ha valakinek nagyon üres a térképe, figyelj rá, és beszélj vele négyszemközt.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC16-91", "theme_id": "t16", "name": "Jó kockázat, rossz kockázat", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Megkülönböztetjük az egészséges kockázatot (ami fejleszt) a veszélyestől (ami árthat), és megnézzük, mi alapján döntünk.", "tools": "skála a padlón (1 = jó kockázat, 10 = veszélyes kockázat), helyzetkártyák", "keywords": "kockázatvállalás, bátorság, döntés, következmények, biztonság", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Olvass fel helyzeteket (pl. jelentkezem egy versenyre; kipróbálok egy új sportot; éjjel egyedül hazamegyek egy ismeretlen helyről; megszólalok egy vitában; felülök egy idegen autójába). Mindenki odaáll a skálán, ahová szerinte tartozik.\n2. Beszéljétek meg az eltéréseket.\n3. Gyűjtsétek össze a jó kockázat ismérveit: tanulok belőle, legrosszabb esetben is csak kellemetlen, nem veszélyes, magam döntöm el.\n4. Mindenki felír egy jó kockázatot, amit szívesen vállalna ebben az évben.\n5. Feldolgozás: Miért vonzó néha a veszélyes kockázat? Ki segít eldönteni, mi veszélyes? Mi a te jó kockázatod?", "caution": "A veszélyes helyzetekről ne tarts kioktató előadást: kérdezz, és hagyd, hogy a csoport gondolja végig.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC16-92", "theme_id": "t16", "name": "Egy cél, öt lépés", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "9", "description": "Egy saját célt konkrét, mérhető lépésekre bontunk, és megtervezzük az első lépést a következő hétre.", "tools": "A4-es lapok", "keywords": "célkitűzés, tervezés, motiváció, lépések, kitartás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki kiválaszt egy célt erre a félévre (tanulás, sport, kapcsolat, hobbi).\n2. Átírja konkrétra: Mit pontosan? Meddig? Honnan tudom, hogy sikerült?\n3. Felírja öt lépésben az utat a célig, az elsőt a legkisebbre véve.\n4. Párban elmondják egymásnak az első lépést és azt, mi akadályozhatja meg. Megbeszélik, mit tesznek, ha az akadály jön.\n5. Feldolgozás: Mi volt nehéz a cél konkrétra fogalmazásában? Mi az első lépésed, és mikor teszed meg? Ki az, aki szurkolhat neked?", "caution": "A célok maradjanak a diákoké. Ne értékeld őket a csoport előtt.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC17-91", "theme_id": "t17", "name": "Tanácsok az új 9.-eseknek", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "9", "description": "Visszatekintünk a 9. évre, és tanácsokat írunk a jövő évi 9.-eseknek: mit érdemes tudni, mitől ne féljenek.", "tools": "A4-es lapok, csomagolópapír", "keywords": "visszatekintés, tanácsadás, tapasztalat, lezárás, közösség", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mit tudtok most, amit szeptemberben jó lett volna tudni?\n2. Kiscsoportok témákat kapnak (tanulás, barátok, tanárok, órák, stressz), és mindegyikhez 3–5 tanácsot írnak.\n3. A tanácsokat közös plakátra vagy lapra gyűjtitek „Útmutató az új 9.-eseknek” címmel.\n4. A plakátot jövőre megmutathatod az új 9.-eseknek.\n5. Feldolgozás: Melyik tanács szól valójában neked is? Mi az, amire büszke vagy ebből az évből? Mit csinálnál másképp, ha újrakezdhetnéd?", "caution": "Nézd át a tanácsokat, mielőtt továbbadod, hogy ne legyen bennük bántó vagy kínos részlet.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC17-92", "theme_id": "t17", "name": "Közös vers az évről", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "9", "description": "Mindenki ír egy sort az évről, és ezekből közös verset állítunk össze, amit a végén felolvasunk.", "tools": "papírcsíkok, ragasztó, nagy lap", "keywords": "kreatív írás, lezárás, közösség, emlékek, búcsú", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki kap két papírcsíkot. Az egyikre egy mondatot ír arról, milyen volt ez az év, a másikra egy mondatot arról, mit kíván a csoportnak.\n2. A csíkokat összegyűjtöd, és a csoport közösen rakja őket sorrendbe egy nagy lapon, hogy vershez hasonló szöveg legyen belőle.\n3. Választhatnak egy címet.\n4. Egy önként jelentkező vagy te felolvasod a verset.\n5. Feldolgozás: Melyik sor tetszett a legjobban? Mi az, amit a vers jól elmond az évről? Mit kívánsz a csoportnak a 10. évre?", "caution": "Ügyelj, hogy minden sor bekerüljön. A verset kiteheted a terembe.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC01-101", "theme_id": "t01", "name": "Megújított megállapodás", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "A gimnázium felénél újragondoljuk a csoport megállapodásait: mi vált be, mi kopott ki, és mire van most szükségünk.", "tools": "a korábbi csoportszerződés (ha megvan), cetlik három színben", "keywords": "csoportszerződés, megújítás, felelősség, közös szabályok, felnövés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Tedd ki a korábbi szerződést, vagy kérd, hogy idézzék fel, milyen szabályaik voltak.\n2. Mindenki három színű cetlire ír: zöld – ami működik, maradjon; sárga – ami kikopott, de kellene; piros – ami már nem illik hozzánk.\n3. A cetliket felragasztjátok, és közösen csoportosítjátok.\n4. Kiscsoportok megfogalmaznak 1–2 új pontot, amire most, 10.-esként van szükség (pl. a telefonhasználat, a mélyebb beszélgetések bizalma).\n5. Feldolgozás: Mi változott a csoportban 7. óta? Mit jelent felelősnek lenni egy csoportért? Ki vállal a csoportban valamit azért, hogy a megállapodás működjön?", "caution": "A régi szerződést ne kritizáld: akkor az volt a jó. A változás a fejlődés jele.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC01-102", "theme_id": "t01", "name": "A csoport erősségtérképe", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Feltérképezzük, miben erős a csoportunk, hol vannak a fejlődési pontjaink, és mit tehet ezért mindenki.", "tools": "csomagolópapír négy mezővel, filcek", "keywords": "csoporterősségek, fejlődés, közösség, önreflexió, csoportkép", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Oszd négy mezőre a nagy lapot: Miben vagyunk jók? Mi nehéz nekünk? Mi segíthetne? Mit tehetek én?\n2. Mindenki körbejár, és minden mezőbe ír legalább egy gondolatot.\n3. Kiscsoportok egy-egy mezőt összefoglalnak 3 pontban.\n4. Közösen kiválasztjátok, melyik „Mi segíthetne?” ötletet próbáljátok ki a következő hetekben.\n5. Feldolgozás: Mi lepett meg a csoportról? Melyik erősségre lehetünk büszkék? Mit vállalsz te a közös ötletből?", "caution": "A „Mi nehéz nekünk?” mezőben ne konkrét emberekről legyen szó. Ha bántó beírás jelenik meg, beszéljétek meg a szabályok fényében.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC02-101", "theme_id": "t02", "name": "Irigység vagy féltékenység?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Két gyakran összekevert érzést választunk szét, és megnézzük, mit üzennek nekünk.", "tools": "helyzetkártyák, két felirat", "keywords": "irigység, féltékenység, érzelmek megkülönböztetése, önismeret, kapcsolatok", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mondd el a különbséget: irigység – szeretném, ami a másiknak van; féltékenység – félek, hogy elveszítek valakit vagy valamit, ami az enyém.\n2. Olvass fel helyzeteket (pl. a barátod jobb jegyet kapott; a legjobb barátod új barátot talált; a tesód új telefont kapott; a párod sokat beszél valaki mással). Mindenki eldönti, melyik érzés lehet.\n3. Kiscsoportok megkeresik, mit üzen az irigység (mit szeretnék én is?) és mit a féltékenység (mitől félek?).\n4. Gyűjtsétek össze, mit lehet kezdeni mindkettővel úgy, hogy ne ártson.\n5. Feldolgozás: Melyik érzést nehezebb bevallani? Mi a különbség aközött, hogy érzek valamit, és aközött, hogy mit teszek vele? Mit tanultál magadról egy irigy vagy féltékeny pillanatból?", "caution": "A párkapcsolati féltékenységnél emeld ki: a kontrolláló viselkedés nem a szeretet jele.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC02-102", "theme_id": "t02", "name": "Maszk kívül, maszk belül", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Papírmaszkot készítünk: a külsejére azt írjuk, amit megmutatunk magunkból, a belsejébe azt, amit érzünk, de elrejtünk.", "tools": "papírtányérok vagy maszksablonok, filcek", "keywords": "maszk, rejtett érzések, hitelesség, önkifejezés, bizalom", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mikor mosolygunk, pedig nincs kedvünk? Miért tesszük?\n2. Mindenki kap egy maszkot. A külsejére azt írja vagy rajzolja, amit mások látnak rajta (pl. vidám, laza, okos). A belsejébe azt, amit sokszor nem mutat meg (pl. fáradt, bizonytalan, magányos).\n3. Mindenki csak a maszk külsejét mutatja meg. A belsejét megtartja.\n4. Beszéljétek meg: mikor véd a maszk, és mikor terhel?\n5. Feldolgozás: Kivel tudod levenni a maszkot? Mi kellene ahhoz, hogy ebben a csoportban is kicsit levehesd? Mit gondolsz, mások maszkja mögött mi lehet?", "caution": "A maszk belsejét senkinek ne kelljen megmutatnia. Figyelj azokra, akiket felkavar a gyakorlat.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC02-103", "theme_id": "t02", "name": "EQ-tükör", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Rövid önértékelő kérdőívvel megnézzük, az érzelmi intelligencia melyik területén vagyunk erősek, és hol fejlődnénk.", "tools": "rövid kérdőív (pl. 15 állítás 1–5-ös skálán az öntudatosságról, önszabályozásról, empátiáról, kapcsolatokról)", "keywords": "érzelmi intelligencia, önértékelés, önismeret, fejlődés, célok", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mondd el röviden az érzelmi intelligencia négy területét: érzéseim felismerése, kezelése, mások érzéseinek megértése, kapcsolataim kezelése.\n2. Mindenki kitölti a kérdőívet, és területenként összeadja a pontjait.\n3. Mindenki kiválasztja a legerősebb és a legkevésbé erős területét.\n4. Kiscsoportok, akik ugyanazon a területen szeretnének fejlődni, ötleteket gyűjtenek egymásnak.\n5. Feldolgozás: Meglepett az eredmény? Hogyan változott ez a 7. óta szerinted? Mi az az egy dolog, amit a gyengébb területeden kipróbálsz?", "caution": "A kérdőív nem teszt, és nincs jó vagy rossz eredmény. Az eredményeket senkinek nem kell megmutatnia.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC03-101", "theme_id": "t03", "name": "Az első késztetés", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Megfigyeljük az első késztetéseinket (visszaszólni, telefonhoz nyúlni, enni, otthagyni), és gyakoroljuk, hogyan teremtsünk szünetet a késztetés és a tett között.", "tools": "A4-es lapok", "keywords": "impulzuskontroll, késztetés, szünet, tudatosság, önszabályozás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: milyen gyakran nyúlsz a telefonodhoz egy óra alatt anélkül, hogy eldöntötted volna?\n2. Mutasd be a késztetés-hullámot: a késztetés felerősödik, majd ha nem engedünk neki, gyengül. Ez az „impulzus-szörf”.\n3. Kis kísérlet: 5 percig senki nem nyúl a telefonjához, és mindenki felírja, hányszor érzett késztetést, és mit érzett közben.\n4. Kiscsoportok összegyűjtik a leggyakoribb késztetéseiket és azt, mi segít kivárni őket (pl. számolás, légzés, kérdés: mire van most valójában szükségem?).\n5. Feldolgozás: Hányszor érezted a késztetést? Mi történt, amikor kivártad? Melyik késztetésedre figyelsz ezen a héten?", "caution": "Nem a késztetés a rossz, hanem ha mindig gondolkodás nélkül engedünk neki. Ezt hangsúlyozd.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC03-102", "theme_id": "t03", "name": "A túlérzékeny füstjelző", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Megértjük, mi a szorongás feladata, és miért riaszt néha akkor is, amikor nincs valódi veszély.", "tools": "tábla, cetlik", "keywords": "szorongás, félelem, testi tünetek, megértés, megküzdés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mi a füstjelző dolga? (Riasztani tűz esetén.) Mi történik, ha egy pirítós miatt is szól?\n2. Magyarázd el: a szorongás olyan, mint a füstjelző. Védeni akar, de néha túl érzékeny. Ilyenkor a test úgy reagál (szívdobogás, gyomorgörcs, izzadás), mintha veszély lenne.\n3. Mindenki felír 2–3 helyzetet, ahol szólt a füstjelzője, és eldönti: valódi tűz volt vagy pirítós?\n4. Kiscsoportok összegyűjtik, mi segít „lecsendesíteni a füstjelzőt” (légzés, tények ellenőrzése, kis lépésekben szembenézni, beszélni róla).\n5. Feldolgozás: Mikor jó, hogy van füstjelzőnk? Mi segít neked, ha feleslegesen riaszt? Mikor érdemes szakemberhez fordulni, ha túl gyakran szól?", "caution": "Ha valaki pánikrohamokról vagy tartós szorongásról beszél, irányítsd iskolapszichológushoz. Ne diagnosztizálj.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC03-103", "theme_id": "t03", "name": "Mozdulj a hangulatodért", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "10", "description": "Egy rövid kísérletben megmérjük, hogyan változtat a hangulatunkon három perc mozgás, és összegyűjtjük, milyen mozgás kinek segít.", "tools": "zene, hely a mozgáshoz, cetlik", "keywords": "mozgás, hangulat, energia, önszabályozás, kísérlet", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki felírja egy 1–10-es skálán: mennyi energiám van most, és milyen a hangulatom?\n2. 3 perc mozgás zenére: helyben futás, nyújtás, tánc, ugrálás, ki-ki a saját tempójában.\n3. Újra mindenki felírja a két számot.\n4. Hasonlítsátok össze: hány embernél változott? Milyen irányba?\n5. Feldolgozás: Mit vettél észre a testedben? Mikor tudnál beiktatni egy ilyen 3 percet egy nehéz napon? Milyen mozgás tölt fel téged a legjobban?", "caution": "Senkit ne kényszeríts a mozgásra; aki nem szeretne, ülve is csinálhat nyújtást. Akinek egészségügyi korlátja van, az válasszon kíméletes mozgást.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC04-101", "theme_id": "t04", "name": "Két érték ütközik", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "10", "description": "Olyan dilemmákat vitatunk meg, ahol két fontos értékünk kerül szembe egymással, és megnézzük, mi alapján döntünk.", "tools": "dilemmakártyák", "keywords": "értékek, dilemma, döntés, etika, önismeret", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Olvass fel egy dilemmát: „A legjobb barátod puskázott a dolgozaton, és a tanár mindenkit büntet, ha nem derül ki, ki volt.” Melyik két érték ütközik itt? (Hűség és igazságosság.)\n2. Kiscsoportok kapnak egy-egy dilemmát (pl. őszinteség vagy kedvesség; szabadság vagy biztonság; saját cél vagy családi elvárás).\n3. Megbeszélik: melyik két érték ütközik? Mit tennének? Mi lenne a döntésük ára?\n4. A csoportok bemutatják a dilemmát és a döntésüket, a többiek kérdezhetnek.\n5. Feldolgozás: Volt-e olyan dilemma, ahol nem tudtatok dönteni? Mi segít ilyenkor? Melyik értéked a legfontosabb neked most, és melyik változott az elmúlt években?", "caution": "Nincs helyes válasz. Ügyelj, hogy senki ne ítélje el a másik döntését.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC04-102", "theme_id": "t04", "name": "A két belső hang", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Megismerkedünk a belső kritikusunkkal és a belső szurkolónkkal, és gyakoroljuk, hogyan adjunk több teret a szurkolónak.", "tools": "A4-es lapok két oszloppal", "keywords": "belső hang, önkritika, önegyüttérzés, önbizalom, belső beszéd", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mit mond a fejedben egy hang, amikor hibázol? Milyen a hangszíne?\n2. Mindenki felírja a bal oszlopba a belső kritikusa 3 tipikus mondatát.\n3. A jobb oszlopba mindegyikre megírja, mit mondana egy szurkoló, aki ismeri és szereti őt (nem hazug dicséret, hanem bátorítás).\n4. Párban felolvassák egymásnak a szurkoló mondatait.\n5. Feldolgozás: Kinek a hangjára hasonlít a belső kritikusod? Mi a haszna a belső kritikusnak, és mikor árt? Melyik szurkolómondatot viszed magaddal?", "caution": "A kritikus mondatokat ne kelljen hangosan felolvasni. Figyelj azokra, akiknél nagyon erős a belső kritika.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC05-101", "theme_id": "t05", "name": "Előbb megértem, aztán felelek", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Vitában gyakoroljuk, hogy mielőtt válaszolnánk, a másik szavait úgy foglaljuk össze, hogy ő is elfogadja.", "tools": "vitatémák (pl. kötelező legyen-e az egyenruha; jó-e a mesterséges intelligencia a tanulásban)", "keywords": "aktív hallgatás, vita, összefoglalás, megértés, tisztelet", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mondd el a szabályt: csak akkor válaszolhatsz, ha előbb összefoglaltad a másik álláspontját, és ő azt mondta: „Igen, erre gondoltam.”\n2. Párokban vitáznak egy témán 5 percig a szabály szerint.\n3. Csere: most mindenki a másik oldalt képviseli.\n4. Néhány pár elmondja, mi történt.\n5. Feldolgozás: Miben változott a vita a szabálytól? Mikor értetted meg jobban a másikat? Miért nehéz előbb megérteni, és csak utána felelni? Hol hasznos ez otthon?", "caution": "Ha a vita elmérgesedik, állítsd meg, és emlékeztess a szabályra.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC05-102", "theme_id": "t05", "name": "Három másodperc csend", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Gyakoroljuk, hogyan bírjuk ki a csendet egy beszélgetésben, és megtapasztaljuk, hogy a csend teret ad a másiknak.", "tools": "témakártyák, stopper", "keywords": "csend, türelem, aktív hallgatás, tér, mélyebb beszélgetés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: miért kínos a csend egy beszélgetésben? Mit szoktunk tenni, hogy ne legyen?\n2. Párban egyikük egy mélyebb kérdésre válaszol (pl. Mi foglalkoztat mostanában? Mire vagy büszke, amit kevesen tudnak?). A hallgató szabálya: minden válasz után vár három másodpercet, mielőtt bármit mond.\n3. 4 perc után csere.\n4. Beszéljétek meg, mi történt a csendekben.\n5. Feldolgozás: Mondott-e a párod többet a csend után? Milyen volt kibírni a csendet? Kivel tudnál ilyen türelmesen beszélgetni ezen a héten?", "caution": "A kérdések maradjanak önkéntes mélységűek; a válaszoló dönti el, mennyit mond.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC06-101", "theme_id": "t06", "name": "Segítek, de vigyázok magamra", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "10", "description": "Megbeszéljük, hogyan lehet valaki mellett lenni úgy, hogy közben mi magunk is épek maradjunk, és mikor kell felnőttet bevonni.", "tools": "helyzetkártyák", "keywords": "empátia, határok, segítés, önvédelem, felnőtt bevonása", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: volt már, hogy egy barátod gondja annyira megviselt, hogy te is rosszul lettél tőle?\n2. Rajzolj két kört a táblára: a sajátom és a barátomé. Mondd el: az empátia az, hogy megértem az ő körét, de nem költözöm bele.\n3. Kiscsoportok kapnak egy helyzetet (pl. a barátod minden este írt neked, hogy szomorú; egy osztálytárs elmondja, hogy otthon nagy a baj, de kéri, hogy ne szólj senkinek).\n4. Megbeszélik: mit tehetek én? Mit nem kell vállalnom? Mikor kell felnőttnek szólni, akkor is, ha a barátom nem akarja?\n5. Feldolgozás: Miért nehéz felnőttet bevonni? Mi a különbség a titoktartás és a veszélyes titok között? Te mivel töltődsz fel, ha valakit támogatsz?", "caution": "Emeld ki: ha valaki veszélyben van (önsértés, bántalmazás), szólni kell egy felnőttnek, és ez nem árulás. Add meg az iskolai segítők elérhetőségét.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC06-102", "theme_id": "t06", "name": "Címkék a homlokon", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "10", "description": "Mindenki egy láthatatlan címkét kap a homlokára (pl. „Nevess rajtam”, „Hallgass rám”), és a többiek eszerint bánnak vele. Megtapasztaljuk, hogyan formálják a címkék a viselkedést.", "tools": "öntapadós címkék előre megírt utasításokkal", "keywords": "előítélet, címkézés, bánásmód, önbeteljesítő jóslat, empátia", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki homlokára ragassz egy címkét úgy, hogy ő ne lássa (pl. „Kérdezd meg a véleményét”, „Hagyd figyelmen kívül”, „Dicsérd meg”, „Szakítsd félbe”). A negatív címkéket olyan diákok kapják, akik jól bírják.\n2. Kiscsoportok 8 percig közösen terveznek egy osztálybulit, és a címkék szerint bánnak egymással.\n3. Állítsd le. Mindenki megtippeli, mi állhat a címkéjén, mielőtt leveszi.\n4. Kérdezd meg: mit éreztetek? Hogyan változott a viselkedésetek a bánásmód hatására?\n5. Feldolgozás: Hol vannak a valóságban ilyen címkék (új diák, „a csendes”, „a bohóc”)? Hogyan hat a címke arra, aki viseli? Mit tehetünk, hogy ne címkézzünk?", "caution": "Gondosan válaszd ki, ki kap negatív címkét; soha ne olyan, aki valóban kirekesztett. A végén mindenki vegye le a címkét, és mondjon egy kedves mondatot a mellette ülőnek.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC07-101", "theme_id": "t07", "name": "Beszélgetés otthon", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Felkészülünk egy nehéz beszélgetésre a szüleinkkel: mit szeretnénk elérni, és hogyan mondjuk el úgy, hogy meghallgassanak.", "tools": "A4-es lapok, helyzetkártyák (kimaradás, fakultáció, zsebpénz, képernyőidő)", "keywords": "családi kommunikáció, EMK, tárgyalás, kérés, felkészülés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: miről a legnehezebb beszélni otthon? Gyűjtsetek témákat (nem személyes részletekkel).\n2. Mindenki kiválaszt egy témát, és felírja: Mit szeretnék elérni? Mit érezhet a szülőm? Mi a közös bennünk? Mi lenne egy jó első mondat?\n3. Párban eljátsszák a beszélgetés elejét: az egyik a diák, a másik a szülő. Csere.\n4. Gyűjtsétek a táblára, mi segített: időzítés, nyugodt hangnem, a szülő szempontjának elismerése, kompromisszum ajánlása.\n5. Feldolgozás: Mi lepett meg, amikor szülőt játszottál? Mikor a legjobb időpont egy nehéz beszélgetésre? Mi az a beszélgetés, amit ezen a héten elkezdesz?", "caution": "Lehet, hogy nem mindenkinek biztonságos az otthoni beszélgetés. Ha valaki erre utal, beszélj vele négyszemközt.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC07-102", "theme_id": "t07", "name": "Nyugodt válasz a csoportchatben", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Felforrósodott csoportchat-üzenetekre írunk nyugodt, EMK-alapú válaszokat, és megnézzük, hogyan lehet írásban lecsillapítani egy vitát.", "tools": "kinyomtatott kitalált chatbeszélgetések", "keywords": "online kommunikáció, EMK, deeszkaláció, csoportchat, írásbeli hangnem", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mutass egy kitalált chatbeszélgetést, ahol egy félreértés miatt egyre durvább üzenetek jönnek.\n2. Kiscsoportok megkeresik, hol lehetett volna megállítani a vitát.\n3. Megírnak egy nyugodt választ a beszélgetés egy pontjára (megfigyelés, érzés, kérés; vagy javaslat, hogy beszéljék meg szóban).\n4. Felolvassák, a többiek eldöntik, melyik válasz csillapítaná le a legjobban a helyzetet.\n5. Feldolgozás: Miért durvulnak el gyorsabban az online viták? Mikor jobb nem válaszolni azonnal? Mi az a mondat, amit beírsz legközelebb, ha egy chat elszabadul?", "caution": "Ne használjatok valós csoportchateket és neveket.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC08-101", "theme_id": "t08", "name": "Újrakezdés egy barát után", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Végiggondoljuk, hogyan lehet egy komoly vita után újra felvenni a kapcsolatot egy baráttal, és gyakoroljuk az első lépést.", "tools": "helyzetkártyák", "keywords": "kibékülés, barátság, első lépés, konfliktus utáni helyreállítás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mi a legnehezebb egy vita után? (Az első lépés.) Miért?\n2. Mutasd be a kibékülés négy lépését: 1. megkeresem; 2. elmondom, mi volt az én részem; 3. meghallgatom az ő oldalát; 4. megbeszéljük, hogyan tovább.\n3. Párban eljátszanak egy kibékülést egy helyzetkártya alapján (pl. elmaradt egy közös program, mert te mással mentél el; egy rossz megjegyzés miatt hetek óta nem beszéltek).\n4. Néhány pár bemutatja, a többiek visszajeleznek.\n5. Feldolgozás: Mi a különbség a „bocsi” és egy valódi kibékülés között? Mi van, ha a másik nem akar kibékülni? Van-e, akit szívesen újra megkeresnél?", "caution": "Senkit ne kérj valós, folyamatban lévő konfliktus eljátszására.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC08-102", "theme_id": "t08", "name": "Tűz és víz szavak", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "10", "description": "Összegyűjtjük, milyen szavak és mondatok szítják a vitát (tűz), és melyek csillapítják (víz).", "tools": "két oszlop a táblán, kártyák", "keywords": "eszkaláció, deeszkaláció, szóhasználat, konfliktus, kommunikáció", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Rajzolj egy tüzet és egy vízcseppet a táblára.\n2. Kiscsoportok 5 perc alatt összegyűjtenek tűzszavakat (pl. „mindig”, „soha”, „nyugodj már le”, gúnyos hangnem) és vízszavakat (pl. „értem”, „mit szeretnél?”, „igazad van abban, hogy…”).\n3. Felírjátok a táblára, és megbeszélitek, miért hatnak úgy.\n4. Párban eljátszanak egy rövid vitát először tűzszavakkal, aztán vízszavakkal.\n5. Feldolgozás: Melyik tűzszót mondod a leggyakrabban? Melyik vízszó a legnehezebb? Mi a helyzet a testbeszéddel: az is lehet tűz vagy víz?", "caution": "A „nyugodj már le” szándéka víz, hatása tűz: ezt érdemes külön megbeszélni.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC08-103", "theme_id": "t08", "name": "Osztálygyűlés-szimuláció", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "10", "description": "Egy kitalált osztályszintű konfliktust (pl. osztálykirándulás helyszíne) közösen döntünk el egy demokratikus, mindenki hangját meghalló folyamattal.", "tools": "szerepkártyák különböző érdekekkel, flipchart", "keywords": "csoportdöntés, demokrácia, érdekek, kompromisszum, részvétel", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mutasd be a helyzetet: az osztály 3 kirándulási helyszín közül választ, de vannak, akiknek fontos az ár, másoknak a program, megint másoknak, hogy a barátaikkal lehessenek.\n2. Mindenki kap egy szerepkártyát egy érdekkel.\n3. Vezesd a gyűlést: először minden érdek elhangzik (beszélőkörben), aztán szempontokat gyűjtötök, végül ötleteket keresve döntetek. Nem többségi szavazás a cél, hanem mindenki számára elfogadható döntés.\n4. Ha kész a döntés, mindenki megmondja, mennyire tudja elfogadni (1–5 ujjal).\n5. Feldolgozás: Kinek a hangja hallatszott a legjobban, és kié a legkevésbé? Miben más ez, mint a sima szavazás? Hol használhatnátok ezt a valódi osztályéletben?", "caution": "Figyelj a szerepkártyák egyensúlyára. Ha a szimuláció valós osztálykonfliktust idéz fel, állj meg, és kezeld külön.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC09-101", "theme_id": "t09", "name": "Ki húzza a szekeret?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Megbeszéljük, mi történik, amikor a csoportmunkában valaki nem dolgozik, és kitalálunk igazságos munkamegosztási szabályokat.", "tools": "helyzetkártyák, flipchart", "keywords": "csoportmunka, felelősség, potyautas, igazságosság, munkamegosztás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: ki volt már olyan csoportmunkában, ahol ő csinált mindent? És olyanban, ahol ő csinált a legkevesebbet? (Csak kézfeltartással.)\n2. Kiscsoportok összegyűjtik, miért marad ki valaki a munkából (nem érdekli, nem tudja, mit csináljon, nem merik bevonni, kényelmes).\n3. Mindegyik okra kitalálnak megoldást.\n4. Közösen megírjátok a „Jó csoportmunka 5 szabályát”.\n5. Feldolgozás: Melyik szerepben vagy a leggyakrabban? Hogyan lehet szólni valakinek, aki nem dolgozik, úgy, hogy ne legyen veszekedés? Mit csinálsz másképp a következő csoportmunkában?", "caution": "Ne konkrét csoportmunkákról és emberekről szóljon a beszélgetés.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC09-102", "theme_id": "t09", "name": "Különbözőségben az erő", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Megnézzük, milyen különböző erősségeket hoznak a csoporttagok, és hogyan egészítik ki egymást egy közös feladatban.", "tools": "erősségkártyák (pl. ötletgazda, szervező, részletekre figyelő, békítő, előadó, kitartó)", "keywords": "csapatszerepek, különbözőség, kiegészítés, erősségek, együttműködés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki kiválasztja a kártyák közül a 2 legjellemzőbb erősségét.\n2. Alakítsatok vegyes csoportokat úgy, hogy egy csoportban minél többféle erősség legyen.\n3. A csoportok kapnak egy 15 perces feladatot (pl. tervezzenek egy jótékonysági napot az iskolában), és tudatosan az erősségeik szerint osztják el a szerepeket.\n4. Bemutatják a tervet, és elmondják, ki mit tett hozzá.\n5. Feldolgozás: Milyen volt az erősséged szerint dolgozni? Melyik erősség hiányzott a csoportból? Mikor zavar minket, ha valaki nagyon más, mint mi, és mikor segít?", "caution": "Hangsúlyozd, hogy minden erősség értékes, a csendes, háttérben dolgozó szerepek is.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC10-101", "theme_id": "t10", "name": "Kritika, ami segít", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Gyakoroljuk, hogyan adjunk olyan kritikát, ami a másikat fejleszti, nem bántja.", "tools": "egy kitalált munka (pl. plakát vagy fogalmazás) kivetítve vagy kinyomtatva", "keywords": "konstruktív kritika, visszajelzés, fejlődés, tisztelet, konkrétság", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mutass egy kitalált diákmunkát. Kérd, hogy mondjanak róla kritikát, és írd fel a mondatokat.\n2. Beszéljétek meg, melyik mondat segítene a készítőnek, és melyik bántaná. Gyűjtsétek a jó kritika ismérveit: konkrét, a munkáról szól, nem a személyről, javaslatot ad, kedves hangú.\n3. Párban mindenki ír egy rövid szöveget (pl. egy bekezdést arról, mit csinálna egy szabadnapon), aztán kicserélik, és jó kritikát adnak rá.\n4. Megbeszélik, hogyan hatott rájuk a kapott kritika.\n5. Feldolgozás: Mi a különbség a kritika és a bántás között? Miért nehéz kritikát kapni? Kinek adnál ezen a héten segítő kritikát, és hogyan fogalmaznád meg?", "caution": "Ügyelj arra, hogy a páros kritikák kedvesek maradjanak.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC10-102", "theme_id": "t10", "name": "Akiket nem veszünk észre", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "10", "description": "Összegyűjtjük, kik dolgoznak az iskolában a háttérben (takarító, portás, konyhai dolgozó, karbantartó), és kitalálunk egy közös köszönetet nekik.", "tools": "kártyák, színes papír", "keywords": "hála, figyelem, tisztelet, közösség, iskolai élet", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: kik dolgoznak azért, hogy reggel tiszta legyen a terem, legyen ebéd, működjön a fűtés? Ismerjük a nevüket?\n2. Gyűjtsétek össze az iskola „láthatatlan” dolgozóit.\n3. Kiscsoportok kitalálnak és elkészítenek egy köszönetet (kártya, közös plakát, egy személyes köszönés).\n4. Megbeszéltek, mikor és hogyan adjátok át.\n5. Feldolgozás: Miért nem vesszük észre, aki a háttérben dolgozik? Milyen érzés lehet kapni egy ilyen köszönetet? Kik a „láthatatlan” segítők az életedben, például otthon?", "caution": "Egyeztesd előre az iskolavezetéssel és az érintettekkel, hogy a köszönet átadása kényelmes legyen nekik.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC12-101", "theme_id": "t12", "name": "Barát vagy, de ezt nem", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Gyakoroljuk, hogyan mondjunk nemet egy barátnak úgy, hogy a barátság megmaradjon.", "tools": "helyzetkártyák", "keywords": "határok, barátság, nemet mondás, asszertivitás, tisztelet", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: miért nehezebb nemet mondani a barátnak, mint egy idegennek?\n2. Mutasd be a „szendvics-nemet”: 1. elismerem a barátságot vagy a kérést („Tudom, hogy fontos ez neked.”); 2. kimondom a nemet („De ezt nem tudom vállalni.”); 3. ha lehet, mást ajánlok („Viszont segítek mással.”).\n3. Párban gyakorolják helyzetkártyákon (pl. a barátod a házidat kéri lemásolni; arra kér, hogy fedezd a szülei előtt; minden hétvégén vele kellene lenned).\n4. Néhány pár bemutatja, a többiek visszajeleznek.\n5. Feldolgozás: Mit érzel, amikor nemet mondasz egy barátnak? Mit jelent, ha egy barát nem fogadja el a nemedet? Hol kellene meghúznod egy határt mostanában?", "caution": "Ha valaki bántalmazó baráti vagy párkapcsolati helyzetre utal, beszélj vele négyszemközt.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC12-102", "theme_id": "t12", "name": "Egyedül a tömegben", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "10", "description": "Beszélünk a magányról: arról, hogy sok ember között is lehet egyedül érezni magunkat, és hogy mit tehetünk magunkért és másokért.", "tools": "cetlik, tábla", "keywords": "magány, kapcsolódás, elszigeteltség, figyelem, segítség", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: lehet-e magányos valaki, akinek sok követője van? Mi a különbség az egyedüllét és a magány között?\n2. Mindenki névtelenül felír egy helyzetet, amikor magányosnak érezte magát társaságban (nem kell részletezni).\n3. Olvass fel néhányat. Kérdezd meg: meglepő, hogy ennyi hasonló van?\n4. Kiscsoportok összegyűjtik, mi segít a magányon (megszólítani valakit, közös tevékenység, egy kérdés) és hogyan vehetjük észre, ha valaki magányos.\n5. Feldolgozás: Miért nehéz bevallani a magányt? Mit tehetsz, ha valakit magányosnak látsz? Kihez fordulhatsz, ha te érzed magad egyedül?", "caution": "A felolvasott cetliken ne lehessen azonosítani a szerzőt. Ha valaki tartós, mély magányra utal, kövesd nyomon.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC13-101", "theme_id": "t13", "name": "Digitális lábnyom", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Megnézzük, mit találna rólunk az interneten egy jövőbeli egyetem vagy munkáltató, és hogyan építhetünk tudatosan online képet.", "tools": "egy kitalált diák nyilvános profiljai (kinyomtatva), cetlik", "keywords": "digitális lábnyom, online kép, jövő, adatvédelem, felelősség", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mutasd meg egy kitalált diák nyilvános posztjait és kommentjeit 5 évre visszamenőleg.\n2. Kiscsoportok egy felvételiztető szemével nézik: mit gondolnának róla? Mi szól mellette, mi ellene?\n3. Mindenki megnézheti (csendben, magának), mit talál a neve keresésekor, vagy végiggondolja, mi lehet róla nyilvános.\n4. Gyűjtsétek a táblára: mit érdemes törölni, privátra állítani, és mit érdemes építeni (pl. projektek, önkéntesség).\n5. Feldolgozás: Mi az, ami 5 év múlva kínos lehet abból, amit ma posztolsz? Mi az, amit szívesen látna rólad egy jövőbeli munkáltató? Mit nézel meg ma este a profiljaidon?", "caution": "A saját keresés önkéntes, és senkinek nem kell megmutatnia az eredményét.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC13-102", "theme_id": "t13", "name": "Igaz vagy hamis?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Álhíreket és valódi híreket próbálunk szétválogatni, és megtanulunk néhány gyors ellenőrzési lépést.", "tools": "5–6 kinyomtatott vagy kivetített hír (vegyesen valódi és kitalált), ellenőrző lista", "keywords": "álhír, médiaértés, forrásellenőrzés, kritikus gondolkodás, felelősség", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mutasd be az ellenőrző lépéseket: Ki írta? Hol jelent meg még? Mikor? Mi a célja? Túl szép vagy túl ijesztő, hogy igaz legyen?\n2. Kiscsoportok megkapják a híreket, és eldöntik mindegyikről: igaz, hamis vagy nem lehet tudni?\n3. Fedd fel a megoldást, és beszéljétek meg, mi vezetett félre.\n4. Gyűjtsétek össze, milyen érzelmekre hatnak az álhírek (félelem, düh, kíváncsiság).\n5. Feldolgozás: Osztottál már meg olyat, ami később kiderült, hogy nem igaz? Miért terjednek gyorsabban az álhírek? Mit teszel, mielőtt legközelebb megosztasz egy hírt?", "caution": "Válassz politikailag semleges, korosztálynak megfelelő példákat.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC14-101", "theme_id": "t14", "name": "Vigyázunk egymásra", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "10", "description": "Végiggondoljuk, mit tehetünk egy buliban vagy társaságban, ha egy barátunk bajba kerül, és hogyan vigyázhat a csoport egymásra.", "tools": "helyzetkártyák, sürgősségi telefonszámok", "keywords": "biztonság, felelősség, barátság, segítségkérés, közös szabályok", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mit jelent, hogy „vigyázunk egymásra” egy társaságban?\n2. Kiscsoportok kapnak egy helyzetet (pl. a barátod rosszul lesz egy buliban; valaki egyedül indulna haza éjjel; egy barátodat rá akarják venni valamire, amit nem akar).\n3. Megbeszélik: Mit tehetek most? Kit hívok? Mit mondok a barátomnak?\n4. Gyűjtsétek a táblára a „társasági megállapodások” ötleteit (pl. együtt jövünk, együtt megyünk; van egy jelszó, ha valaki ki akar szállni; mindig van egy felnőtt, akit hívhatunk).\n5. Feldolgozás: Miért nehéz segítséget hívni, ha bajba kerül valaki? Mit tennél, ha félnél a következményektől? Kivel kötnél ilyen megállapodást?", "caution": "Ne moralizálj. A cél a biztonság és a segítségkérés, nem a tiltás. Mondd el a 112-t és az iskolai segítőket.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC14-102", "theme_id": "t14", "name": "Márkák és státusz", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "10", "description": "Megnézzük, miért fontos sokunknak, milyen márkát hordunk vagy milyen telefonunk van, és mit mond ez az értékünkről.", "tools": "márkaképek vagy logók nélküli termékek leírása, cetlik", "keywords": "fogyasztás, státusz, kortárs nyomás, önérték, értékek", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mit gondolunk valakiről a cipője vagy a telefonja alapján? Gyűjtsetek példákat (konkrét nevek nélkül).\n2. Kiscsoportok összegyűjtik, miért vesszük meg a „menő” dolgokat (tartozás, biztonság, öröm, félelem a kimaradástól).\n3. Beszéljétek meg: mi az, amit nem lehet megvenni, mégis tiszteletet vagy barátságot hoz?\n4. Mindenki felír egy dolgot, amit azért szeretne, mert mások is akarják, és egyet, amit valóban magáért szeretne.\n5. Feldolgozás: Mit érzel, ha nincs meg neked, ami a többieknek? Ki dönti el, mi menő? Mi az, amire tényleg szükséged van, és mi az, ami csak a nyomás miatt kell?", "caution": "Figyelj a családok anyagi különbségeire: senkit ne hozz kínos helyzetbe.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC15-101", "theme_id": "t15", "name": "Elég jó", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "10", "description": "Beszélünk a perfekcionizmusról: mikor segít a magas mérce, és mikor válik bénítóvá. Megtanuljuk az „elég jó” elvét.", "tools": "skála a padlón (1 = elég jó, 10 = tökéletes), cetlik", "keywords": "perfekcionizmus, teljesítmény, önelfogadás, stressz, mérce", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Olvass fel helyzeteket (pl. egy házi dolgozat; egy születésnapi ajándék; egy Instagram-poszt; egy edzés), és mindenki odaáll a skálán, mennyire akarja tökéletesen csinálni.\n2. Kérdezd meg: mennyi idő és energia kell a 8-asról 10-esre jutni? Megéri-e mindig?\n3. Mindenki felírja, hol szokott túl magas mércét állítani, és mi történik akkor (halogatás, fáradtság, elégedetlenség).\n4. Párban megfogalmazzák egy-egy helyzetre, mi lenne az „elég jó” szint.\n5. Feldolgozás: Kitől tanultad a mércédet? Mi lenne, ha egy dolgot ezen a héten szándékosan csak elég jól csinálnál meg? Mire szabadulna fel így időd?", "caution": "Ha valaki nagyon szigorú magával, vagy a teljesítmény miatt szorong, figyelj rá, és ajánld fel az iskolapszichológust.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC15-102", "theme_id": "t15", "name": "Egyszerre egy dolog", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "10", "description": "Egy rövid kísérlettel t meg?\n2. Kiscsoportok kapnak egy döntési helyzetet (pl. szakítani akarsz egy vita után; egy állásajánlat túl szépnek tűnik; elküldenél egy éjféli üzenetet).\n3. Kitöltik a két oszlopot: mit súg az érzés, mit mondanak a tények?\n4. Megbeszélik, mi lenne a jó döntés, és kell-e várni vele.\n5. Feldolgozás: Mikor érdemes hallgatni a megérzésre? Mikor érdemes aludni egyet egy döntésre? Melyik döntésedet hoztad túl gyorsan mostanában?", "caution": "A párkapcsolati példáknál légy tapintatos.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC02-112", "theme_id": "t02", "name": "Amikor elveszítünk valamit", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "11", "description": "Beszélünk a veszteségekről, amelyek kamaszkorban érnek minket (költözés, szakítás, egy barátság vége, egy álom elengedése), és arról, hogyan gyászolunk.", "tools": "A4-es lapok, cetlik", "keywords": "veszteség, gyász, elengedés, érzelmek, támogatás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mondd el: gyászolni nemcsak egy ember halála miatt lehet. Gyűjtsetek veszteségeket, amelyek ebben a korban érhetnek minket (név és részletek nélkül).\n2. Mutasd be röviden, hogy a gyász hullámokban jön, és sokféle érzés kíséri (szomorúság, düh, megkönnyebbülés, bűntudat).\n3. Mindenki névtelenül felír egy dolgot, ami segített neki vagy segíthetne egy veszteség után.\n4. Felolvasod a cetliket, és csoportosítjátok őket.\n5. Feldolgozás: Miért nehéz beszélni a veszteségekről? Mit mondanál egy barátnak, aki valamit elveszített? Kihez fordulhatsz, ha neked van szükséged erre?", "caution": "Lehet a csoportban, aki friss gyászt él át: tudd ezt előre, ha lehet, és beszélj vele előtte. Adj lehetőséget a kilépésre. Ajánld az iskolapszichológust.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC03-111", "theme_id": "t03", "name": "Felállni", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Rezíliencia-történeteket gyűjtünk: mi segít az embereknek felállni egy kudarc vagy nehézség után, és ebből mit használhatunk mi.", "tools": "rövid, valós történetek ismert emberekről (pl. sportoló, feltaláló, író kudarcai)", "keywords": "reziliencia, kudarc, kitartás, megküzdés, erőforrások", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Olvass fel 2–3 rövid történetet ismert emberek kudarcairól és arról, hogyan álltak fel.\n2. Kiscsoportok megkeresik a történetekben a közös „felállási eszközöket” (támogató ember, értelem, humor, kis lépések, pihenés).\n3. Mindenki felír egy saját, már lezárt kisebb kudarcot, és azt, melyik eszköz segített neki.\n4. Közösen elkészítitek a „felállás eszköztárát” a táblán.\n5. Feldolgozás: Melyik eszköz a legerősebb nálad? Melyiket használod túl ritkán? Mit mondanál egy barátnak, aki most esett el valamiben?", "caution": "Ne a hősi kitartást dicsőítsd: a pihenés és a segítségkérés is felállási eszköz.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC03-112", "theme_id": "t03", "name": "Testpásztázás", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "11", "description": "Kipróbálunk egy vezetett testpásztázó gyakorlatot, ami segít észrevenni és elengedni a feszültséget, és jó alvás előtt is.", "tools": "matrac vagy kényelmes szék, nyugodt környezet", "keywords": "mindfulness, testtudat, relaxáció, alvás, stresszcsökkentés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mondd el, hogy egy 10 perces figyelemgyakorlat következik. Lehet csukott vagy nyitott szemmel csinálni.\n2. Vezesd végig a figyelmet a testen lassan: lábujjak, talp, lábszár, comb, has, mellkas, kéz, kar, váll, nyak, arc. Minden résznél: mit érzel? Ha feszült, lélegezz bele, és engedd el.\n3. A végén egy perc csend, majd lassú visszatérés (nyújtózás).\n4. Mindenki egy szóval elmondja, hogyan érzi magát.\n5. Feldolgozás: Hol találtál feszültséget? Elkalandoztak-e a gondolataid, és mit tettél ilyenkor? Mikor tudnád használni (pl. elalvás előtt)?", "caution": "Akinek kellemetlen a testre figyelés (pl. traumatikus élmények miatt), nyitott szemmel, egy tárgyra figyelve is részt vehet. Ezt mondd ki előre.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC04-111", "theme_id": "t04", "name": "Mi tesz egyedivé?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Összegyűjtjük, mi az a különleges kombináció (erősség, tapasztalat, érdeklődés), ami csak ránk jellemző, és hogyan mutathatjuk meg egy felvételin vagy interjún.", "tools": "A4-es lapok, tábla", "keywords": "egyediség, erősségek, önbemutatás, felvételi, önismeret", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki felír 3 erősséget, 3 érdeklődést és 3 tapasztalatot (munka, hobbi, utazás, nehézség).\n2. Keres köztük egy szokatlan kapcsolatot (pl. „kitartó + zenész + öcsémre vigyázok” = türelmes tanár lehetek).\n3. Megírja a „60 másodperces bemutatkozását”.\n4. Párban elmondják egymásnak, és a pár visszajelez: mi volt meggyőző, mi hiányzott?\n5. Feldolgozás: Mi volt nehéz: dicsérni magad vagy választani? Mi az, amit eddig nem tartottál értékesnek magadban? Hol használnád ezt a bemutatkozást?", "caution": "Ügyelj, hogy a visszajelzések bátorítóak legyenek.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC05-111", "theme_id": "t05", "name": "Riport egy felnőttel", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Interjút tervezünk egy felnőttel a munkájáról és az életútjáról, és gyakoroljuk a mélyebb, kíváncsi kérdezést.", "tools": "interjúkérdés-sablonok, A4-es lapok", "keywords": "interjú, kérdezés, aktív hallgatás, pályaorientáció, kíváncsiság", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki kiválaszt egy felnőttet, akit szívesen megkérdezne (szülő, rokon, edző, szomszéd).\n2. Kiscsoportok közösen írnak 10 jó interjúkérdést (nyitott kérdések, pl. Mi volt a legnagyobb fordulópont az életedben? Mit csinálnál másképp?).\n3. Párban próbainterjút tartanak: az egyik a felnőtt szerepében válaszol, a másik kérdez és visszatükröz.\n4. Megbeszélitek, mi tett jóvá egy kérdést.\n5. Feldolgozás: Melyik kérdés hozta a legérdekesebb választ? Mi volt nehéz kérdezőként? Kit kérdezel meg a következő óráig, és mit szeretnél megtudni?", "caution": "Az otthoni interjú önkéntes. A következő alkalommal, aki szeretné, beszámolhat.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC06-111", "theme_id": "t06", "name": "Láthatatlan sorsok", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "11", "description": "Olyan emberek helyzetébe gondoljuk bele magunkat, akiket ritkán látunk vagy hallunk (idős ember egyedül, hajléktalan, menekült diák, gondozó fiatal), és megkeressük, mi köt össze minket velük.", "tools": "sorskártyák rövid leírással", "keywords": "társadalmi empátia, előítélet, sztereotípia, közösség, segítés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kiscsoportok kapnak egy sorskártyát (pl. Ilona, 82 éves, egyedül él a negyedik emeleten; Ádám, 17 éves, dolgozik iskola mellett, hogy segítsen otthon; Leila, 16 éves, egy éve érkezett Magyarországra).\n2. Megbeszélik: milyen lehet egy napja? Mi a legnehezebb neki? Mit gondolhatnak róla mások? Mire vágyik?\n3. Megkeresnek 3 dolgot, ami közös bennük és a szereplőben.\n4. Kitalálnak egy apró, reális lépést, amivel egy ilyen helyzetű ember életét könnyebbé tehetnék.\n5. Feldolgozás: Mi volt nehéz elképzelni? Milyen előítéletekkel találkoztatok magatokban? Hol találkozol ilyen sorsokkal a környékeden?", "caution": "Lehet a csoportban, akit érint valamelyik sors. Válaszd meg ennek megfelelően a kártyákat, és kerüld a sajnálkozó hangnemet.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC07-111", "theme_id": "t07", "name": "Ha fontos nekem valaki", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "11", "description": "Megnézzük, hogyan beszéljünk a közeli kapcsolatainkban (barátság, párkapcsolat) a szükségleteinkről és a határainkról.", "tools": "helyzetkártyák", "keywords": "kapcsolati kommunikáció, határok, szükségletek, párkapcsolat, tisztelet", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: miért nehezebb a hozzánk közel állóknak elmondani, mi bánt?\n2. Mutasd be a „közel állók kommunikációjának” három szabályát: 1. a viselkedésről beszélek, nem a személyről; 2. elmondom, mire van szükségem; 3. meghallgatom az ő szükségletét is.\n3. Párban gyakorolnak helyzeteken (pl. a párod mindig az ő barátaival akar lenni; a barátod mindig késik; úgy érzed, csak te kezdeményezel).\n4. Beszéljétek meg az egészséges és egészségtelen jeleket (féltékenység, kontroll, tisztelet, szabadság).\n5. Feldolgozás: Mi a különbség a „féltelek” és a „kontrollállak” között? Milyen mondatot nehéz kimondanod a hozzád közel állóknak? Kihez fordulhatsz, ha egy kapcsolat rosszul esik?", "caution": "Ha valaki bántalmazó kapcsolatra utal, beszélj vele négyszemközt, és vonj be szakembert.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC08-111", "theme_id": "t08", "name": "Vita felfelé", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Gyakoroljuk, hogyan képviseljük a véleményünket egy hatalmi különbséggel járó helyzetben (tanár, edző, főnök) tisztelettel és hatásosan.", "tools": "helyzetkártyák", "keywords": "hatalmi különbség, asszertivitás, érdekképviselet, tisztelet, konfliktus", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: miért nehezebb vitatkozni egy tanárral vagy főnökkel, mint egy barátunkkal?\n2. Mutasd be a lépéseket: időzítés (négyszemközt, nyugodtan), tények, a saját nézőpont, a másik szempontjának elismerése, javaslat.\n3. Párban eljátszanak helyzeteket (pl. igazságtalannak érzel egy jegyet; a munkahelyeden túl sok műszakot kapsz; az edző nem játszat).\n4. Néhány pár bemutatja, a többiek visszajeleznek.\n5. Feldolgozás: Mi segít, hogy ne legyél se túl alázatos, se túl támadó? Mi van, ha a másik nem enged? Hol fogod ezt használni a következő hetekben?", "caution": "Hangsúlyozd: a tisztelet kölcsönös. Ha valaki valódi visszaélésről beszél, vedd komolyan.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC08-112", "theme_id": "t08", "name": "Ahol nem engedek", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Megkülönböztetjük, miben lehet kompromisszumot kötni, és mi az a néhány dolog, amiben nem engedünk, és megtanuljuk ezt tisztán kimondani.", "tools": "A4-es lapok két oszloppal", "keywords": "kompromisszum, határok, értékek, tárgyalás, önérvényesítés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki két oszlopot ír
