<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ Alap ============ */
:root{
  --ink:#26213F; --muted:#6B6580; --line:#E7E1EC; --bg:#FAF8F5; --card:#FFFFFF;
  --purple:#8E529B; --pink:#E0367A; --orange:#F08A00; --blue:#2E6DB4; --green:#3E7D1E; --red:#C8281E; --yellow:#FFD66E;
  --r:18px; --shadow:0 1px 2px rgba(38,33,63,.06),0 6px 20px rgba(38,33,63,.06);
  --head:'Rubik','DM Sans',system-ui,sans-serif; --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--bg);font-size:19.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--purple)}
h1,h2,h3{font-family:var(--head);line-height:1.15;margin:0;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:8px}

/* ============ Fejléc ============ */
header.top{position:sticky;top:0;z-index:30;background:rgba(250,248,245,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;min-height:160px;padding:12px 0}
.brand{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:inherit;flex:0 0 auto;background:none;border:0;padding:0}
.brand .logo{width:60px;height:60px;border-radius:17px;background:conic-gradient(from 200deg,var(--orange),var(--pink),var(--purple),var(--blue),var(--green),var(--orange));display:grid;place-items:center;color:#fff;font-family:var(--head);font-weight:800;font-size:18.5px}
.brand .logo span{background:#fff;color:var(--purple);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;font-size:20px}
.brand b{font-family:var(--head);font-size:66px;display:block;line-height:1.05;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:24px;display:block;margin-top:3px}
.spacer{flex:1}
.searchbox{margin:0;flex:1;min-width:260px}
.search{display:block;position:relative;max-width:760px}
.search input{width:100%;height:50px;border:2px solid #CDB3D6;border-radius:16px;padding:0 50px 0 52px;background:#fff;font-size:18.5px;box-shadow:0 2px 10px rgba(142,82,155,.10);transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--purple);outline:none;box-shadow:0 0 0 4px rgba(123,42,130,.12)}
.search svg{position:absolute;left:18px;top:14px;color:var(--purple);width:22px;height:22px}
.search .clear{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:#f1edf4;display:none}
.search.has .clear{display:block}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:700;background:var(--purple);color:#fff;white-space:nowrap;transition:transform .08s,background .15s}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:#cfc6d8}
.btn.pri{background:var(--purple)}
.btn.sm{padding:7px 13px;font-size:18.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.cartbtn .badge{background:#fff;color:var(--purple);border-radius:999px;padding:1px 8px;font-size:17.5px}
.usermenu{font-size:17.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.demo{background:var(--yellow);font-size:18.5px;text-align:center;padding:7px 16px}

/* ============ Kezdőoldal ============ */
.hero{padding:22px 0 4px}
.topcard{padding-top:0;margin-bottom:10px}
.onb .gform{margin-top:14px;max-width:520px}
.hero h1{font-size:clamp(22px,3vw,36px);font-weight:800;text-transform:uppercase;letter-spacing:.01em;color:#4A2357;white-space:nowrap}
@media (max-width:760px){ .hero h1{white-space:normal} }
.hero h1 em{font-style:normal;color:var(--purple)}
.hero p{color:var(--muted);max-width:760px;font-size:18.5px;margin:6px 0 0}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 14px}
.sec-h h2{font-size:24.5px}
.sec-h span{color:var(--muted);font-size:18.5px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:26px;padding-bottom:60px}
.tcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;border:0;padding:0;text-align:left;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.tcard:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(38,33,63,.06),0 14px 34px rgba(38,33,63,.1)}
.tcard .tb{padding:14px 18px 18px;border-top:5px solid var(--c)}
.tcard h3{font-size:20px}
.tcard p{font-size:18.5px;color:var(--muted);margin:6px 0 10px}
.tcard .meta{display:flex;gap:6px;flex-wrap:wrap}

/* ============ Fotó és helyőrző ============ */
.photo{position:relative;aspect-ratio:16/9;background:color-mix(in srgb,var(--c) 14%,#fff);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;text-align:center;padding:12px;
  background:
   radial-gradient(circle at 18% 22%,rgba(255,255,255,.28) 0 14%,transparent 15%),
   radial-gradient(circle at 82% 78%,rgba(255,255,255,.18) 0 20%,transparent 21%),
   radial-gradient(circle at 75% 18%,rgba(255,214,110,.55) 0 7%,transparent 8%),
   linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 62%,#26213F));}
.ph{background-color:var(--c)}
.ph .cam{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;border:1.5px dashed rgba(255,255,255,.75)}
.ph b{font-size:17.5px;letter-spacing:.06em;text-transform:uppercase}
.ph small{font-size:17px;opacity:.9;max-width:90%}
.big .photo{border-radius:22px;box-shadow:10px 10px 0 var(--yellow);border:3px solid var(--c)}
.big .ph .cam{width:64px;height:64px}
.big .ph b{font-size:18.5px}.big .ph small{font-size:18.5px}
.photo-tools{position:absolute;right:12px;bottom:12px;display:flex;gap:8px;z-index:2}
.photo-tools .btn{background:rgba(38,33,63,.82)}

/* ============ Címkék, szűrők ============ */
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:18.5px;font-weight:500;transition:all .12s}
.chip:hover{border-color:#cfc6d8}
.chip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:17px;font-weight:700;border-radius:999px;padding:3px 10px;background:#F2EEF5;color:var(--ink)}
.tag.t1{background:#FFEBD1}.tag.t2{background:#FCE0EC}.tag.t3{background:#EFE0F1}.tag.t4{background:#DDE8F6}.tag.t5{background:#E3F0DA}
.tag.d1{background:#E3F0DA;color:#2D5E14}.tag.d2{background:#FFF2CC;color:#7A5A00}.tag.d3{background:#FBDCD9;color:#9B1E16}
.tag.min{background:#EFE3F3;color:#6E3A7C}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}

.layout{display:grid;grid-template-columns:250px 1fr;gap:28px;padding:28px 0 70px}
.filters{position:sticky;top:88px;align-self:start;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.filters h4{margin:16px 0 8px;font-size:16.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.filters h4:first-child{margin-top:0}
.filters .opts{display:flex;flex-wrap:wrap;gap:6px}
.filters .chip{font-size:17.5px;padding:5px 11px}
.filters select{width:100%;height:40px;border-radius:12px;border:1.5px solid var(--line);padding:0 10px;background:#fff}
.reset{margin-top:16px;width:100%;justify-content:center}
.res-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.res-h h2{font-size:27px}
.res-h .count{color:var(--muted)}
.ftoggle{display:none}

/* ============ Gyakorlatkártya ============ */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.acard{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:16px 18px 14px;display:flex;flex-direction:column;gap:9px;border-left:6px solid var(--c);cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative}
.acard:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(38,33,63,.06),0 12px 28px rgba(38,33,63,.1)}
.acard .th{font-size:17px;color:var(--muted);display:flex;align-items:center;gap:6px}
.acard h3{font-size:19.5px;font-family:var(--body);font-weight:700;padding-right:34px}
.acard .th{padding-right:34px}
.acard p{margin:0;font-size:18.5px;color:#4b4562}
.acard .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.acard .add{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;font-size:22.5px;line-height:1}
.acard .add.on{background:var(--green);border-color:var(--green);color:#fff}
.empty{background:#fff;border-radius:var(--r);padding:40px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}

/* ============ Témaoldal ============ */
.theme-hero{display:grid;grid-template-columns:.85fr 1.15fr;gap:40px;align-items:center;padding:34px 0 10px}
.back{background:none;border:0;padding:0;color:var(--muted);font-weight:700;display:inline-flex;gap:6px;align-items:center;margin-bottom:14px}
.theme-hero h1{font-size:clamp(30px,4vw,44px);font-weight:800}
.theme-hero .lead{color:var(--muted);font-size:19.5px;margin:12px 0 18px}
.flow{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.step{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:stretch}
.step .when{font-family:var(--head);font-weight:700;color:var(--c);font-size:18.5px;padding-top:16px;text-align:right}
.step .acard{border-left-width:6px}

/* ============ Részletes nézet (modal) ============ */
dialog{border:0;border-radius:24px;padding:0;max-width:760px;width:calc(100% - 28px);box-shadow:0 30px 80px rgba(38,33,63,.35);color:var(--ink)}
dialog::backdrop{background:rgba(38,33,63,.45);backdrop-filter:blur(3px)}
.dlg-h{background:var(--c);color:#fff;padding:22px 26px 20px;position:relative}
.dlg-h.has-photo{padding-top:170px;overflow:hidden}
.dlg-h .hph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%;z-index:0}
.dlg-h .hsh{position:absolute;inset:0;z-index:0}
.dlg-h.has-photo > :not(.hph):not(.hsh):not(.x){position:relative;z-index:1}
.dlg-h.has-photo > .x{z-index:2}
@media (max-width:640px){ .dlg-h.has-photo{padding-top:120px} }
.dlg-h.has-photo h2,.dlg-h.has-photo .th{text-shadow:0 1px 8px rgba(0,0,0,.35)}
.dlg-h .th{opacity:.9;font-size:18px;font-weight:700;letter-spacing:.03em}
.dlg-h h2{font-size:30px;margin:6px 46px 10px 0}
.dlg-h .tags .tag{background:rgba(255,255,255,.22);color:#fff}
.x{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:22.5px}
.dlg-b{padding:22px 26px 8px;max-height:calc(100vh - 260px);overflow:auto}
.dlg-b h3{font-size:18.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 8px;font-family:var(--body);font-weight:700}
.dlg-b h3:first-child{margin-top:0}
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:6px 0 6px 40px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:5px;width:27px;height:27px;border-radius:50%;background:var(--c);color:#fff;font-weight:700;font-size:18.5px;display:grid;place-items:center}
.caution{background:#FFF7E0;border:1.5px solid #F6DE8E;border-radius:14px;padding:12px 16px;display:flex;gap:12px}
.caution svg{flex:0 0 auto;color:#B07A00;margin-top:2px}
.prs{display:flex;flex-direction:column;gap:8px}
.pr{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.pr .ic{width:36px;height:42px;border-radius:6px;background:#FBDCD9;color:var(--red);font-size:11px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.pr div{flex:1;min-width:0}
.pr b{display:block;font-size:18.5px}
.pr small{color:var(--muted)}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw button{border:0;background:#F2EEF5;border-radius:999px;padding:3px 10px;font-size:17.5px}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 26px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.src{color:var(--muted);font-size:17.5px;margin-top:14px}

.planbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:14px;background:#fff;border:2px solid #CDB3D6;border-radius:999px;padding:8px 8px 8px 20px;box-shadow:0 8px 28px rgba(74,35,87,.18);font-size:18.5px;max-width:calc(100vw - 24px)}
.planbar b{color:var(--purple)}
body.dr-open .planbar{display:none}
/* ============ Foglalkozásterv (oldalsáv) ============ */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(500px,100%);background:#fff;z-index:50;box-shadow:-20px 0 60px rgba(38,33,63,.2);transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(38,33,63,.35);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.dr-h{padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.dr-h input{width:100%;font-family:var(--head);font-size:24.5px;font-weight:700;border:0;border-bottom:1.5px dashed transparent;padding:2px 0;background:transparent}
.dr-h input:hover,.dr-h input:focus{border-bottom-color:var(--line);outline:none}
.total{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--muted);font-size:18.5px}
.total b{font-family:var(--head);font-size:29px;color:var(--ink)}
.meter{height:8px;border-radius:99px;background:#F1EDF4;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--orange),var(--red));width:0;transition:width .25s}
.marks{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin-top:3px}
.dr-b{flex:1;overflow:auto;padding:14px 22px}
.ci{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ci .t{font-family:var(--head);font-weight:700;color:var(--c);font-size:18.5px}
.ci b{display:block;font-size:18.5px;line-height:1.25;cursor:pointer}
.ci small{color:var(--muted);font-size:17px}
.ci .ctl{display:flex;gap:2px}
.ci .ctl button{width:28px;height:28px;border-radius:8px;border:0;background:#F4F1F6;font-size:18.5px}
.dr-f{padding:14px 22px 20px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.dr-f .btn{flex:1;justify-content:center}

/* ============ Belépés ============ */
.login{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:30px 20px}
.login .box{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:32px;max-width:420px;width:100%}
.login h1{font-size:31.5px;margin-bottom:8px}
.login p{color:var(--muted)}
.login input{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);padding:0 14px;margin:6px 0 14px}
.login .btn{width:100%;justify-content:center;height:48px}
.msg{font-size:18.5px;margin-top:12px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:#6E4580;color:#fff;padding:12px 20px;border-radius:14px;z-index:80;transition:transform .25s;font-size:18.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 30px)}
.toast.show{transform:translate(-50%,0)}
.spin{display:grid;place-items:center;min-height:50vh;color:var(--muted)}


/* ============ Napló, naptár, javaslat ============ */
.gsel{height:42px;border-radius:999px;border:1.5px solid var(--line);padding:0 10px;background:#fff;font-weight:700;max-width:300px;flex:0 0 auto}
.tag.used{background:#E3F0DA;color:#2D5E14}
.sugg{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:24px 26px;margin:4px 0 6px;border-top:6px solid var(--c)}
.sugg .eyebrow{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--c)}
.sugg h2{font-size:28px;margin:6px 0 8px}
.sugg p{color:#4b4562;margin:0 0 12px;font-size:18.5px}
.sugg .pl{display:flex;justify-content:space-between;font-size:17.5px;color:var(--muted);margin:2px 0 4px}
.prog{height:10px;border-radius:99px;background:#F1EDF4;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);border-radius:99px}
.budget{display:flex;gap:6px;align-items:center;margin-top:14px;font-size:17.5px;color:var(--muted);flex-wrap:wrap}
.sg-list{display:flex;flex-direction:column;gap:8px}
.sg-it{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:9px 12px;cursor:pointer;background:#fff;text-align:left;width:100%}
.sg-it:hover{border-color:#cfc6d8}
.sg-it .t{font-family:var(--head);font-weight:700;color:var(--c)}
.sg-it b{display:block;font-size:18.5px;line-height:1.25}
.sg-it small{color:var(--muted);font-size:17px}
.note{font-size:18px;background:#FFF7E0;border-radius:10px;padding:8px 12px;color:#6b5200}
.sg-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tcard{position:relative}
.tprog{height:6px;border-radius:99px;background:#F1EDF4;overflow:hidden;margin-top:10px}
.tprog i{display:block;height:100%;background:var(--c)}
.tcard small.pg{display:block;font-size:17px;color:var(--muted);margin-top:4px}

.pj-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}

/* Beépített adatok (demó mód és tartalék) */
const DEMO_DATA = {"themes": [{"id": "t18", "sort": 0, "name": "Új osztály – közösségépítés", "color": "#3E8E9A", "description": "Az új osztály első heteiben megismerjük egymást, megtaláljuk a közös pontokat, és lerakjuk a jó osztályközösség alapjait.", "photo_hint": "Új osztály, nevető diákok egy körben", "grades": "5–12", "photo_url": "tema-fotok/t11-uj-osztaly-1280.webp"}, {"id": "t01", "sort": 1, "name": "Ismerkedés és szabályok", "color": "#F08A00", "description": "Megállapodunk, hogyan dolgozunk együtt, hogy a csoportban mindenki biztonságban érezze magát, és évről évre újragondoljuk, mire van szükségünk.", "photo_hint": "Diákok körben ülnek, nevetnek", "grades": "5–12", "photo_url": "tema-fotok/t01-ismerkedes-1280.webp"}, {"id": "t02", "sort": 2, "name": "Érzelmek felismerése", "color": "#E0367A", "description": "Megtanuljuk pontosan megnevezni és felismerni az érzéseinket – magunkban és másokban is –, és figyelünk arra, mit üzennek.", "photo_hint": "Színes érzelemkártyák egy asztalon", "grades": "5–12", "photo_url": "tema-fotok/t02-erzelmek-felismerese-1280.webp"}, {"id": "t03", "sort": 3, "name": "Érzelemszabályozás", "color": "#7B2A82", "description": "Technikákat gyűjtünk arra az esetre, ha elönt a düh, a feszültség vagy az izgalom, és megtanuljuk, hogyan nyerjünk időt a reakció előtt.", "photo_hint": "Egy diák csukott szemmel, nyugodtan lélegzik", "grades": "5–12", "photo_url": "tema-fotok/t03-erzelemszabalyozas-1280.webp"}, {"id": "t15", "sort": 4, "name": "Stressz és vizsgák", "color": "#5B5FC7", "description": "A terhelésről és a pihenésről beszélgetünk: a dolgozatoktól az érettségiig megnézzük, mi okoz stresszt, és mi segít jól bírni.", "photo_hint": "Jegyzetfüzet, órarend és egy bögre tea egy asztalon", "grades": "5–12", "photo_url": "tema-fotok/t15-stressz-erettsegi-1280.webp"}, {"id": "t04", "sort": 5, "name": "Önismeret és értékek", "color": "#2E6DB4", "description": "Felfedezzük, kik vagyunk, mi fontos nekünk, és miben vagyunk erősek – és azt is, hogyan változik ez az évek során.", "photo_hint": "Értékkártyák sorba rendezve, jegyzetfüzet", "grades": "5–12", "photo_url": "tema-fotok/t04-onismeret-1280.webp"}, {"id": "t16", "sort": 6, "name": "Döntések és jövő", "color": "#2F8F5B", "description": "A döntéseinkről és a jövőnkről gondolkodunk: hogyan mérlegelünk, kinek a hangja befolyásol, és hogyan viseljük a bizonytalanságot.", "photo_hint": "Útelágazás vagy útjelző tábla", "grades": "5–12", "photo_url": "tema-fotok/t16-dontesek-jovo-1280.webp"}, {"id": "t05", "sort": 7, "name": "Aktív hallgatás", "color": "#3E7D1E", "description": "Gyakoroljuk, hogyan figyeljünk oda igazán a másikra: kérdezünk, visszatükrözünk, és nem ítélkezünk.", "photo_hint": "Két diák beszélget, egyikük figyelmesen hallgat", "grades": "5–12", "photo_url": "tema-fotok/t05-aktiv-hallgatas-1280.webp"}, {"id": "t06", "sort": 8, "name": "Empátia", "color": "#C8281E", "description": "Megpróbáljuk a másik szemével látni a helyzetet: megérteni, mit él át, és mire lehet szüksége.", "photo_hint": "Egy üres szék a kör közepén", "grades": "5–12", "photo_url": "tema-fotok/t06-empatia-1280.webp"}, {"id": "t12", "sort": 9, "name": "Barátság és kirekesztés", "color": "#D9480F", "description": "A barátságról, a befogadásról és a kirekesztésről beszélgetünk, és arról, mit tehet az, aki látja, mi történik – a suliban és online is.", "photo_hint": "Diákok egy padon, egyikük behív egy társat", "grades": "5–12", "photo_url": "tema-fotok/t12-baratsag-1280.webp"}, {"id": "t07", "sort": 10, "name": "Erőszakmentes kommunikáció", "color": "#C98A00", "description": "Megtanuljuk úgy elmondani, mi bánt és mire van szükségünk, hogy közben ne bántsuk a másikat.", "photo_hint": "Beszédbuborékok, párban dolgozó diákok", "grades": "5–12", "photo_url": "tema-fotok/t07-eroszakmentes-kommunikacio-1280.webp"}, {"id": "t13", "sort": 11, "name": "Digitális élet", "color": "#1971C2", "description": "A digitális életünkről gondolkodunk: mit osztunk meg, mire figyelünk, hogyan hat ránk a képernyő, és hogyan vigyázunk egymásra online.", "photo_hint": "Telefon az asztalon, értesítésekkel", "grades": "5–12", "photo_url": "tema-fotok/t13-digitalis-elet-1280.webp"}, {"id": "t08", "sort": 12, "name": "Konfliktuskezelés", "color": "#B8326E", "description": "Megnézzük, mi történik egy vitában, és gyakoroljuk, hogyan lehet úgy megoldani a konfliktust, hogy mindkét fél figyelembe vegye a másikat.", "photo_hint": "Egy narancs két kéz között", "grades": "5–12", "photo_url": "tema-fotok/t08-konfliktuskezeles-1280.webp"}, {"id": "t14", "sort": 13, "name": "Kortárs nyomás és nemet mondás", "color": "#AE3EC9", "description": "Gyakoroljuk, hogyan húzzuk meg a határainkat, és hogyan álljunk ki a saját döntésünk mellett, ha a társaság mást akar.", "photo_hint": "Egy diák kiáll a sorból", "grades": "5–12", "photo_url": "tema-fotok/t14-kortars-nyomas-1280.webp"}, {"id": "t09", "sort": 14, "name": "Együttműködés", "color": "#1C8C8C", "description": "Közös feladatokban tapasztaljuk meg, mitől működik egy csapat, ki milyen szerepet vállal, és hogyan bízhatunk egymásban.", "photo_hint": "Spagettitorony pillecukorral a tetején", "grades": "5–12", "photo_url": "tema-fotok/t09-egyuttmukodes-1280.webp"}, {"id": "t10", "sort": 15, "name": "Visszajelzés és hála", "color": "#4A63C9", "description": "Visszajelzünk egymásnak, kifejezzük a hálánkat, és észrevesszük, mennyit fejlődtünk.", "photo_hint": "Papírlapok kedves üzenetekkel", "grades": "5–12", "photo_url": "tema-fotok/t10-hala-1280.webp"}, {"id": "t17", "sort": 16, "name": "Búcsú és lezárás", "color": "#C2255C", "description": "Lezárjuk a tanévet – 12.-ben a gimnáziumi éveket –, visszatekintünk, és útravalót adunk egymásnak.", "photo_hint": "Ballagási tarisznya vagy egy üres osztályterem", "grades": "5–12", "photo_url": "tema-fotok/t17-bucsu-1280.webp"}], "activities": [{"id": "VC01-1", "theme_id": "t01", "name": "Névkör gesztussal", "type": "Ráhangolódás", "type_order": 1, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki a nevével és egy gesztussal mutatkozik be.", "tools": "puha labda", "keywords": "ismerkedés, bemutatkozás, nevek, új csoport, jégtörő", "source": "Vibe Check, 1. alkalom", "instructions": "1. Körben állunk. Kezdd te: „Kata vagyok” + egy gesztus (pl. integetés).\n2. A csoport kórusban megismétli a nevet és a gesztust.\n3. Sorban mindenki bemutatkozik, a csoport mindig megismétli.\n4. Nehezítés: puha labdát dobva szólítjuk meg egymást névvel.", "caution": "Ha valaki zavarban van, elég a név és egy egyszerű mozdulat. A gesztusokat ne kommentáld.", "variants": "{\"11–12\": \"Gesztus helyett mindenki mond „egy dolgot, amit még nem tudtok rólam”. Csak új vagy átalakult csoportnál érdemes elővenni.\"}"}, {"id": "VC01-2", "theme_id": "t01", "name": "„Helyet cserél, aki még…”", "type": "Bemelegítő játék", "type_order": 2, "minutes": 15, "depth": "Könnyű", "grade": "5–12", "description": "Mozgásos ismerkedős játék: akire igaz az állítás, helyet cserél.", "tools": "székek körben", "keywords": "ismerkedés, mozgás, energizáló, jégtörő, közös vonások", "source": "Vibe Check, 1. alkalom", "instructions": "1. Tegyetek körbe eggyel kevesebb széket, mint ahányan vagytok. Aki középen áll, mond egy állítást: „Helyet cserél, aki…”\n2. Akire igaz, feláll és új helyet keres. Aki kimarad, középre áll.\n3. Kezdd semleges állításokkal (testvér, kedvenc étel, korai kelés), később jöhetnek személyesebbek.", "caution": "Állítsd meg és fogalmaztasd át azokat az állításokat, amelyek valakit kipécéznek vagy érzékeny témát érintenek (külső, család, anyagi helyzet). Mozgás közben figyelj a biztonságra.", "variants": null}, {"id": "VC01-3", "theme_id": "t01", "name": "Szabályjavaslatok kiscsoportban", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "8", "description": "Kiscsoportok javaslatot tesznek a foglalkozások szabályaira.", "tools": "csomagolópapír, filcek", "keywords": "csoportszabályok, biztonságos tér, bizalom, titoktartás, csoportnorma", "source": "Vibe Check, 1. alkalom", "instructions": "1. 3–4 fős kiscsoportok, csoportonként egy csomagolópapír.\n2. Kérdés: „Mi kell ahhoz, hogy itt mindenki biztonságban érezze magát, és merjen megszólalni?”\n3. Minden csoport 4–6 szabályt ír fel, pozitív megfogalmazásban („Figyelünk arra, aki beszél”).\n4. A plakátokat kitesszük a falra.", "caution": "Ha magától nem jön elő, tereld a beszélgetést a titoktartás, a passzolás joga és az ítélkezésmentesség felé. A titoktartás határát mondd ki: ha valaki veszélyben van, azt tovább kell adnod.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC01-4", "theme_id": "t01", "name": "Közös csoportszerződés", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "8", "description": "Összevetjük a javaslatokat, és közösen aláírjuk a csoportszerződést.", "tools": "csomagolópapír, filcek", "keywords": "csoportszerződés, szabályok, megállapodás, bizalom", "source": "Vibe Check, 1. alkalom", "instructions": "1. Közösen végignézzük a plakátokat, és összevonjuk az ismétlődő javaslatokat.\n2. Szavazással vagy egyetértéssel kiválasztunk 4–6 szabályt.\n3. Egy közös lapra írjuk, és mindenki aláírja.\n4. A szerződést minden alkalommal kitesszük a falra.", "caution": "Te is írd alá, hiszen te is a csoport tagja vagy. Írjátok bele a titoktartás határát is. Ha kevés az idő, hozz előre megírt tervezetet, és azt alakítsátok át közösen.", "variants": "{\"11–12\": \"Új szerződés helyett a meglévő csoportszerződést vizsgáljátok felül: mi működik még, mit írnátok át? 15 perc is elég.\"}"}, {"id": "VC01-5", "theme_id": "t01", "name": "Egy szó az elvárásaimról + kezdő kérdőív", "type": "Lezárás", "type_order": 5, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki elmond egy szót arról, mit vár a foglalkozásoktól, aztán kitöltik a kezdő önértékelő kérdőívet.", "tools": null, "keywords": "elvárások, önértékelés, kérdőív, kezdés", "source": "Vibe Check, 1. alkalom", "instructions": "1. Körben mindenki egy szót mond arról, mit vár a foglalkozásoktól.\n2. Kiosztod a kezdő önértékelő kérdőívet. Egyénileg töltik ki, név helyett jeligével.\n3. A kérdőíveket elteszed a tanév végéig.", "caution": "A jelige azért kell, hogy a végén mindenki a sajátjával vethesse össze, de te ne lásd, kié. Mondd el, hogy nincs jó vagy rossz válasz.", "variants": null}, {"id": "VC02-1", "theme_id": "t02", "name": "Időjárás-jelentés", "type": "Ráhangolódás", "type_order": 1, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Milyen idő van ma bennem? Mindenki egy időjárás-képpel írja le a hangulatát.", "tools": null, "keywords": "hangulat, check-in, érzelmek megnevezése, ráhangolódás, rituálé", "source": "Vibe Check, 2. alkalom", "instructions": "1. Kérdés: „Ha a mai hangulatod időjárás lenne, milyen lenne?”\n2. Körben mindenki egy mondatban válaszol: „Ma nálam borús, de néha kisüt a nap.”\n3. Nem kommentáljuk, csak meghallgatjuk.\n4. Minden óra elején bevezethetitek háromperces szokásként.", "caution": "Passzolni lehet. Ha valaki többször egymás után nagyon sötét képet ad (vihar, sötétség), az óra után beszélj vele négyszemközt.", "variants": "{\"11–12\": \"Időjárás-kép helyett mindenki egy dalcímmel vagy egy 1–10-es számmal írja le a hangulatát.\"}"}, {"id": "VC02-2", "theme_id": "t02", "name": "Érzelem-pantomim", "type": "Bemelegítő játék", "type_order": 2, "minutes": 15, "depth": "Könnyű", "grade": "5–12", "description": "Egy diák eljátszik egy érzelmet, a többiek kitalálják.", "tools": "érzelemkártyák", "keywords": "érzelmek, pantomim, testbeszéd, arckifejezés, játék", "source": "Vibe Check, 2. alkalom", "instructions": "1. Egy diák húz egy érzelemkártyát, és szavak nélkül eljátssza.\n2. A többiek tippelnek.\n3. Utána megbeszéljük: mi segített kitalálni (arc, testtartás, mozdulat)?\n4. Nehezítésként hasonló érzelmeket is eljátszhatnak, például a csalódottságot és a szomorúságot.", "caution": "Senkit ne kötelezz a játszásra, párban is előadhatják. Legyenek a kártyák között kellemes érzések is.", "variants": "{\"9–10\": \"Összetettebb érzelmekkel játsszatok: csüggedés, irigység, megkönnyebbülés, zavar, büszkeség.\", \"11–12\": \"Pantomim helyett valaki felolvas egy rövid helyzetet, a többiek pedig kitalálják, milyen összetett érzés lehet benne.\"}"}, {"id": "VC02-3", "theme_id": "t02", "name": "Érzelmek keresése az érzelemkeréken", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "8", "description": "Helyzetekhez keresünk pontos érzéseket az érzelemkeréken.", "tools": "Plutchik-féle érzelemkerék, helyzetkártyák", "keywords": "érzelemkerék, érzelmi szókincs, árnyalatok, alapérzelmek, Plutchik", "source": "Vibe Check, 2. alkalom", "instructions": "1. Röviden bemutatod a kereket: belül az alapérzelmek, kifelé az árnyaltabbak.\n2. A párok húznak egy helyzetkártyát (pl. „A barátod nem hív meg a szülinapjára”).\n3. Megkeresik a keréken a lehető legpontosabb érzést, akár többet is.\n4. Néhány pár megosztja, miért éppen azt választotta.", "caution": "Mondd ki, hogy ugyanarra a helyzetre különböző érzések is helyesek lehetnek. A helyzetek legyenek hétköznapiak; súlyos témákat (gyász, bántalmazás) ne vegyél bele.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": "{\"7–8\": \"Egyszerűbb kereket használjatok, csak az alapérzelmekkel (öröm, szomorúság, düh, félelem, undor, meglepetés), és elég 3–4 helyzet.\"}"}, {"id": "VC02-4", "theme_id": "t02", "name": "Testtérkép", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "8", "description": "Hol érzem a testemben a dühöt, a félelmet, az örömöt?", "tools": "testsziluett-lapok, színes ceruzák", "keywords": "testi jelzések, testtudat, düh, félelem, öröm", "source": "Vibe Check, 2. alkalom", "instructions": "1. Mindenki kap egy testsziluett-lapot.\n2. Három színnel jelölik, hol érzik a dühöt, a félelmet és az örömöt (pl. gyomor, váll, mellkas).\n3. Párban vagy kiscsoportban összevetik a lapokat.\n4. Közösen: miért jó tudni, hol jelez a testünk?", "caution": "Arra figyeljenek, mit éreznek belül, ne a külsejükre. Ha valaki rossz élményt idéz fel, ne mélyítsd a csoport előtt, hanem ajánld fel a beszélgetést óra után.", "variants": "{\"7–8\": \"Előre megrajzolt testkörvonallal dolgozzatok, és közösen töltsétek ki egy nagy papíron, ne egyénileg.\"}"}, {"id": "VC02-5", "theme_id": "t02", "name": "Egy új érzelemszó", "type": "Lezárás", "type_order": 5, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki megoszt egy új érzelemszót, amit ma tanult.", "tools": null, "keywords": "érzelmi szókincs, lezárás, záró kör", "source": "Vibe Check, 2. alkalom", "instructions": "1. Körben mindenki mond egy érzelemszót, amit ma tanult vagy most használt először.\n2. Ha szeretnétek, a szavakat felírhatjátok egy közös „érzelemszótárba”, amely az év során egyre bővül. Ebből a záróprojekt plakátja is elkészülhet.", "caution": "Olyan szót is mondhatnak, amit más már mondott. Akinek nem jut eszébe semmi, nézzen rá az érzelemkerékre.", "variants": null}, {"id": "VC03-1", "theme_id": "t03", "name": "1–10-es skála a padlón", "type": "Ráhangolódás", "type_order": 1, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Hová állok a skálán? Mennyire vagyok ma feszült?", "tools": "1–10-es skála a padlón", "keywords": "feszültség, stressz, skála, check-in, mozgás", "source": "Vibe Check, 3. alkalom", "instructions": "1. Tegyél le a padlóra 1-től 10-ig számozott lapokat.\n2. Kérdés: „Mennyire vagy ma feszült?” Mindenki odaáll, ahol tart.\n3. Aki akarja, egy mondatban elmondja, miért áll ott.\n4. Más kérdést is feltehetsz, például arról, mennyire fáradtak, vagy mennyi energiájuk van.", "caution": "Itt mindenki a csoport előtt mutatja meg, hogy érzi magát, ezért aki szeretné, csak gondolatban válasszon számot. A magas számot választókat ne faggasd a csoport előtt, inkább óra után kérdezz rá.", "variants": null}, {"id": "VC03-2", "theme_id": "t03", "name": "Dobozlégzés", "type": "Bemelegítő játék", "type_order": 2, "minutes": 15, "depth": "Könnyű", "grade": "5–12", "description": "Közösen végzünk dobozlégzést, utána röviden megbeszéljük. Dolgozat előtt is jól jön.", "tools": "légzésgyakorlat-kártyák", "keywords": "légzés, relaxáció, stressz, szorongás, megnyugvás, dolgozat", "source": "Vibe Check, 3. alkalom", "instructions": "1. Üljetek egyenesen; aki szeretné, csukja be a szemét.\n2. Négy másodpercig belélegzünk, négyig benntartjuk a levegőt, négyig kifújjuk, és négy másodpercig szünetet tartunk. Közben az ujjunkkal egy négyzetet „rajzolunk” a levegőbe.\n3. 4–5 kör.\n4. Rövid kör: mi változott?", "caution": "Ha valaki szédül, vagy kellemetlen neki a benntartás, csökkentse 3 másodpercre vagy hagyja ki. A csukott szem nem kötelező. Akinek légúti panasza van, annak ne erőltesd.", "variants": null}, {"id": "VC03-3", "theme_id": "t03", "name": "STOP-technika helyzetkártyákkal", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "8", "description": "Párban helyzetkártyákat húznak, és a STOP-technikával gyakorolják, mit tehetnek, ha felhúzzák őket.", "tools": "helyzetkártyák", "keywords": "düh, harag, indulatkezelés, STOP, önszabályozás, felhúz", "source": "Vibe Check, 3. alkalom", "instructions": "1. Felírod a táblára a négy lépést: Stop (állj meg), Lélegezz, Figyeld meg, mi történik benned, Válaszd meg tudatosan, hogyan reagálsz.\n2. A párok helyzetkártyát húznak (pl. „Valaki kineveti a feleletedet”).\n3. Végigmennek a négy lépésen: mi történne STOP nélkül, és mi vele?\n4. 2–3 pár megosztja, mire jutott.", "caution": "A helyzetek legyenek ismerősek, de ne konkrét osztálybeli esetek. Ha egy valódi, éppen zajló konfliktus kerül szóba, azt ne itt beszéljétek meg, hanem külön.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": "{\"11–12\": \"A helyzetkártyák helyett saját, kitalálható helyzetekkel dolgozzanak: vizsgadrukk, munkahelyi helyzet, párkapcsolati vita.\"}"}, {"id": "VC03-4", "theme_id": "t03", "name": "Vészhelyzet eszköztár", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "8", "description": "Mindenki összeállítja a saját „vészhelyzet eszköztárát”.", "tools": "papír, filcek", "keywords": "megküzdés, stresszkezelés, saját stratégiák, eszköztár", "source": "Vibe Check, 3. alkalom", "instructions": "1. Mindenki egy lapra (vagy a munkalapra) gyűjti: mi segít neki, ha dühös, szorong, vagy túl sok minden szakad rá (zene, séta, beszélgetés valakivel, légzés).\n2. Három részre osztják: mit tehetnek azonnal (egy perc alatt), még aznap, és hosszabb távon.\n3. Párban kicserélnek egy-egy ötletet.\n4. Az eszköztárat mindenki megtartja.", "caution": "Ha valaki ártalmas megoldásra utal (például önsértésre vagy szerhasználatra), ne a csoport előtt reagálj részletesen, de az óra után mindenképp beszélj vele, és kérd az iskolapszichológus segítségét. Írják bele az eszköztárba azt is, kihez fordulhatnak az iskolában.", "variants": null}, {"id": "VC03-5", "theme_id": "t03", "name": "Egy technika a hétre", "type": "Lezárás", "type_order": 5, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki kiválaszt egy technikát, amit a héten kipróbál.", "tools": null, "keywords": "vállalás, lezárás, záró kör", "source": "Vibe Check, 3. alkalom", "instructions": "Körben mindenki megnevez egy technikát, amit a héten kipróbál. A következő alkalommal röviden visszakérdezel.", "caution": "A visszakérdezés ne legyen számonkérés: az is érvényes válasz, hogy nem sikerült.", "variants": null}, {"id": "VC04-1", "theme_id": "t04", "name": "Egy tárgy a táskámból", "type": "Ráhangolódás", "type_order": 1, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Egy tárgy a táskámból, ami ma jellemez engem.", "tools": null, "keywords": "önismeret, bemutatkozás, tárgy, check-in", "source": "Vibe Check, 4. alkalom", "instructions": "1. Mindenki kiválaszt egy tárgyat a táskájából, ami ma jellemzi.\n2. Körben egy-két mondat: „Ez a kulacsom, mert ma…”", "caution": "Bármilyen tárgy jó, akár egy toll is. Ne kérd, hogy kipakolják a táskájukat.", "variants": null}, {"id": "VC04-2", "theme_id": "t04", "name": "Erősségvadászat", "type": "Bemelegítő játék", "type_order": 2, "minutes": 15, "depth": "Könnyű", "grade": "5–12", "description": "Párban egymás erősségeit keressük. Rövid, önálló alkalomként is megtarthatod.", "tools": null, "keywords": "erősségek, pozitív visszajelzés, önbecsülés, páros munka", "source": "Vibe Check, 4. alkalom", "instructions": "1. Párban 3 percig mesélnek egymásnak valamiről, ami jól sikerült nekik.\n2. A hallgató közben erősségeket „vadász” (kitartás, humor, segítőkészség).\n3. Visszamondja: „Azt hallottam, hogy te…”\n4. Utána szerepet cserélnek.", "caution": "Ha nehezen jönnek a szavak, adj egy erősséglistát. Figyelj arra, hogy a párok komolyan vegyék, és ne gúnyolódjanak.", "variants": null}, {"id": "VC04-3", "theme_id": "t04", "name": "Értékkártyák: az öt legfontosabb", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "8", "description": "Mindenki kiválasztja és sorba rendezi az öt legfontosabb értékét.", "tools": "értékkártyák, „Én-térkép” munkalap", "keywords": "értékek, önismeret, prioritások, rangsorolás", "source": "Vibe Check, 4. alkalom", "instructions": "1. Mindenki kap egy pakli értékkártyát (pl. barátság, szabadság, siker, család, igazságosság).\n2. Kiválasztják a 10 legfontosabbat, abból 5-öt, majd rangsorolják őket.\n3. Az Én-térkép munkalapra felírják.\n4. Egy percig mindenki magában végiggondolja: miért ez került az első helyre?", "caution": "Az értékválasztás személyes: senkinek ne kelljen a csoport előtt indokolnia. Ne értékeld a választásokat, nincs „jobb” érték.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": "{\"7–8\": \"Öt helyett három értéket válasszanak, egyszerűbb szókincsű kártyákról (pl. barátság, igazság, család, szabadság, segítség).\"}"}, {"id": "VC04-4", "theme_id": "t04", "name": "Mikor éltem az értékeim szerint?", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Mély", "grade": "8", "description": "Kiscsoportban: mikor éltem az értékeim szerint, és mikor nem?", "tools": null, "keywords": "értékek, önreflexió, döntések, kiscsoport", "source": "Vibe Check, 4. alkalom", "instructions": "1. 3–4 fős kiscsoportok.\n2. Aki akar, megoszt egy helyzetet, amikor az egyik értéke szerint döntött, és egyet, amikor nem.\n3. A többiek csak kérdeznek, nem ítélkeznek.\n4. Közös zárás: mi segít abban, hogy az értékeink szerint döntsünk?", "caution": "Mély gyakorlat: csak akkor válaszd, ha a csoportban már kialakult a bizalom. Előtte emlékeztess a szabályokra (titoktartás, passzolás). Elég, ha az első helyzetet osztják meg; a „mikor nem” maradhat gondolatban is. 7–8. osztályban maradjatok a pozitív kérdésnél („mikor éltem az értékeim szerint?”), és párban beszélgessenek.", "variants": null}, {"id": "VC04-5", "theme_id": "t04", "name": "Egy erősségem, amire büszke vagyok", "type": "Lezárás", "type_order": 5, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Záró kör: mindenki megnevez egy erősségét.", "tools": null, "keywords": "erősségek, önbecsülés, büszkeség, záró kör", "source": "Vibe Check, 4. alkalom", "instructions": "Körben mindenki megnevez egy erősségét: „Büszke vagyok arra, hogy…”", "caution": "Akinek ez nehéz, annak a párja „kölcsönadhat” egyet az erősségvadászatból.", "variants": null}, {"id": "VC05-1", "theme_id": "t05", "name": "Visszamondás", "type": "Ráhangolódás", "type_order": 1, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki mond egy mondatot, a szomszédja a saját szavaival visszamondja.", "tools": null, "keywords": "aktív hallgatás, visszatükrözés, figyelem, parafrázis", "source": "Vibe Check, 5. alkalom", "instructions": "1. Körben mindenki mond egy mondatot magáról (pl. mit csinált a hétvégén).\n2. A jobb oldali szomszéd a saját szavaival visszamondja: „Ha jól értem, te…”\n3. Az első megmondja, pontos volt-e.", "caution": "Mondd el, hogy nem szó szerint kell megismételni, hanem a saját szavaikkal kell visszaadni a lényeget.", "variants": null}, {"id": "VC05-2", "theme_id": "t05", "name": "A „rossz hallgató”", "type": "Bemelegítő játék", "type_order": 2, "minutes": 15, "depth": "Könnyű", "grade": "5–12", "description": "Eljátsszuk, milyen a rossz hallgató: telefonozik, félbeszakít, magáról beszél.", "tools": null, "keywords": "rossz hallgató, figyelmetlenség, félbeszakítás, telefon, humor", "source": "Vibe Check, 5. alkalom", "instructions": "1. Egy önkéntessel eljátszotok egy beszélgetést, amelyben te vagy a rossz hallgató (telefonozol, félbeszakítasz, magadról beszélsz).\n2. A csoport összegyűjti, mit vett észre.\n3. Párban kipróbálják: egyikük mesél, a másik 1 percig rossz hallgató.\n4. Megbeszélik: mit éreztek?", "caution": "Csak röviden csinálják, és mindenképp kérdezd meg a mesélőt, milyen volt neki. Utána váltsatok jó hallgatásra, hogy ne rossz élménnyel záruljon.", "variants": null}, {"id": "VC05-3", "theme_id": "t05", "name": "Hármas csoportok forgó szerepekkel", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "8", "description": "Hármas csoportokban dolgoznak: egy beszélő, egy hallgató és egy megfigyelő, a szerepeket pedig körbe cserélik.", "tools": "beszélgetéstéma-kártyák, időzítő, megfigyelőlap", "keywords": "aktív hallgatás, nyitott kérdés, visszatükrözés, triád, megfigyelés", "source": "Vibe Check, 5. alkalom", "instructions": "1. Hármas csoportok: beszélő, hallgató, megfigyelő.\n2. A beszélő 3 percig beszél egy témakártya alapján.\n3. A hallgató aktívan figyel: szemkontaktus, visszatükrözés, nyitott kérdések.\n4. A megfigyelő a megfigyelőlapon jegyzetel.\n5. Két perc visszajelzés után szerepet cserélnek, amíg mindenki ki nem próbálta mindhárom szerepet.", "caution": "A témák legyenek könnyűek (hobbi, egy jó nap). Használj időzítőt, és tartsd a ritmust. A megfigyelő visszajelzése legyen konkrét, és kezdődjön azzal, ami jól ment.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": "{\"7–8\": \"Legyenek rövidebbek, kétpercesek a körök. A megfigyelő kapjon egy lapot néhány pipálható szemponttal (szemkontaktus, nem szakította félbe, visszakérdezett).\"}"}, {"id": "VC05-4", "theme_id": "t05", "name": "Mitől éreztem magam meghallgatva?", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "8", "description": "Közösen megbeszéljük, mitől érezték magukat meghallgatva, és mi zavarta őket.", "tools": null, "keywords": "meghallgatás, élmények megbeszélése, visszajelzés", "source": "Vibe Check, 5. alkalom", "instructions": "1. Körben: mitől érezted magad meghallgatva? Mi zavart?\n2. Gyűjtsétek össze a táblán, miről lehet felismerni a jó hallgatót.", "caution": "A kritika a viselkedésről szóljon, ne a társról.", "variants": null}, {"id": "VC05-5", "theme_id": "t05", "name": "Amit ezentúl másképp csinálok", "type": "Lezárás", "type_order": 5, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Egy dolog, amit ezentúl másképp csinálok, amikor valaki beszél hozzám.", "tools": null, "keywords": "vállalás, lezárás, záró kör", "source": "Vibe Check, 5. alkalom", "instructions": "Körben mindenki egy dolgot mond, amit ezentúl másképp csinál, amikor valaki beszél hozzá.", "caution": "Lehet ez egy apróság, de akár komolyabb vállalás is, például: „Leteszem a telefont, amikor valaki hozzám beszél.”", "variants": null}, {"id": "VC06-1", "theme_id": "t06", "name": "Hangulat képkártyával", "type": "Ráhangolódás", "type_order": 1, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki választ egy képkártyát, ami a mai hangulatát mutatja.", "tools": "az app hangulatkártyái (kivetítve vagy kartonra nyomtatva, kivágva), vagy választhatóan Dixit-kártyák", "keywords": "hangulat, képkártya, Dixit, check-in, asszociáció", "source": "Vibe Check, 6. alkalom", "instructions": "1. Kivetíted vagy kiteríted a hangulatkártyákat (kinyomtatott hangulatkártya vagy Dixit).\n2. Mindenki választ egyet, ami a mai hangulatát mutatja.\n3. Körben egy mondat: „Ezt választottam, mert…”", "caution": "Kézbe vehető kártyával lassabban, személyesebben választanak: nyomtasd a hangulatkártyákat kartonra, vagy használj Dixitet. Kivetítve a diákok a kép számát mondják. Passzolni lehet.", "variants": null}, {"id": "VC06-2", "theme_id": "t06", "name": "Más cipőjében", "type": "Bemelegítő játék", "type_order": 2, "minutes": 15, "depth": "Közepes", "grade": "5–12", "description": "Egy rövid történetet egy másik szereplő szemével mesélünk el újra.", "tools": "szerepkártyák", "keywords": "nézőpontváltás, perspektíva, empátia, történetmesélés", "source": "Vibe Check, 6. alkalom", "instructions": "1. Elmesélsz vagy kiosztasz egy rövid történetet, pl. egy veszekedést két barát között.\n2. A párok vagy kiscsoportok egy-egy szereplőt kapnak, és az ő szemszögéből, egyes szám első személyben mesélik el újra.\n3. Megosztják: mi változott a történetben?", "caution": "A szereplők legyenek kitaláltak, ne az osztályból ismert esetek.", "variants": null}, {"id": "VC06-3", "theme_id": "t06", "name": "Forró szék", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "8", "description": "Egy diák egy szereplő bőrébe bújva válaszol a csoport kérdéseire.", "tools": "szerepkártyák rövid élethelyzetekkel", "keywords": "forró szék, szerepjáték, empátia, előítélet, nézőpont", "source": "Vibe Check, 6. alkalom", "instructions": "1. Egy önkéntes leül a „forró székre”, és kap egy szerepkártyát (pl. „Új diák vagyok, aki félév közben érkezett”).\n2. Egy perc felkészülés, majd a csoport kérdez, ő pedig a szerepben válaszol.\n3. 5–7 perc után kilép a szerepből: feláll, ellép a széktől, és kimondja a saját nevét.\n4. 2–3 kör más szereplőkkel.", "caution": "Mély gyakorlat. Csak önkéntesek ülhetnek a székre, és csak kitalált szereplőkkel. A végén mindenkit léptess ki a szerepből. Ne adj olyan szerepet, ami túl közel áll valakinek a saját helyzetéhez, ha tudsz ilyenről. Ha a kérdések gúnyosak vagy bántóak lesznek, állítsd meg.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": "{\"7–8\": \"Ismert könyv- vagy filmszereplővel dolgozzatok. Az első szereplőt te mutasd be a forró széken, hogy lássák, hogyan működik.\"}"}, {"id": "VC06-4", "theme_id": "t06", "name": "Ami elsőre nem látszott", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "8", "description": "Mit tudtunk meg a szereplőről, ami elsőre nem látszott?", "tools": null, "keywords": "előítélet, megértés, első benyomás, megbeszélés", "source": "Vibe Check, 6. alkalom", "instructions": "1. Közös kör: mit tudtunk meg a szereplőről, ami elsőre nem látszott?\n2. Mi volt az első benyomásunk, és mi változott?\n3. Térjetek át a valóságra: hol találkozunk ilyesmivel a hétköznapokban?", "caution": "Először a forró széken ülőket kérdezd: milyen volt a szerepben lenni?", "variants": null}, {"id": "VC06-5", "theme_id": "t06", "name": "Akit jobban szeretnék megérteni", "type": "Lezárás", "type_order": 5, "minutes": 5, "depth": "Közepes", "grade": "5–12", "description": "Mindenki gondol valakire, akit jobban szeretne megérteni. Nevet nem kell mondani.", "tools": null, "keywords": "empátia, kapcsolatok, megértés, záró kör", "source": "Vibe Check, 6. alkalom", "instructions": "Körben vagy csak gondolatban: valaki, akit jobban szeretnék megérteni. Nevet nem kell mondani, elég annyi, hogy „egy családtagom” vagy „egy osztálytársam”.", "caution": "Lezárhatjátok csendben is: ki-ki gondolatban vagy a naplójában válaszol.", "variants": "{\"7–8\": \"Valódi ember helyett választhatnak egy kitalált szereplőt is, akit jobban szeretnének megérteni.\"}"}, {"id": "VC07-1", "theme_id": "t07", "name": "Egy bosszantó helyzet", "type": "Ráhangolódás", "type_order": 1, "minutes": 5, "depth": "Közepes", "grade": "5–12", "description": "Mindenki elmesél egy helyzetet, ami mostanában bosszantotta. Passzolni lehet.", "tools": null, "keywords": "bosszúság, sérelem, check-in, passzolás", "source": "Vibe Check, 7. alkalom", "instructions": "Körben mindenki röviden megoszt egy helyzetet, ami mostanában bosszantotta. Nem kommentáljuk. A helyzeteket később gyakorlásra használhatod.", "caution": "Passzolni lehet. Osztálytársat vagy tanárt ne nevezzenek meg, inkább mondják azt, hogy „valaki”. Ha egy éppen zajló konfliktus kerül szóba, azzal külön foglalkozz.", "variants": null}, {"id": "VC07-2", "theme_id": "t07", "name": "Te-üzenet vagy én-üzenet?", "type": "Bemelegítő játék", "type_order": 2, "minutes": 15, "depth": "Könnyű", "grade": "5–12", "description": "Párban szétválogatják a mondatcsíkokat: melyik te-üzenet, és melyik én-üzenet?", "tools": "mondatcsíkok", "keywords": "én-üzenet, te-üzenet, vádaskodás, kommunikáció, válogatás", "source": "Vibe Check, 7. alkalom", "instructions": "1. A párok mondatcsíkokat kapnak (pl. „Mindig késel!” vagy „Aggódom, amikor nem érkezel időben”).\n2. Két csoportba válogatják őket.\n3. Közösen: mi a különbség? Hogy érzed magad, ha te-üzenetet kapsz?\n4. Néhány te-üzenetet közösen átfogalmazunk.", "caution": "Mondd ki, hogy az én-üzenet nem varázsszó: a hangnem is számít.", "variants": "{\"11–12\": \"Kész mondatcsíkok helyett mindenki ír három saját mondatot, amit mostanában mondott vagy hallott, és én-üzenetté írja át.\"}"}, {"id": "VC07-3", "theme_id": "t07", "name": "A négy lépés gyakorlása párban", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "8", "description": "Helyzetkártyák segítségével gyakoroljuk a négy lépést: megfigyelés, érzés, szükséglet, kérés.", "tools": "a négy lépés kártyán, helyzetkártyák", "keywords": "erőszakmentes kommunikáció, EMK, Rosenberg, én-üzenet, szükséglet, kérés", "source": "Vibe Check, 7. alkalom", "instructions": "1. Kiteszed a négy lépést: Megfigyelés („Amikor azt látom…”), Érzés („…úgy érzem magam…”), Szükséglet („…mert fontos nekem…”), Kérés („Megkérnélek…”).\n2. Közösen végigmegyünk egy példán.\n3. A párok helyzetkártyát húznak, megfogalmazzák a négy lépést, majd eljátsszák.\n4. Szerepcsere.", "caution": "Gyakori hiba, hogy a megfigyelésbe ítéletet csempésznek („Amikor bunkó vagy…”), vagy az érzésből burkolt vád lesz („úgy érzem, hogy átversz”). Adj melléjük érzelemszó-listát.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": "{\"7–8\": \"Négy helyett két lépéssel dolgozzatok (érzés + kérés), mondatkezdőkkel: „Én … érzem magam, és azt kérném, hogy …”.\"}"}, {"id": "VC07-4", "theme_id": "t07", "name": "Páros bemutatók és visszajelzés", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "8", "description": "Két-három pár eljátssza a helyzetét, a csoport visszajelez.", "tools": null, "keywords": "szerepjáték, visszajelzés, bemutató", "source": "Vibe Check, 7. alkalom", "instructions": "1. 2–3 önkéntes pár eljátssza a helyzetét.\n2. A csoport visszajelez: melyik lépés volt erős, hol lehetne pontosítani?\n3. Egy jelenetet javított változatban újra is eljátszhatnak.", "caution": "Csak önkéntes párok játsszanak. A visszajelzés azzal kezdődjön, ami működött, és csak utána jöjjön a javaslat.", "variants": null}, {"id": "VC07-5", "theme_id": "t07", "name": "Egy mondat én-üzenetként", "type": "Lezárás", "type_order": 5, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki megfogalmaz egy mondatot, amit ezentúl én-üzenetként mondana el.", "tools": null, "keywords": "én-üzenet, vállalás, záró kör", "source": "Vibe Check, 7. alkalom", "instructions": "Körben vagy írásban: egy mondat, amit ezentúl én-üzenetként mondanék el.", "caution": "Ha a mondat túl személyes, elég a naplóba írni.", "variants": null}, {"id": "VC08-1", "theme_id": "t08", "name": "Melyik állat vagyok egy vitában?", "type": "Ráhangolódás", "type_order": 1, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Teknős, cápa, mackó, róka vagy bagoly: melyik vagyok egy vitában?", "tools": "állatkártyák", "keywords": "konfliktusstílus, vita, veszekedés, önismeret, állatok", "source": "Vibe Check, 8. alkalom", "instructions": "1. Bemutatod az öt állatot: teknős (elkerül), cápa (győzni akar), mackó (enged), róka (alkuszik), bagoly (közös megoldást keres).\n2. Mindenki odaáll annak az állatnak a kártyájához, amelyik egy vitában a leginkább jellemzi.\n3. Akik ugyanannál az állatnál állnak, megbeszélik: mikor jó ez a stílus, és mikor nem?", "caution": "Hangsúlyozd, hogy egyik stílus sem rossz, mindegyiknek megvan a helye. Ne címkézzék egymást („te tipikus cápa vagy”).", "variants": "{\"11–12\": \"Az állatok mellé írd fel a stílusok nevét és rövid leírását (elkerülő, versengő, alkalmazkodó, kompromisszumkereső, együttműködő).\"}"}, {"id": "VC08-2", "theme_id": "t08", "name": "Narancs-feladat", "type": "Bemelegítő játék", "type_order": 2, "minutes": 15, "depth": "Könnyű", "grade": "5–12", "description": "Két csapat ugyanazt a narancsot akarja: van-e megoldás, ahol mindkét fél nyer?", "tools": "egy narancs", "keywords": "érdekek, tárgyalás, mindkét fél nyer, kompromisszum, vita", "source": "Vibe Check, 8. alkalom", "instructions": "1. Két csapat, mindkettő titkos utasítást kap: az egyiknek a narancs héja kell (sütihöz), a másiknak a leve (italhoz). A másik csapat ezt nem tudja.\n2. 5 perc tárgyalás: ki kapja a narancsot?\n3. Megbeszélés: rájöttek-e, hogy mindkettő megkaphatja, amit akar? Miért nem kérdezték meg egymást, mire kell nekik?", "caution": "Ne áruld el előre a csavart. A tanulság: érdemes kideríteni, mi áll a másik kérése mögött. Ha az egyik csapat túl agresszív, az is jó anyag a megbeszéléshez.", "variants": null}, {"id": "VC08-3", "theme_id": "t08", "name": "Az öt stílus szerepjátékban", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "8", "description": "Konfliktushelyzeteket játszanak el, és mind az öt konfliktuskezelési stílust kipróbálják.", "tools": "konfliktushelyzet-kártyák", "keywords": "konfliktus, veszekedés, vita, szerepjáték, kompromisszum, együttműködés", "source": "Vibe Check, 8. alkalom", "instructions": "1. Párok vagy hármasok konfliktushelyzet-kártyát húznak (pl. „Ketten ugyanazt a témát szeretnétek a kiselőadáshoz”).\n2. Ugyanazt a helyzetet többször eljátsszák, mindig más stílusban (egy húzott állatkártya alapján).\n3. Feljegyzik, melyik változat hogyan végződött.", "caution": "Szerepjáték közben az indulatok valódivá válhatnak: ha kell, állítsd meg, és léptesd ki őket a szerepből. Valós osztálybeli konfliktust ne használj.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": "{\"7–8\": \"Öt helyett három stílussal dolgozzatok (elkerülés, erő, együttműködés), és elég 2–3 helyzet.\"}"}, {"id": "VC08-4", "theme_id": "t08", "name": "Melyik stílus mikor működik?", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "8", "description": "Közösen megbeszéljük, melyik stílus mikor működik, és mikor árt.", "tools": null, "keywords": "konfliktusstílusok, megbeszélés, reflexió", "source": "Vibe Check, 8. alkalom", "instructions": "1. A táblára táblázatot rajzolsz: az öt stílus, mellettük „mikor működik” és „mikor árt”.\n2. A párok tapasztalatai alapján közösen kitöltitek.\n3. Példák: az elkerülés jó, ha a téma nem fontos, vagy túl fűtött a helyzet; az együttműködés akkor, ha a kapcsolat és a cél is fontos.", "caution": "Ne a „bagoly” legyen az egyetlen helyes válasz.", "variants": null}, {"id": "VC08-5", "theme_id": "t08", "name": "Egy vita, amit ma már másképp kezelnék", "type": "Lezárás", "type_order": 5, "minutes": 5, "depth": "Közepes", "grade": "5–12", "description": "Mindenki felidéz egy vitát, amit ma már másképp kezelne.", "tools": null, "keywords": "vita, önreflexió, záró kör", "source": "Vibe Check, 8. alkalom", "instructions": "Csendes egyéni gondolkodás, majd aki akar, megosztja: egy saját vita, amit ma már másképp kezelne, és hogyan.", "caution": "Magát a vitát nem kell elmesélni, elég a „mit csinálnék másképp” rész. Jelen lévő társat ne nevezzenek meg.", "variants": null}, {"id": "VC09-1", "theme_id": "t09", "name": "Egy csapat, amelynek szívesen voltam tagja", "type": "Ráhangolódás", "type_order": 1, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki mesél egy csapatról, amelynek szívesen volt a tagja.", "tools": null, "keywords": "csapat, közösség, élmény, check-in", "source": "Vibe Check, 9. alkalom", "instructions": "Körben mindenki mesél egy csapatról (sport, zenekar, osztály, tábor), amelynek szívesen volt a tagja, és elmondja, miért.", "caution": "Akinek nincs ilyen élménye, mondhat olyat, amelyhez szívesen tartozna.", "variants": null}, {"id": "VC09-2", "theme_id": "t09", "name": "Bizalomjáték bekötött szemmel", "type": "Bemelegítő játék", "type_order": 2, "minutes": 15, "depth": "Közepes", "grade": "5–12", "description": "Párban vezetjük egymást bekötött szemmel.", "tools": "szemkendők", "keywords": "bizalom, vezetés, páros, mozgás, felelősség", "source": "Vibe Check, 9. alkalom", "instructions": "1. Párok: egyikük bekötött szemmel, a másik szóban vagy a könyökénél fogva vezeti a teremben, akadályok között.\n2. 3 perc után csere.\n3. Rövid megbeszélés: mi kellett a bizalomhoz?", "caution": "Csak akkor érintsék meg egymást, ha a társuk beleegyezik; a szóbeli vezetést is választhassák. A szemkendő nem kötelező: a csukott szem is jó, és bármikor ki lehet nyitni. Csak puha akadályok legyenek, lépcső és éles sarkok ne.", "variants": null}, {"id": "VC09-3", "theme_id": "t09", "name": "Marshmallow-kihívás", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "8", "description": "A csapatok 18 perc alatt a lehető legmagasabb tornyot építik meg spagettiből. Nem lehet lerövidíteni, kb. 25 perc kell hozzá.", "tools": "spagetti, ragasztószalag, zsineg, pillecukor", "keywords": "csapatmunka, együttműködés, kihívás, építés, csapatszerepek", "source": "Vibe Check, 9. alkalom", "instructions": "1. 4 fős csapatok. Mindegyik kap 20 szál spagettit, 1 m ragasztószalagot, 1 m zsineget és 1 pillecukrot.\n2. A feladat: építsék meg 18 perc alatt a legmagasabb szabadon álló tornyot, és tegyék a tetejére a pillecukrot.\n3. Jelzed az időt (10, 5 és 1 perc van hátra).\n4. Megméritek a tornyokat, és kihirdetitek az eredményt.", "caution": "Közben jegyzetelj a feldolgozáshoz: ki vezet, ki csendes, mikor próbálják ki a pillecukrot. Figyelj az ételallergiákra. Ezt a gyakorlatot nem lehet lerövidíteni, kb. 25 perc kell hozzá.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC09-4", "theme_id": "t09", "name": "Ki milyen szerepet vállalt?", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "8", "description": "Ki milyen szerepet vállalt? Mi segített, és mi akadályozott?", "tools": null, "keywords": "csapatszerepek, reflexió, megbeszélés", "source": "Vibe Check, 9. alkalom", "instructions": "1. Csapatonként: ki milyen szerepet vállalt (ötletgazda, építő, időfigyelő, csendes megfigyelő)?\n2. Mi segítette, és mi akadályozta a munkát?\n3. Közösen: korán vagy későn próbáltátok ki a pillecukrot? Mit tanít ez a közös munkáról?", "caution": "A szerepekről ne ítélkező hangon beszéljetek. Emeld ki, hogy a csendesebbek szerepe is értékes.", "variants": null}, {"id": "VC09-5", "theme_id": "t09", "name": "Amit a csoporttól tanultam", "type": "Lezárás", "type_order": 5, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki megoszt egy dolgot, amit ma a csoporttól tanult.", "tools": null, "keywords": "tanulság, záró kör, közösség", "source": "Vibe Check, 9. alkalom", "instructions": "Körben mindenki megoszt egy dolgot, amit ma a csoporttól tanult.", "caution": "Rövid, gyors kör legyen.", "variants": null}, {"id": "VC10-1", "theme_id": "t10", "name": "Egy pillanat a tanévből", "type": "Ráhangolódás", "type_order": 1, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki felidéz egy pillanatot a tanévből, amelyre szívesen emlékszik.", "tools": null, "keywords": "emlék, félév, visszatekintés, check-in", "source": "Vibe Check, 10. alkalom", "instructions": "Körben mindenki felidéz egy pillanatot a tanévből, amire szívesen emlékszik.", "caution": "Aki nem volt ott minden alkalmon, az is tud mondani valamit: ezt mondd ki előre.", "variants": null}, {"id": "VC10-2", "theme_id": "t10", "name": "Záró önértékelő kérdőív", "type": "Bemelegítő játék", "type_order": 2, "minutes": 15, "depth": "Könnyű", "grade": "5–12", "description": "Kitöltik a záró kérdőívet, és összevetik azzal, amit az első alkalommal töltöttek ki.", "tools": "a kezdő kérdőívek", "keywords": "önértékelés, kérdőív, fejlődés, összehasonlítás", "source": "Vibe Check, 10. alkalom", "instructions": "1. Ugyanazt a kérdőívet töltik ki, mint az első alkalommal.\n2. Visszaadod a kezdő kérdőíveket (a jelige alapján), és mindenki a sajátjával veti össze.\n3. Aki akar, megosztja, hol látja a legnagyobb változást.", "caution": "Az is rendben van, ha valakinél nem látszik fejlődés: a változás nem mindig mérhető. Az eredményeket ne hasonlítgassák egymáséhoz.", "variants": null}, {"id": "VC10-3", "theme_id": "t10", "name": "Hátra írt üzenetek", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "8", "description": "Mindenki hátára papírlapot ragasztunk, és a többiek kedves, konkrét üzeneteket írnak rá.", "tools": "papírlapok, cellux, filcek", "keywords": "pozitív visszajelzés, dicséret, közösség, lezárás", "source": "Vibe Check, 10. alkalom", "instructions": "1. Mindenki hátára ragasztunk egy papírlapot.\n2. A diákok körbejárnak, és mindenkinek írnak egy rövid, konkrét, pozitív üzenetet (névtelenül).\n3. A végén leveszik a lapot, és elolvassák.", "caution": "Előre mondd el, hogy csak kedves és konkrét üzenetet írhatnak, és ne a külsőről szóljon. Te is írj mindenkinek, és figyelj arra, hogy egyik lapon se legyen kevés üzenet.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": "{\"7–8\": \"Előre beszéljétek meg a szabályokat (csak kedves, konkrét üzenet). A lapokat nézd át, mielőtt hazaviszik.\"}"}, {"id": "VC10-4", "theme_id": "t10", "name": "Hálalevél", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Mély", "grade": "8", "description": "Mindenki levelet ír valakinek, akinek hálás. Nem kell elküldeni.", "tools": "levélpapír", "keywords": "hála, levél, kapcsolatok, írás", "source": "Vibe Check, 10. alkalom", "instructions": "1. Rövid bevezető: kinek lehetnénk hálásak? (családtag, barát, tanár, edző)\n2. 15 perc csendes írás.\n3. Nem kell elküldeni, és senkinek nem kell felolvasni.\n4. Aki akar, elmondja, milyen volt írni.", "caution": "Mély gyakorlat: előjöhet gyász vagy egy elvesztett kapcsolat. Legyen lehetőség arra, hogy valaki magának, egy elhunytnak, vagy csak egy mondatot írjon. Figyeld az érzelmi reakciókat, és ha kell, beszélj a diákkal óra után.", "variants": "{\"7–8\": \"Levél helyett írjanak egy rövid, 2–3 mondatos hálakártyát.\"}"}, {"id": "VC10-5", "theme_id": "t10", "name": "Záró kör a tanévről", "type": "Lezárás", "type_order": 5, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Záró kört tartunk: mindenki egy szóval vagy mondattal összegzi a mai órát és a tanévet.", "tools": null, "keywords": "záró kör, záróprojekt, kedvesség hete, lezárás", "source": "Vibe Check, 10. alkalom", "instructions": "1. Záró kör: mindenki egy szóval vagy egy mondattal elmondja, mit visz magával a mai óráról.\n2. Az utolsó alkalommal tegyétek hozzá: mi volt a tanév legjobb pillanata az osztályban?", "caution": "Passzolni is lehet. A szavakat ne kommentáld, csak köszönd meg.", "variants": null}, {"id": "VC12-1", "theme_id": "t12", "name": "Egy jó barát három tulajdonsága", "type": "Ráhangolódás", "type_order": 1, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki felír három tulajdonságot, ami szerinte egy jó barátot jellemez, aztán a táblán csoportosítjuk őket.", "tools": "öntapadós cetlik, filc", "keywords": "barátság, tulajdonságok, értékek, osztályközösség", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki három cetlire ír egy-egy tulajdonságot: „Szerintem egy jó barát…”.\n2. A cetliket felragasztják a táblára. Te a hasonlókat egymás mellé rendezed.\n3. Közösen megnézitek: melyik a leggyakoribb? Melyik lepett meg?", "caution": "Ne értékeld a válaszokat, és ne olvass fel neveket. Ha valaki „népszerű” vagy „menő” tulajdonságot ír, azt is tedd ki: a beszélgetésben előjöhet, mi a különbség a népszerűség és a barátság között.", "variants": null}, {"id": "VC12-2", "theme_id": "t12", "name": "Csoportba rendeződés", "type": "Bemelegítő játék", "type_order": 2, "minutes": 15, "depth": "Könnyű", "grade": "5–12", "description": "Mozgásos játék: a megadott szempont szerint mindenki megkeresi a csoportját, a végén pedig beszélgetünk arról, milyen egyedül maradni.", "tools": "szabad tér", "keywords": "mozgás, csoport, kimaradás, összetartozás, energizáló", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mondj egy szempontot, például kedvenc évszak, testvérek száma, reggeli vagy esti típus, kedvenc tantárgy.\n2. Mindenki megkeresi azokat, akik ugyanazt mondják, és csoportba áll velük. Egy-egy kör legyen gyors.\n3. 5–6 kör után üljetek le: Milyen volt, amikor nagy csoportban voltál? És amikor kevesen vagy egyedül?\n4. Vezesd át a beszélgetést arra, milyen kimaradni egy osztályban.", "caution": "Válassz semleges szempontokat, amelyek senkit nem tesznek ki. Ha valaki egyedül marad, kérdezd meg tőle elsőként, és ismerd el: „ez bátorság volt”.", "variants": null}, {"id": "VC12-3", "theme_id": "t12", "name": "Szemlélőből segítő", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "7", "description": "Kiscsoportban kitalált csúfolási és kirekesztési helyzeteken gondolkodnak: mit tehet az, aki látja?", "tools": null, "keywords": "csúfolás, kirekesztés, szemlélő, segítség, bántalmazás megelőzése, szerepjáték", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Olvass fel 4–5 kitalált helyzetet: valakit kinevetnek a folyosón; valakit kihagynak a csoportchatből; valaki mindig utoljára marad a csapatválasztásnál; valakiről gúnyos képet küldenek tovább.\n2. Minden kiscsoport kap egy helyzetet. A kérdés: mit tehet az, aki látja? Három szintet keressenek: (a) később odamegy az érintetthez; (b) ott helyben megállítja; (c) szól egy felnőttnek.\n3. Minden csoport egy rövid jelenetben eljátssza az egyik megoldást.\n4. Közös beszélgetés: melyik a legkönnyebb, és melyik a leghatásosabb?", "caution": "Csak kitalált helyzetekkel dolgozzatok, osztálybeli nevek nélkül. Mondd ki, hogy felnőttnek szólni nem árulkodás. Ha valódi bántalmazás jön elő, beszélj négyszemközt, és kövesd az iskola eljárásrendjét.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC12-4", "theme_id": "t12", "name": "Online és offline", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "7", "description": "Párban összevetjük, miben más az online kirekesztés, majd közös szabályokat javaslunk a csoportchathez.", "tools": "papír, toll", "keywords": "online kirekesztés, csoportchat, képernyőkép, digitális szabályok", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Párban kétoszlopos táblázatot rajzolnak: „A suliban” és „Online”. Mi a különbség a kirekesztésben? (Online: tovább lehet küldeni, megmarad, nem látod az arcát, éjjel is folytatódhat.)\n2. Közösen összegyűjtitek a legfontosabb különbségeket.\n3. Mindenki javasol egy szabályt az osztály csoportchatjéhez („mások képét csak engedéllyel küldjük tovább”).\n4. A 3–4 legnépszerűbb szabályt felírjátok, és ha a csoport egyetért, el is fogadjátok.", "caution": "Ne kérd, hogy mutassanak valódi üzeneteket. Ha a csoportchat éppen most problémás, inkább a jövőre vonatkozó szabályokról beszéljetek, ne a múltbeli esetekről.", "variants": null}, {"id": "VC12-5", "theme_id": "t12", "name": "Akire ezen a héten figyelek", "type": "Lezárás", "type_order": 5, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki magában eldönti, kit hív be a héten egy beszélgetésbe vagy játékba, és elmondja, mit fog tenni.", "tools": null, "keywords": "lezárás, befogadás, figyelem, apró lépés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki gondol valakire, akit a héten behív egy beszélgetésbe, játékba vagy a padjához. Nevet nem mondunk.\n2. Körben csak azt mondják el, mit fognak tenni: „megkérdezem, hogy volt a hétvégéje”.", "caution": "Nevet ne mondjanak ki, hogy senki ne érezze magát „kiválasztott áldozatnak”. A következő alkalom elején kérdezz rá röviden.", "variants": null}, {"id": "VC13-1", "theme_id": "t13", "name": "Képernyőidő-tipp", "type": "Ráhangolódás", "type_order": 1, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki megtippeli, hány órát töltött tegnap képernyő előtt (telefon, tablet, gép), és beáll a padlón lévő skálára.", "tools": null, "keywords": "képernyőidő, telefon, szokások, önmegfigyelés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Jelölj ki a teremben egy skálát: 0 óra … 8 óra vagy több.\n2. Mindenki beáll oda, amennyit szerinte tegnap képernyő előtt töltött.\n3. Akinek van telefonja, és szeretné, megnézi a statisztikáját, és átáll a valódi helyére.\n4. Rövid kör: meglepett valakit a különbség?", "caution": "Ne szégyenítsd meg azt, aki sokat van a telefonján, és a statisztika megnézése legyen önkéntes. Te is állj be a skálára.", "variants": null}, {"id": "VC13-2", "theme_id": "t13", "name": "Képernyő-bingó", "type": "Bemelegítő játék", "type_order": 2, "minutes": 15, "depth": "Könnyű", "grade": "5–12", "description": "Bingókártyával körbejárunk, és mindenki olyan társat keres, akire igaz egy-egy digitális szokás. Kiderül, mennyire hasonlítanak a szokásaink.", "tools": "bingókártyák (nyomtatnivaló, diákonként egy), tollak", "keywords": "képernyőidő, digitális szokások, ismerkedés, mozgás, önmegfigyelés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki kap egy bingókártyát és egy tollat. A kártyák különbözőek, így mindenkinek más mezőt kell kitöltenie.\n2. A diákok körbejárnak, és minden mezőhöz keresnek valakit, akire igaz az állítás. A nevét beírják a mezőbe. Egy névvel csak egy mezőt tölthetnek ki.\n3. Aki elsőként kitölt egy teljes sort, oszlopot vagy átlót, bingót kiált. Ellenőrizzétek: felolvassa a mezőket, és a megnevezett társak bólintanak.\n4. Játsszatok tovább még 2–3 percig, aztán kérdezd meg: melyik mezőhöz volt a legkönnyebb és melyikhez a legnehezebb embert találni?\n5. Rövid átvezetés: melyik szokás lepett meg? Melyikre vagy büszke, és melyiken változtatnál?", "caution": "Mondd ki, hogy bárki mondhatja: „Ezt nem szeretném elárulni.” Senki ne kerüljön kínos helyzetbe egy mező miatt.", "variants": null}, {"id": "VC13-6", "theme_id": "t13", "name": "Emoji-tolmács", "type": "Bemelegítő játék", "type_order": 2, "minutes": 15, "depth": "Könnyű", "grade": "5–12", "description": "Párban az egyik diák emojikkal „fordít le” egy mondatot, a másik visszafordítja. Kiderül, mennyi félreértés születik az írott üzenetekben.", "tools": "mondatkártyák (a vetíthető diákon is), papír és toll vagy telefon", "keywords": "emoji, online kommunikáció, félreértés, üzenetek, nem verbális jelek", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Alakítsatok párokat. Az egyik diák húz (vagy kap a vetítésről) egy mondatot, pl. „Haragszom rád, de nem akarom, hogy tudd.” „Késni fogok, bocsi, de hozok sütit.” „Ez a nap rosszul indult, de jól végződött.”\n2. A mondatot csak emojikkal írja le papírra vagy a telefonjára, szavak nélkül.\n3. A párja megpróbálja visszafordítani szavakra. Utána összevetik az eredeti mondattal.\n4. Csere, új mondattal. 2–3 kör után néhány pár megmutatja a legviccesebb vagy legfurcsább félreértést.\n5. Rövid átvezetés: Mi veszett el a fordításban? Mikor értettek már félre egy emoji vagy egy rövid üzenet miatt? Mit tehetünk, hogy az üzeneteink érthetőbbek legyenek?", "caution": "Ha telefonon dolgoznak, csak egymásnak mutassák meg, ne küldjék el sehová.", "variants": null}, {"id": "VC13-3", "theme_id": "t13", "name": "A csoportchat", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Egy kitalált csoportchat-szálon kiscsoportban megkeressük, hol fordult át a vicc megszégyenítésbe, és átírjuk a szálat.", "tools": "kinyomtatott vagy kivetített kitalált chatszál", "keywords": "csoportchat, online konfliktus, megszégyenítés, cyberbullying, online kommunikáció", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Írj előre egy 12–15 üzenetes kitalált csoportchatet: valaki megoszt egy fotót egy osztálytársról, a többiek viccelődnek, a végén már gúnyolódás lesz belőle.\n2. Kiscsoportban válaszolják meg: Melyik üzenetnél fordult át? Ki mit érezhetett (a képen lévő, aki küldte, aki csak olvasta)?\n3. Írják át a szálat: egy vagy két üzenettel valaki megállíthatta volna. Mit írt volna?\n4. A csoportok felolvassák az átírt változatot, és összehasonlítjátok, mi működik a legjobban.", "caution": "A chatszál legyen egyértelműen kitalált, ne hasonlítson valódi esetre az osztályban. Mondd el, hogy a „csak olvastam” szerep is számít: egy rövid üzenet sokat változtathat.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC13-4", "theme_id": "t13", "name": "Görgetés után", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "9", "description": "Mindenki végiggondolja, mikor érezte magát rosszabbul a közösségi média után, aztán közösen összegyűjtjük, mi segít.", "tools": "papír, toll", "keywords": "összehasonlítás, önértékelés, közösségi média, jóllét, digitális szokások", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Egyénileg, 5 percben: Mikor éreztem magam rosszabbul görgetés után? Kihez vagy mihez hasonlítottam magam? Milyen tartalom után érzem magam jobban?\n2. Párban megosztják, amit szeretnének.\n3. Közösen gyűjtsétek össze: mi segít? (fiókok némítása, követések átnézése, telefonmentes idő, értesítések kikapcsolása)\n4. A listát felírod, és lefotózhatják.", "caution": "Ne moralizálj („a közösségi média rossz”): a cél az, hogy mindenki észrevegye a saját mintáit. Ha valaki tartósan rossz önértékelésről beszél, beszélj vele utána.", "variants": null}, {"id": "VC13-5", "theme_id": "t13", "name": "Egy digitális szokás, amin változtatok", "type": "Lezárás", "type_order": 5, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki kiválaszt egy kicsi, konkrét digitális szokást, amin a következő héten változtat.", "tools": null, "keywords": "lezárás, digitális szokás, cél, apró lépés", "source": "Lélektér
