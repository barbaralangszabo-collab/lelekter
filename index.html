 – évfolyamsávos kiegészítés", "instructions": "1. Körben mindenki mond egy kicsi, konkrét változtatást: „este 10 után nem viszem be a telefont a szobámba”, „kikapcsolom az egyik app értesítéseit”.\n2. A következő alkalom elején rákérdezel, kinek sikerült.", "caution": "Legyen apró és konkrét, ne olyan általános, mint a „kevesebbet telefonozom”. Ha valaki nem akar változtatni, elég, ha egy szokását megnevezi.", "variants": null}, {"id": "VC14-1", "theme_id": "t14", "name": "Igen vagy nem?", "type": "Ráhangolódás", "type_order": 1, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Állításokra a terem két oldalára állunk: mennyire könnyen mondok nemet?", "tools": "szabad tér", "keywords": "nemet mondás, határok, önismeret, mozgás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. A terem egyik fala az „igaz rám”, a másik a „nem igaz rám”. Középen is meg lehet állni.\n2. Mondj állításokat: „Könnyen mondok nemet egy barátomnak.” „Előfordult, hogy azért csináltam valamit, mert mindenki más is.” „Nehezen kérek segítséget.”\n3. Mindenki odaáll, ahova szerinte tartozik. Aki akar, egy mondatban elmondja, miért.", "caution": "Az állítások legyenek általánosak, és ne vezessenek személyes vallomásokhoz. Mindig lehet középre állni, ha valaki nem akar állást foglalni.", "variants": null}, {"id": "VC14-2", "theme_id": "t14", "name": "Nemet mondani ötféleképpen", "type": "Bemelegítő játék", "type_order": 2, "minutes": 15, "depth": "Könnyű", "grade": "5–12", "description": "Párban gyakoroljuk a nemet mondás öt módját egy ártalmatlan kérésre.", "tools": null, "keywords": "nemet mondás, asszertivitás, kommunikáció, határok", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Írd fel a táblára az öt módot: röviden („Nem, köszi.”), indoklással, alternatívával („Most nem, de holnap igen.”), halasztással („Átgondolom.”), humorral.\n2. Párban az egyik kér valamit a másiktól: kölcsönkéri a házi feladatát, elhívja valahova, vagy kér a csokijából.\n3. A másik mind az öt módon nemet mond. Utána cserélnek.\n4. Rövid kör: melyik ment a legkönnyebben, és melyik a legnehezebben?", "caution": "A kérések legyenek ártalmatlanok, a cél a mondatok gyakorlása. Mondd ki, hogy nincs egyetlen jó mód: helyzettől függ, melyik működik.", "variants": null}, {"id": "VC14-3", "theme_id": "t14", "name": "Nyomás alatt", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Hármas csoportokban szerepjátékkal gyakoroljuk, hogyan lehet ellenállni a csoportnyomásnak.", "tools": "szerepkártyák (a táblára is írhatod)", "keywords": "kortárs nyomás, csoportnyomás, szerepjáték, nemet mondás, döntés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Hármas csoportok: aki nyomást gyakorol, akire nyomás nehezedik, és egy megfigyelő.\n2. Kitalált helyzetek: lógjunk el az óráról; küldd tovább a képet; gyere el a buliba, a szüleidnek nem kell tudnia; próbálj ki valamit, amit nem akarsz.\n3. Háromperces jeleneteket játszanak. A megfigyelő feljegyzi, mi segített a nemet mondásban, és mi tette nehezebbé.\n4. Három kört játszanak, így mindenki minden szerepet kipróbál.\n5. Közös megbeszélés: melyik mondat vagy viselkedés működött a legjobban?", "caution": "A nyomást gyakorló szerep után mindenki „rázza le” a szerepet: mondja ki a nevét, és azt, hogy ő valójában nem ilyen. Ne kérj saját történeteket, és figyelj arra, hogy senki ne kapja mindig ugyanazt a szerepet.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC14-4", "theme_id": "t14", "name": "Mi tart vissza a nemtől?", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "9", "description": "Közösen összegyűjtjük, miért nehéz nemet mondani, és mi segít, aztán arról is beszélünk, mikor hat ránk jól a csoport.", "tools": "csomagolópapír, filcek", "keywords": "kortárs nyomás, félelem, kimaradás, pozitív csoporthatás, támogatás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Egy csomagolópapír bal oldalára gyűjtsétek: miért nehéz nemet mondani? (Kimaradok, cikinek tartanak, megbántom, nem lesznek a barátaim.)\n2. A jobb oldalra: mi segít? (Egy barát, aki szintén nemet mond; előre kitalált mondat; tudom, mit akarok.)\n3. Fordítsd meg a kérdést: mikor volt jó hatással rátok a csoport (sportolni kezdtél, elkezdtél tanulni)?\n4. Zárás: a nyomás nem mindig rossz, de a döntés a tiéd.", "caution": "Ha a beszélgetés szerhasználat felé fordul, maradj tárgyilagos, ne ijesztgess. Ha valaki konkrét veszélyről beszél, beszélj vele utána négyszemközt.", "variants": null}, {"id": "VC14-5", "theme_id": "t14", "name": "Az én mondatom", "type": "Lezárás", "type_order": 5, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki megfogalmaz egy saját nemet mondó mondatot, amit használni fog.", "tools": "cetlik, toll", "keywords": "lezárás, nemet mondás, saját mondat, asszertivitás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki felír egy cetlire egy mondatot, amivel a saját stílusában nemet tud mondani.\n2. Aki akarja, felolvassa. A cetlit hazaviszik.", "caution": "Ne értékeld a mondatokat. Mondd el, hogy egy előre kitalált mondat a valódi helyzetben sokat segít.", "variants": null}, {"id": "VC15-1", "theme_id": "t15", "name": "Stresszhőmérő", "type": "Ráhangolódás", "type_order": 1, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki beáll a padlón lévő 1–10-es skálára: mennyire feszült most a tanulás és a vizsgák miatt?", "tools": "szabad tér", "keywords": "stressz, vizsga, érettségi, hangulat, önmegfigyelés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Jelölj ki a padlón egy 1–10-es skálát.\n2. Mindenki odaáll, amennyire most feszült a tanulás, a dolgozatok vagy a vizsgák miatt.\n3. Aki akar, egy szóban elmondja, mi okozza a legnagyobb terhet.", "caution": "Ne kommentáld a számokat. Ha valaki nagyon magasra áll, ne a csoport előtt kérdezz rá: keresd meg utána.", "variants": null}, {"id": "VC15-2", "theme_id": "t15", "name": "Gyors levezető technikák", "type": "Bemelegítő játék", "type_order": 2, "minutes": 15, "depth": "Könnyű", "grade": "5–12", "description": "Kipróbálunk három rövid technikát, amely vizsga előtt is segít lenyugodni.", "tools": null, "keywords": "stresszkezelés, légzés, izomlazítás, 5-4-3-2-1, vizsgadrukk", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. 5-4-3-2-1: nevezz meg 5 dolgot, amit látsz, 4-et, amit hallasz, 3-at, amit érzel a bőrödön, 2-t, amit szagolsz, 1-et, amit ízlelsz.\n2. Rövid izomlazítás: szorítsd ökölbe a kezed, húzd fel a vállad, feszítsd meg a lábad 5 másodpercig, aztán engedd el.\n3. Dobozlégzés: négy másodpercig belélegzel, négyig benntartod, négyig kifújod, és négyig szünetet tartasz. Három kört csináltok.\n4. Mindenki kiválasztja a kedvencét, és megbeszélitek, hol tudná használni (vizsga előtt, elalvás előtt).", "caution": "Aki nem akarja becsukni a szemét, ne kelljen. Mondd el, hogy ezek a technikák gyakorlással működnek igazán.", "variants": null}, {"id": "VC15-3", "theme_id": "t15", "name": "Az időm térképe", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Egyénileg felrajzoljuk egy átlagos hetünket, párban megkeressük a tartalékokat, és vázolunk egy reális tanulási tervet.", "tools": "papír, színes ceruzák", "keywords": "időbeosztás, tanulási terv, érettségi, pihenés, alvás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki felrajzol egy hét napos rácsot, és színekkel jelöli egy átlagos hetét: iskola, tanulás, munka vagy edzés, alvás, pihenés, képernyő.\n2. Párban megnézik: hol van tartalék? Mi hiányzik (alvás, mozgás, barátok)?\n3. Mindenki felvázol egy reális heti tanulási ritmust a következő hónapra, benne pihenéssel.\n4. Közös kör: mi volt a legnagyobb felismerés?", "caution": "Ne versenyeztesd, ki tanul többet. Mondd el, hogy a pihenés és az alvás is a felkészülés része.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC15-4", "theme_id": "t15", "name": "Gondolatcsapdák a vizsga előtt", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "11", "description": "Tipikus szorongató gondolatokhoz reálisabb gondolatokat keresünk, és megbeszéljük, kihez lehet fordulni.", "tools": "cetlik vagy kártyák", "keywords": "szorongás, gondolatcsapda, átkeretezés, vizsgadrukk, segítségkérés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Írj kártyákra tipikus gondolatokat: „Ha ez nem sikerül, vége mindennek.” „Mindenki jobban tud nálam.” „Már késő elkezdeni.”\n2. Minden kiscsoport kap két kártyát. Írjanak mellé egy reálisabb, de igaz gondolatot („Ha nem sikerül, lesz pótlehetőség, és ettől még nem vagyok kevesebb.”).\n3. A csoportok felolvassák a párokat.\n4. Közösen összegyűjtitek, kihez lehet fordulni, ha túl sok a teher: barát, család, osztályfőnök, iskolapszichológus.", "caution": "Ha valakinél tartós szorongás, alvászavar vagy kimerültség jelét látod, beszélj vele négyszemközt, és ajánld az iskolapszichológust. Senkitől ne várd el, hogy „pozitívan gondolkodjon”: a cél az, hogy reálisabban lássa a helyzetét.", "variants": null}, {"id": "VC15-5", "theme_id": "t15", "name": "Egy pihenés a naptáramban", "type": "Lezárás", "type_order": 5, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki beír a naptárába egy konkrét pihenést a következő hétre.", "tools": null, "keywords": "lezárás, pihenés, öngondoskodás, terv", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki kiválaszt egy pihenést a következő hétre (séta, edzés, egy este tanulás nélkül), és beírja a naptárába, időponttal.\n2. Körben elmondják, mi lesz az.", "caution": "Vedd komolyan ezt a lépést: a pihenést ugyanúgy be kell tervezni, mint a tanulást.", "variants": null}, {"id": "VC16-1", "theme_id": "t16", "name": "Öt év múlva egy szóval", "type": "Ráhangolódás", "type_order": 1, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki egy szóval elmondja, hol vagy milyen szeretne lenni öt év múlva.", "tools": null, "keywords": "jövő, célok, pályaválasztás, ráhangolódás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Körben mindenki egy szót mond: „Öt év múlva szeretnék…” (szabad, külföldön, nyugodt, mérnök, boldog).\n2. Ha akar, egy mondattal kiegészíti.", "caution": "Bizonytalanság is lehet válasz („fogalmam sincs”): mondd el, hogy ez teljesen rendben van ebben a korban.", "variants": null}, {"id": "VC16-2", "theme_id": "t16", "name": "Kinek a hangja?", "type": "Bemelegítő játék", "type_order": 2, "minutes": 15, "depth": "Könnyű", "grade": "5–12", "description": "Összegyűjtjük, kik mondanak véleményt a jövőnkről, és mennyire hangosan szólnak a fejünkben.", "tools": "cetlik, toll", "keywords": "elvárások, szülők, döntés, befolyás, önismeret", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki cetlikre írja, kik mondanak véleményt a jövőjéről: szülő, tanár, barát, testvér, közösségi média, én magam.\n2. Egy papírra rajzolt „hangerőskálán” elhelyezik a cetliket: kinek a hangja a leghangosabb most?\n3. Párban megbeszélik: hol van a saját hangod? Szeretnéd, hogy máshol legyen?", "caution": "A szülői elvárás érzékeny téma lehet. Ne kérd, hogy a cetliket megmutassák a csoportnak, és ne ítéld meg senki családját.", "variants": null}, {"id": "VC16-3", "theme_id": "t16", "name": "Döntési mátrix", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Egy valós vagy kitalált döntést szempontok szerint pontozunk táblázatban, majd megbeszéljük, mit nem mutat meg a táblázat.", "tools": "papír, toll", "keywords": "döntéshozás, pályaválasztás, továbbtanulás, szempontok, mérlegelés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki választ egy döntést: egy saját, aktuálisat (melyik egyetem, gap year, munka) vagy egy kitaláltat.\n2. Készítsenek táblázatot: a sorokba 2–3 lehetőséget írnak, az oszlopokba 4–5 szempontot (érdeklődés, kereseti lehetőség, távolság, költség, kik lesznek ott).\n3. A szempontokat 1–3-ig súlyozzák, a lehetőségeket 1–5-ig pontozzák, majd összeszorozzák és összeadják.\n4. Párban megbeszélik: meglepte-e az eredmény? Mit mond a megérzésed? Mit nem mutat a táblázat?", "caution": "A táblázat csak segít gondolkodni, nem dönt helyettük. Ha valaki nagy nyomás alatt van a döntése miatt, ne a csoport előtt elemezzétek: ajánld fel, hogy beszéltek róla, vagy javasold neki a pályaorientációs tanácsadót.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC16-4", "theme_id": "t16", "name": "Ha nem úgy alakul", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Mély", "grade": "11", "description": "Kerülőutak és B-tervek: mit tehetek, ha nem sikerül az első választásom?", "tools": "papír, toll", "keywords": "B-terv, kudarc, bizonytalanság, rugalmasság, pályaválasztás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mesélj röviden 2–3 valós kerülőútról (a sajátodról vagy ismert emberekéről): nem vették fel elsőre, pályát váltott, később talált rá a hivatására.\n2. Kiscsoportban gyűjtsenek: milyen B-tervek lehetnek, ha nem jön össze az első választás? (Másik szak, pótfelvételi, egy év munka, külföld.)\n3. Egyénileg mindenki felvázolja a saját B-tervét két mondatban.\n4. Közös kör: hogyan lehet együtt élni a bizonytalansággal?", "caution": "Ezt a gyakorlatot ne közvetlenül felvételi eredmények után tartsd, mert ott friss lehet a csalódás. Mondd ki, hogy a kerülőút nem kudarc.", "variants": null}, {"id": "VC16-5", "theme_id": "t16", "name": "Egy kérdés, amit felteszek", "type": "Lezárás", "type_order": 5, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki eldönti, kitől és mit kérdez meg a következő héten a jövőjével kapcsolatban.", "tools": null, "keywords": "lezárás, információgyűjtés, pályaválasztás, apró lépés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki megfogalmaz egy kérdést, és azt, hogy kitől kérdezi meg a héten: egy idősebb diáktól vagy egyetemistától, egy szakembertől, a családjától, a pályaorientációs tanácsadótól.\n2. Körben elmondják.", "caution": "Ha valaki nem tud kit kérdezni, segíts kapcsolatot találni (volt diákok, iskolai pályaorientáció).", "variants": null}, {"id": "VC17-1", "theme_id": "t17", "name": "Egy tárgy az iskolai évekből", "type": "Ráhangolódás", "type_order": 1, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Mindenki hoz vagy felidéz egy tárgyat, ami egy iskolai emlékhez kötődik.", "tools": "a diákok által hozott tárgyak", "keywords": "búcsú, emlékek, ballagás, iskolai évek", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Az előző alkalommal kérd meg őket, hogy hozzanak egy tárgyat, ami egy iskolai emlékhez kötődik (jegyzetfüzet, kirándulásos fotó, belépőkártya).\n2. Körben mindenki megmutatja, és egy-két mondatban elmondja az emléket.\n3. Aki nem hozott semmit, egy tárgyat is felidézhet.", "caution": "Kezdd te egy saját tárgyaddal, ez oldja a hangulatot. Ha valakinek nehéz volt az iskolai időszak, annak is elég egy semleges emlék.", "variants": null}, {"id": "VC17-2", "theme_id": "t17", "name": "Akkor és most", "type": "Bemelegítő játék", "type_order": 2, "minutes": 15, "depth": "Könnyű", "grade": "5–12", "description": "Párban összevetjük, mit gondoltunk magunkról az iskola elején, és mit gondolunk most.", "tools": null, "keywords": "változás, fejlődés, önismeret, visszatekintés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Párban mindenki elmondja: milyen voltam, amikor ide kerültem (mitől féltem, mit szerettem, mi volt fontos)? És milyen vagyok most?\n2. A pár egy mondatban visszamondja, milyen változást hallott.\n3. Közös kör: aki akarja, elmondja a társa változását (az ő engedélyével).", "caution": "Ha a csoport tagjai közül valaki később érkezett, ő a saját érkezésétől mesélhet.", "variants": null}, {"id": "VC17-3", "theme_id": "t17", "name": "Az osztály idővonala", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "12", "description": "Közösen elkészítjük a gimnáziumi évek idővonalát a falon: vicces, nehéz és büszke pillanatokkal.", "tools": "csomagolópapír, háromféle színű cetli, filcek", "keywords": "idővonal, emlékek, osztályközösség, búcsú, hála", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Ragassz a falra egy hosszú csomagolópapírt, és jelöld rajta az éveket.\n2. Háromféle színű cetlit használtok: egyet a vicces, egyet a nehéz, egyet pedig a büszke pillanatokra.\n3. Mindenki legalább három cetlit ír, és felragasztja a megfelelő évhez.\n4. Végigsétáltok az idővonalon, és beszélgettek: melyik volt a legfontosabb év? Mi tartotta össze az osztályt a nehéz pillanatokban?\n5. Az idővonalat lefotózod, és elküldöd nekik.", "caution": "A nehéz pillanatoknál figyelj arra, hogy senkit ne lehessen név szerint azonosítani, ha ő nem akarja. Ne maradjatok a nehéz pillanatoknál: a beszélgetés végén menjetek a büszke pillanatokra.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC17-4", "theme_id": "t17", "name": "Levél a jövőbeli önmagamnak", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Mély", "grade": "12", "description": "Mindenki levelet ír önmagának, amit öt év múlva nyit fel.", "tools": "papír, boríték, toll", "keywords": "levél, jövő, önreflexió, búcsú, célok", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Adj szempontokat a táblára: mi most a legfontosabb neked? Mitől félsz? Mit remélsz? Mit ne felejts el ebből az időszakból?\n2. 15 percig mindenki csendben ír, közben halkan szólhat zene.\n3. A levelet borítékba zárják, ráírják: „Felbontható: 20__.”\n4. Mindenki hazaviszi a sajátját.", "caution": "A levelet senkinek nem kell megmutatni, és te sem olvasod el. Ha valaki nem tud írni, rajzolhat vagy írhat listát is.", "variants": null}, {"id": "VC17-5", "theme_id": "t17", "name": "Egy mondat a csoportnak", "type": "Lezárás", "type_order": 5, "minutes": 5, "depth": "Könnyű", "grade": "5–12", "description": "Záró kör: mindenki egy mondatot mond a csoportnak, köszönetként vagy útravalóként.", "tools": null, "keywords": "lezárás, búcsú, köszönet, útravaló", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Álljatok körbe. Mindenki egy mondatot mond a csoportnak: köszönet, emlék vagy útravaló.\n2. Végül te zárd a kört a saját mondatoddal.", "caution": "Ez az utolsó alkalom lehet: hagyj rá időt, és ne siettesd. Mondd el, hogy aki szeretne, a ballagás után is megkereshet.", "variants": null}, {"id": "VC01-6", "theme_id": "t01", "name": "Csoportzászló", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "7", "description": "Kiscsoportok közös zászlót terveznek: mi köt össze minket, és milyen egy jó csoport.", "tools": "csomagolópapír vagy A3-as lap, színes filcek", "keywords": "ismerkedés, csoportépítés, közös vonások, rajz, összetartozás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Alakítsatok 4–5 fős kiscsoportokat. Minden csoport kap egy nagy lapot, amelyet négy mezőre osztanak.\n2. A mezőkbe rajzolnak vagy írnak: ami mindannyiunkra igaz; amit szeretünk csinálni; egy állat, ami a csoportunkat jelképezi; egy szabály, ami szerintünk fontos.\n3. Közös nevet és jelmondatot is kitalálnak.\n4. A csoportok 2 percben bemutatják a zászlójukat, a zászlókat kitesszük a falra.", "caution": "Figyelj arra, hogy mindenki keze nyoma rajta legyen a zászlón, ne egy-két ember rajzolja meg. A szabály-mezők jó alapot adnak a csoportszerződéshez.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC01-7", "theme_id": "t01", "name": "Melyik szabály kell ide?", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Könnyű", "grade": "7", "description": "Hétköznapi helyzetekhez párosítjuk a csoportszabályokat: mikor mire van szükség?", "tools": "helyzetkártyák (a táblára is írhatod)", "keywords": "csoportszabályok, helyzetek, biztonságos tér, megállapodás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Olvass fel helyzeteket: valaki nevet, amikor más beszél; valaki nem akar megszólalni; valaki elmondja kint, amit itt hallott; mindenki egyszerre beszél.\n2. Párban eldöntik: melyik szabály segítene itt? Ha nincs ilyen, milyen szabályt javasolnának?\n3. Közösen összegyűjtitek a javaslatokat, és kiegészítitek velük a csoportszerződést vagy a szabályplakátot.", "caution": "A helyzetek legyenek általánosak, ne a csoportban történt esetekre utaljanak. A passzolás jogát külön is mondd ki.", "variants": null}, {"id": "VC01-8", "theme_id": "t01", "name": "Interjú párban", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "9", "description": "Párban interjút készítünk egymással, majd mindenki bemutatja a társát a csoportnak.", "tools": "papír, toll", "keywords": "ismerkedés, interjú, bemutatkozás, figyelem, új csoport", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Alakítsatok párokat, lehetőleg olyanokból, akik még kevésbé ismerik egymást.\n2. Közös kérdéssor a táblán: Mivel töltöd szívesen a szabadidődet? Mire vagy büszke? Mi az, amit kevesen tudnak rólad? Mit vársz ettől az évtől?\n3. Először az egyik kérdez öt percig, és jegyzetel, aztán a másik.\n4. Körben mindenki 1 percben bemutatja a társát. Akit bemutattak, kiegészítheti vagy kijavíthatja.", "caution": "Mondd el előre, hogy csak azt adják tovább, amibe a társuk beleegyezett. A „kevesen tudják rólad” kérdésre nem kötelező válaszolni.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC01-9", "theme_id": "t01", "name": "Mitől biztonságos egy csoport?", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "9", "description": "Névtelen skálákkal felmérjük, mennyire érzi magát biztonságban a csoport, és közösen megkeressük, mi segítene.", "tools": "cetlik, toll, egy doboz", "keywords": "pszichológiai biztonság, bizalom, csoportnorma, névtelen visszajelzés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki névtelenül, 1–5-ig pontoz három állítást egy cetlin: „Itt merek hibázni.” „Itt merek mást gondolni, mint a többség.” „Ha baj van, itt tudok segítséget kérni.”\n2. A cetliket összegyűjtöd egy dobozba, és felírod a táblára az eredményt.\n3. Közös beszélgetés: Mi kellene ahhoz, hogy ezek a számok magasabbak legyenek? Mit tehet ehhez mindenki, és mit tehetsz te?\n4. A 2–3 legfontosabb javaslatot hozzáírjátok a szabályokhoz.", "caution": "Ne próbáld kitalálni, ki adott alacsony pontot. Ha nagyon alacsonyak a számok, vedd komolyan, és kérdezd meg az osztályfőnököt is, mi zajlik a csoportban.", "variants": null}, {"id": "VC01-10", "theme_id": "t01", "name": "Mit hozok, mit kérek?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Mindenki megfogalmazza, mit ad a csoportnak, és mit kér tőle, a végén pedig közös plakátot készítünk.", "tools": "cetlik két színben, csomagolópapír", "keywords": "elvárások, hozzájárulás, csoportkultúra, felelősség, tapasztalt csoport", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki kétféle színű cetlit kap: az egyikre azt írja, mit hoz a csoportba (humor, türelem, ötletek, rendszerezés), a másikra azt, mit kér a csoporttól (őszinteség, pontosság, hogy ne bántsák egymást).\n2. A cetliket egy kétoszlopos plakátra ragasztják.\n3. Közösen megnézitek: mit hozunk sokan? Mit kérünk sokan? Van-e olyan kérés, amire nincs „hozó”?\n4. Megállapodtok 2–3 dologban, amire ebben az évben különösen figyeltek.", "caution": "Egy régóta együtt lévő csoportnak ez több újdonságot hoz, mint ha megint szabályokat írnának. Ha egy kérés valakire utal („ne késsen mindig X”), fogalmazd át általánossá.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC01-11", "theme_id": "t01", "name": "Mi működött eddig?", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "11", "description": "Az eddigi évek alapján megbeszéljük, mi segítette és mi nehezítette a csoport működését, és ehhez igazítjuk a szabályokat.", "tools": "a korábbi csoportszerződés (ha van), filcek", "keywords": "visszatekintés, csoportszerződés, felülvizsgálat, csoportfejlődés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Ha van korábbi csoportszerződés, tedd ki. Ha nincs, gyűjtsétek össze a kimondatlan szabályokat.\n2. Kiscsoportban három kérdésre válaszolnak: Mi működött jól az eddigi években? Mi nem működött? Mit vinnénk tovább, és mit hagynánk el?\n3. Közös egyeztetés után átírjátok vagy megerősítitek a szabályokat.\n4. Mindenki aláírja az új változatot.", "caution": "Ne hánytorgassátok fel a régi sérelmeket. Ha egy régi konfliktus előjön, jegyezd fel, és beszéljétek meg külön.", "variants": null}, {"id": "VC02-6", "theme_id": "t02", "name": "Érzelemdetektívek", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "7", "description": "Képeken szereplő arcok és testtartások alapján kitaláljuk az érzelmeket, és megnevezzük, mi árulta el őket.", "tools": "kivetítő (10 fotó a vetíthető diák között) vagy saját képek, papír", "keywords": "érzelmek felismerése, arckifejezés, testbeszéd, megfigyelés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Vetítsd ki a 10 fotót (📽 Kivetítés), vagy válassz saját képeket emberekről különböző érzelmekkel.\n2. Kiscsoportok „detektívként” dolgoznak: minden kép számához felírják, milyen érzelmet látnak, és milyen nyomok árulják el (szem, száj, váll, kéz, helyzet).\n3. Közösen összevetitek a tippeket, majd megmutatod a megoldást. Ahol eltérnek, beszéljétek meg, miért.\n4. Zárás: mi a legbiztosabb jel egy érzelemre, és mikor tévedhetünk?", "caution": "Kerüld az osztálytársakról vagy ismert diákokról készült képeket. Mondd ki, hogy az arc nem mindig mutatja, amit valaki érez.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC02-7", "theme_id": "t02", "name": "Érzelemhőmérő", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Könnyű", "grade": "7", "description": "Egy-egy érzelem különböző erősségeit sorba rendezzük, hogy pontosabban meg tudjuk nevezni, mit érzünk.", "tools": "cetlik, toll", "keywords": "érzelmi szókincs, intenzitás, skála, árnyalatok", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Írj fel egy alapérzelmet a táblára, például düh.\n2. Kiscsoportok szavakat gyűjtenek az erősségeire: bosszús, ingerült, mérges, dühös, tomboló.\n3. A szavakat egy hőmérőszerű skálán sorba rendezik, a leggyengébbtől a legerősebbig.\n4. Ugyanezt megcsinálják a félelemmel vagy az örömmel is.\n5. Zárás: melyik fokon tudsz még jól dönteni, és melyiken már nehéz?", "caution": "Nincs egyetlen helyes sorrend: ha vita van, az jó beszélgetés. Érdemes összekötni az érzelemszabályozás témájával.", "variants": null}, {"id": "VC02-8", "theme_id": "t02", "name": "Érzelmek egy jelenetben", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Egy rövid film- vagy sorozatjelenetben követjük a szereplők érzelmeit, és idővonalon ábrázoljuk a változásukat.", "tools": "kivetítő, egy 3–5 perces jelenet, papír", "keywords": "érzelmek felismerése, film, szereplők, érzelmi változás, empátia", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Válassz egy 3–5 perces jelenetet, amelyben a szereplők érzelmei változnak (veszekedés és kibékülés, rossz hír, meglepetés).\n2. Először csak megnézik a jelenetet.\n3. Kiscsoportonként egy-egy szereplőt követnek, és idővonalra rajzolják, milyen érzelmeket élt át, és mikor váltott.\n4. A második nézés után kiegészítik. A csoportok bemutatják az idővonalukat.\n5. Beszélgetés: mi okozta a váltásokat? Mit nem mondott ki a szereplő, de látszott rajta?", "caution": "Ellenőrizd a jelenet korhatárát és tartalmát. Kerüld a túl megrázó jeleneteket.  👥 Nagy létszámnál is működik az egész osztállyal; a megbeszélésnél csak néhányan szóljanak, mindig mások.", "variants": null}, {"id": "VC02-9", "theme_id": "t02", "name": "Vegyes érzelmek", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "9", "description": "Olyan helyzeteket keresünk, amelyekben egyszerre két ellentétes érzés van jelen, és saját példákat is megosztunk.", "tools": "papír, toll", "keywords": "vegyes érzelmek, kevert érzések, ambivalencia, érzelmi összetettség, önismeret", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mondj példákat: költözés (izgalom és szomorúság), egy jó jegy, amit a barátod nem kapott meg (öröm és bűntudat), ballagás.\n2. Párban mindenki keres egy saját helyzetet, amikor egyszerre két ellentétes érzést élt át.\n3. Aki akarja, elmondja a csoportnak.\n4. Zárás: miért fontos tudni, hogy két érzés megfér egymás mellett?", "caution": "Elég, ha az érzéseket nevezik meg, a helyzet részleteit nem kell elmondani.", "variants": null}, {"id": "VC02-10", "theme_id": "t02", "name": "Mit üzen az érzés?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Kiscsoportban feltárjuk, milyen üzenete és milyen haszna van egy-egy érzelemnek, akár a kellemetlennek is.", "tools": "csomagolópapír, filcek", "keywords": "érzelmek funkciója, szükségletek, düh, félelem, szomorúság, érzelmi intelligencia", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Minden kiscsoport kap egy érzelmet: félelmet, dühöt, szomorúságot, szégyent, irigységet vagy örömöt.\n2. A plakátra három kérdésre válaszolnak: Mire figyelmeztet ez az érzés? Milyen szükségletre utal? Mikor segít, és mikor árt?\n3. A csoportok bemutatják a plakátjaikat.\n4. Közös beszélgetés: van-e „rossz” érzelem, vagy csak rossz reakció?", "caution": "A cél nem az, hogy a kellemetlen érzéseket szépítsük, hanem hogy megértsük őket. Ha valaki a saját életéről kezd beszélni, köszönd meg, de a csoport előtt ne menjetek bele mélyebben.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC02-11", "theme_id": "t02", "name": "Észreveszem, ha baj van", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "11", "description": "Összegyűjtjük, milyen jelekből vehetjük észre, ha egy barátunk rosszul van, és mit mondhatunk neki.", "tools": "papír, toll", "keywords": "jelzések, barát, segítség, figyelem, mentális egészség", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kiscsoportban gyűjtsenek jeleket: visszahúzódik, nem válaszol, ingerlékeny, máshogy eszik vagy alszik, sokat hiányzik.\n2. Mindegyik csoport felír 3 mondatot, amivel meg lehet szólítani a barátot („Feltűnt, hogy mostanában csendesebb vagy. Hogy vagy?”).\n3. Közösen összegyűjtitek, mikor kell felnőttnek is szólni.\n4. Mondd el, kihez lehet fordulni az iskolában.", "caution": "Mondd ki egyértelműen: ha valaki önmaga bántására utal, azt nem kell titokban tartani, ilyenkor felnőttnek kell szólni. Add meg az iskolapszichológus elérhetőségét.", "variants": null}, {"id": "VC03-6", "theme_id": "t03", "name": "A tűzhányó", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "7", "description": "Tűzhányóként rajzoljuk le a dühöt: mi fűti, mik a figyelmeztető jelek, és mit tehetünk a kitörés előtt.", "tools": "A4-es lapok, színes ceruzák", "keywords": "düh, dühkezelés, figyelmeztető jelek, rajz, önszabályozás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki rajzol egy tűzhányót.\n2. A tűzhányó aljára (a magmába) írják, mi szokta felhúzni őket.\n3. A tűzhányó oldalára azt írják, milyen jelekből veszik észre, hogy közeleg a „kitörés” (meleg arc, ökölbe szorított kéz, hangos hang).\n4. A tetejére, a füst helyére azt, mit tehetnek, mielőtt kitörne (kimegyek, számolok, légzés, szólok valakinek).\n5. Párban megmutatják, amit szeretnének.", "caution": "A „mi húz fel” részt nem kell megosztani. Ha valaki konkrét személyt ír, ne kommentáld a csoport előtt.  👥 Nagy létszámnál is működik az egész osztállyal; a megbeszélésnél csak néhányan szóljanak, mindig mások.", "variants": null}, {"id": "VC03-7", "theme_id": "t03", "name": "Nyugtató zsebkártya", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Könnyű", "grade": "7", "description": "Mindenki elkészíti a saját kis kártyáját három nyugtató technikával, amit magánál tarthat.", "tools": "kartonlapok (névjegykártya-méretben), filcek", "keywords": "önszabályozás, nyugtató technikák, emlékeztető, öngondoskodás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Ismételjétek át a tanult technikákat (dobozlégzés, 5-4-3-2-1, számolás, séta, víz).\n2. Mindenki kiválaszt hármat, ami neki működik, és felírja vagy lerajzolja egy kis kártyára.\n3. A kártya hátuljára egy embert írnak, akihez fordulhatnak.\n4. Párban kipróbálják az egyik technikát a kártyájukról.", "caution": "A kártya legyen kicsi, hogy beférjen a tolltartóba. A következő alkalmon kérdezz rá, használta-e valaki.", "variants": null}, {"id": "VC03-8", "theme_id": "t03", "name": "Gondolat, érzés, tett", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Helyzeteken keresztül megvizsgáljuk, hogyan hat a gondolatunk az érzéseinkre és a viselkedésünkre, és hogyan változtathatunk rajta.", "tools": "papír, toll", "keywords": "kognitív modell, gondolatok, átkeretezés, érzelmek, viselkedés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Rajzold fel a táblára a láncot: helyzet → gondolat → érzés → tett.\n2. Példa: „A barátom nem köszönt vissza a folyosón.” Gondolat: „Haragszik rám.” Érzés: szorongás. Tett: kerülöm őt.\n3. Párban ugyanehhez a helyzethez keresnek két másik gondolatot („Nem vett észre.”), és megnézik, hogyan változik az érzés és a tett.\n4. Minden pár kap még egy helyzetet, és végigviszi a láncot.\n5. Közös kör: melyik átírt gondolat volt a leghasznosabb?", "caution": "Mondd el, hogy nem az a cél, hogy „pozitívan gondolkodjanak”, hanem hogy észrevegyék: egy helyzetnek több magyarázata is lehet.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC03-9", "theme_id": "t03", "name": "A saját vészfékem", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "9", "description": "Mindenki összeírja a saját korai figyelmeztető jeleit, és tervet készít arra, mikor és hogyan húzza meg a vészféket.", "tools": "papír, toll", "keywords": "stresszjelek, megelőzés, önismeret, szünet, önszabályozás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki három oszlopot rajzol: testi jelek (fáj a fejem, gyors a szívverésem), gondolatok („mindjárt felrobbanok”), viselkedés (csapkodok, elhallgatok).\n2. Mindenki bekarikázza azt a jelet, amelyik a legkorábban jön.\n3. Megírják a vészfék-tervet: „Ha ezt észreveszem, akkor …”.\n4. Párban megosztják, amit szeretnének.", "caution": "A terv legyen egészen konkrét és megvalósítható az iskolában is (kimehetek-e az óráról, kinek szólhatok).", "variants": null}, {"id": "VC03-10", "theme_id": "t03", "name": "Ahogy egy barátommal beszélnék", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "11", "description": "Összehasonlítjuk, hogyan beszélünk magunkkal egy kudarc után, és hogyan beszélnénk egy barátunkkal ugyanabban a helyzetben.", "tools": "papír, toll", "keywords": "önegyüttérzés, belső hang, kudarc, önkritika, mentális egészség", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki felidéz egy kisebb kudarcot (rossz jegy, elrontott beszélgetés). Nem kell megosztani.\n2. Egy lap bal oldalára leírják, mit mondanak ilyenkor magukban.\n3. A jobb oldalra azt, mit mondanának egy barátjuknak ugyanebben a helyzetben.\n4. Összevetik a kettőt: mi a különbség a hangnemben?\n5. Végül írnak magukhoz néhány mondatot úgy, ahogy egy barátjukhoz írnának.\n6. Közös kör: mit vettetek észre? (A leírtakat nem kell felolvasni.)", "caution": "Ez mély gyakorlat lehet. Ha valaki nagyon kemény önkritikáról vagy reménytelenségről ír, keresd meg utána négyszemközt.  👥 Nagy létszámnál is működik az egész osztállyal; a megbeszélésnél csak néhányan szóljanak, mindig mások.", "variants": null}, {"id": "VC03-11", "theme_id": "t03", "name": "Mi segít, mi árt?", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "11", "description": "Táblázatban összevetjük a stresszkezelési szokásainkat: mi segít rövid távon, és mi hosszú távon.", "tools": "papír, toll", "keywords": "megküzdési stratégiák, szokások, stresszkezelés, egészséges szokások", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Közösen gyűjtsetek szokásokat, amiket stresszben csinálunk: görgetés, evés, sport, alvás, zene, beszélgetés, halogatás.\n2. Mindenki táblázatot készít: melyik szokás segít rövid távon, melyik hosszú távon, és melyik árt?\n3. Párban megbeszélik: van-e olyan szokásuk, ami most segít, de később árt?\n4. Mindenki kiválaszt egy segítő szokást, amit erősítene.", "caution": "Ne moralizálj. Ha szerhasználat kerül elő, maradj tárgyilagos, és szükség esetén beszélj négyszemközt.", "variants": null}, {"id": "VC04-6", "theme_id": "t04", "name": "Én-pizza", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "7", "description": "Mindenki lerajzolja magát pizzaként: a szeletekre azt írja, ami fontos neki, és ami jellemzi.", "tools": "A4-es lapok, színes ceruzák", "keywords": "önismeret, önbemutatás, rajz, érdeklődés, erősségek", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki rajzol egy kört, és 6 szeletre osztja.\n2. A szeletekbe írnak vagy rajzolnak: amit szeretek csinálni; akik fontosak nekem; amiben jó vagyok; amit szeretnék megtanulni; egy álmom; ami boldoggá tesz.\n3. Párban bemutatják egymásnak a pizzájukat.\n4. Közös kör: mi volt a legnehezebb szelet?", "caution": "Aki nem szeret rajzolni, írhat is. A „fontos emberek” szeletnél figyelj arra, hogy ne kelljen családról beszélni annak, aki nem akar.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC04-7", "theme_id": "t04", "name": "Amit mások látnak bennem", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Könnyű", "grade": "7", "description": "A pizzákat körbeadjuk, és a többiek egy-egy erősséget írnak rá, amit látnak a társukban.", "tools": "az előző gyakorlat pizzái, filcek", "keywords": "erősségek, pozitív visszajelzés, önbecsülés, osztályközösség", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. A pizzák hátulját körbeadjátok, vagy kiteszitek az asztalokra.\n2. Mindenki legalább három társa lapjára ír egy erősséget, amit benne lát („segítőkész”, „vicces”, „jól magyaráz”).\n3. Mindenki visszakapja a sajátját, és elolvassa.\n4. Közös kör: mi lepett meg? Mi esett jól?", "caution": "Előre mondd ki: csak kedves, konkrét dolgot lehet írni. Nézd át a lapokat, és figyelj arra, hogy mindenki lapjára írjanak valamit.", "variants": null}, {"id": "VC04-8", "theme_id": "t04", "name": "Értékárverés", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Fiktív pénzzel licitálunk értékekre, és megnézzük, mire mennyit szánnánk.", "tools": "értéklista a táblán, papír a licitekhez", "keywords": "értékek, döntés, prioritások, játék, önismeret", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Írj fel 12–15 értéket: barátság, szabadság, siker, egészség, igazságosság, kaland, biztonság, szerelem, hírnév, család, tudás, segíteni másoknak.\n2. Mindenkinek 1000 fiktív forintja van. Előre eldönti, melyik értékre mennyit licitálna.\n3. Tarts árverést: értékenként licitálnak, a legtöbbet ajánló nyer.\n4. Mindenki felírja, mit nyert, és mire szeretett volna még licitálni.", "caution": "Tartsd gyors tempóban az árverést. A „nyerés” csak játék: a lényeg az, amit a következő gyakorlatban megbeszéltek.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC04-9", "theme_id": "t04", "name": "Mit árul el a licitem?", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "9", "description": "Megbeszéljük, mit mutat az árverés arról, mi igazán fontos nekünk, és mennyire élünk eszerint.", "tools": "papír, toll", "keywords": "értékek, reflexió, prioritás, önismeret", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki egyénileg válaszol: Mire szántam a legtöbbet? Miért? Mi maradt ki, ami fontos lett volna?\n2. Párban: Mennyire látszik ez az érték a hétköznapjaimban (mire megy az időm, a pénzem, a figyelmem)?\n3. Közös kör: meglepett-e valakit a saját licitje?", "caution": "Ne értékeld, ki mit tart fontosnak. Az egymástól eltérő értékek is rendben vannak.", "variants": null}, {"id": "VC04-10", "theme_id": "t04", "name": "Életvonal", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "11", "description": "Mindenki megrajzolja a saját életének fontos fordulópontjait, és azt, mit tanult belőlük.", "tools": "A4-es lapok, toll", "keywords": "életút, fordulópontok, reflexió, identitás, fejlődés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki egy vízszintes vonalat rajzol a születésétől máig.\n2. A vonal fölé a jó, alá a nehéz pillanatokat jelöli, ahogy szeretné (szóval vagy jellel).\n3. 3–4 fordulópontnál felírja: mit tanultam ebből magamról?\n4. Párban azt osztják meg, amit szeretnének: a tanulságokról beszéljenek, ne a részletekről.", "caution": "Mondd ki előre, hogy a lapot senkinek nem kell megmutatni. Nehéz életesemények előjöhetnek: figyelj a jelekre, és ajánld fel a négyszemközti beszélgetést.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC04-11", "theme_id": "t04", "name": "Értékeim és a döntéseim", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "11", "description": "Egy közelgő döntést (pl. továbbtanulás) összevetünk a saját értékeinkkel.", "tools": "papír, toll", "keywords": "értékek, döntéshozás, továbbtanulás, jövő", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki felírja 3–5 legfontosabb értékét (a korábbi gyakorlatok alapján).\n2. Mellé felír egy közelgő döntést: továbbtanulás, munka, költözés, kapcsolat.\n3. Értékenként felírja: mit mond ez az érték erről a döntésről?\n4. Párban megbeszélik: van-e olyan érték, ami ütközik egy másikkal? Melyik a fontosabb most?", "caution": "Jól kapcsolódik a „Döntések és jövő” témához. Ha valaki nagy nyomás alatt van, ne a csoport előtt elemezzétek.", "variants": null}, {"id": "VC05-6", "theme_id": "t05", "name": "Rajzold, amit hallasz", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "7", "description": "Párban háttal ülnek egymásnak: az egyik leír egy ábrát, a másik lerajzolja. Közben kiderül, mennyit számít, ha pontosan figyelünk és kérdezünk.", "tools": "egyszerű ábrák kinyomtatva, papír, ceruza", "keywords": "aktív hallgatás, pontos figyelem, kérdezés, kommunikáció, játék", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. A párok háttal ülnek egymásnak.\n2. Az egyik kap egy egyszerű ábrát (néhány mértani forma), és szóban leírja. A másik lerajzolja, de kérdezni nem szabad.\n3. Összehasonlítják az eredeti ábrát és a rajzot.\n4. Új ábrával megismétlik, de most már szabad kérdezni.\n5. Cserélnek szerepet.", "caution": "Az első kör többnyire nevetéssel végződik: hagyd, ez a lényeg. Kérdezd meg, mitől lett jobb a második rajz.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC05-7", "theme_id": "t05", "name": "Mi segít megérteni a másikat?", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Könnyű", "grade": "7", "description": "Összegyűjtjük, mitől lett pontosabb a rajz, és ebből közös „jó hallgató” szabályokat írunk.", "tools": "csomagolópapír, filcek", "keywords": "aktív hallgatás, szabályok, kérdezés, visszajelzés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Közös beszélgetés: Mi volt nehéz, amikor nem lehetett kérdezni? Mi segített, amikor lehetett?\n2. Gyűjtsetek „jó hallgató” szabályokat: rákérdezek; visszamondom; nem szakítom félbe; ránézek.\n3. A szabályokat plakátra írjátok, és kiteszitek a csoportszerződés mellé.", "caution": "Kösd a gyakorlatot a hétköznapokhoz: hol jó ezt használni (órán, otthon, barátokkal)?", "variants": null}, {"id": "VC05-8", "theme_id": "t05", "name": "Tükrözd az érzést", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Gyakoroljuk, hogyan tükrözzük vissza a másik érzését tanácsadás helyett.", "tools": "helyzetkártyák (a táblára is írhatod)", "keywords": "érzéstükrözés, empátia, aktív hallgatás, kommunikáció, támogatás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mutasd meg a különbséget: „Ne foglalkozz vele!” (tanács) és „Úgy hangzik, nagyon csalódott vagy.” (tükrözés).\n2. Párban az egyik felolvas egy rövid mondatot egy kártyáról („Megint én maradtam ki a csapatból.”).\n3. A másik csak tükröz: megnevezi az érzést, amit hall. Tanácsot nem adhat.\n4. A beszélő elmondja, mennyire érezte magát megértve.\n5. 4–5 kártya után cserélnek.", "caution": "Eleinte furcsa lesz, mert megszoktuk, hogy rögtön tanácsot adunk. Mondd el, hogy a tükrözés nem egyetértés, hanem megértés.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC05-9", "theme_id": "t05", "name": "Tanács helyett kérdés", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "9", "description": "Nyitott kérdéseket gyűjtünk, amelyekkel segíthetünk úgy, hogy a másik maga találja meg a megoldást.", "tools": "papír, toll", "keywords": "nyitott kérdések, coaching, támogatás, aktív hallgatás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Magyarázd el a különbséget a zárt („Szólsz neki?”) és a nyitott („Mit szeretnél, mi történjen?”) kérdés között.\n2. Kiscsoportban gyűjtsenek 10 jó nyitott kérdést, amit egy bajban lévő barátnak lehet feltenni.\n3. A csoportok felolvassák, és együtt kiválasztjátok az öt legjobbat.\n4. Párban kipróbálják egy kitalált helyzeten.", "caution": "A „Miért?” kérdés könnyen számonkérőnek hangzik. Javasolj helyette ilyen kérdéseket: „Mi vezetett ide?”", "variants": null}, {"id": "VC05-10", "theme_id": "t05", "name": "Amikor rossz hírt kapsz", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Hármasban gyakoroljuk, hogyan hallgassuk meg azt, aki rossz hírt oszt meg: csenddel, tükrözéssel, nyitott kérdéssel.", "tools": "szerepkártyák", "keywords": "nehéz beszélgetés, aktív hallgatás, támogatás, csend, empátia", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Hármas csoportok: beszélő, hallgató, megfigyelő.\n2. A beszélő egy kitalált nehéz hírt oszt meg (nem vették fel, szakított vele a párja, beteg a nagymamája).\n3. A hallgató gyakorolja: kibírni a csendet, tükrözni az érzést, nyitott kérdést feltenni, nem tanácsot adni.\n4. A megfigyelő feljegyzi, mi segített, és mi nem.\n5. Három kört játszanak, így mindenki minden szerepet kipróbál.", "caution": "Csak kitalált helyzetekkel dolgozzatok. Ha valakit a téma személyesen érint, felajánlhatod, hogy megfigyelő legyen.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC05-11", "theme_id": "t05", "name": "A meghallgatás határai", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Mély", "grade": "11", "description": "Megbeszéljük, mikor tudunk mi magunk segíteni egy barátunknak, és mikor kell felnőtthöz vagy szakemberhez fordulnunk.", "tools": "papír, toll", "keywords": "határok, segítségkérés, felelősség, mentális egészség, továbbirányítás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Közös beszélgetés: Milyen az, amikor egy barátod rád bízza a gondjait? Mi az, ami nehéz benne?\n2. Kiscsoportban gyűjtsék össze: mely helyzetekben elegendő, ha meghallgatjuk a másikat, és mikor van szükség felnőttre vagy szakemberre?\n3. Közösen összegyűjtitek, kihez lehet fordulni (iskolapszichológus, osztályfőnök, lelki elsősegély-vonalak).\n4. Mondd el: a saját határaidra figyelni nem önzés.", "caution": "Mondd ki egyértelműen, hogy ha valaki önmaga vagy más bántására utal, azt nem kell titokban tartani. Add meg az iskolai és az országos segítő elérhetőségeket.", "variants": null}, {"id": "VC06-6", "theme_id": "t06", "name": "Érzések a regényben", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "7", "description": "Egy ismert olvasmány szereplőinek érzéseit követjük, és megkeressük, mi lehetett a viselkedésük mögött.", "tools": "egy közösen ismert olvasmány (pl. A Pál utcai fiúk), csomagolópapír", "keywords": "empátia, nézőpont, irodalom, szereplők, érzelmek", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Válassz egy olvasmányt, amit a csoport ismer (7.-ben például A Pál utcai fiúk).\n2. Minden kiscsoport kap egy szereplőt (Nemecsek, Boka, Geréb, Áts Feri).\n3. A plakátra felírják: Mit érzett a szereplő egy fontos jelenetben? Miért viselkedett úgy, ahogy? Mit nem mondott ki?\n4. A csoportok bemutatják a szereplőjüket, és megbeszélitek: kit értettetek meg jobban?", "caution": "Egyeztess a magyartanárral, mit olvastak már. Ha nincs közös olvasmány, egy rövid mesét vagy filmet is használhatsz.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC06-7", "theme_id": "t06", "name": "Egy kedves tett a szereplőnek", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Könnyű", "grade": "7", "description": "Kitaláljuk, mit tehettek volna a többiek, hogy egy szereplő jobban érezze magát, és ezt a saját életünkre is átfordítjuk.", "tools": "papír, toll", "keywords": "empátia, segítség, kedvesség, osztályközösség", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Az előző gyakorlat szereplőihez kiscsoportban kitalálnak egy kedves tettet: mit tehetett volna érte valaki?\n2. Közösen megbeszélitek: mi tartotta vissza a többieket ettől?\n3. Aztán gondoljatok az osztályra: kinek esne jól egy hasonló kedves tett? (Nevek nélkül.)\n4. Mindenki vállal egy kedves tettet a hétre.", "caution": "Nevek nélkül beszéljetek, hogy senkit ne tegyetek ki. A vállalás maradhat titokban is.", "variants": null}, {"id": "VC06-8", "theme_id": "t06", "name": "Négy sarok, négy nézőpont", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Egy konfliktushelyzetet négy szereplő szemszögéből járunk körbe a terem négy sarkában.", "tools": "négy szereplőkártya, szabad tér", "keywords": "nézőpontváltás, empátia, konfliktus, szerepjáték", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Írj le egy kitalált helyzetet: az osztálykirándulás helyszínén vita alakult ki; van, aki nem tud fizetni, van, aki szervezett, van, akinek a szülei aggódnak, és az osztályfőnök is dönteni akar.\n2. A terem négy sarka a négy szereplő. Mindenki odaáll, akinek a szemszögét képviselni akarja.\n3. Minden sarok öt percig arról beszélget: mit érez ez a szereplő, és mire van szüksége?\n4. A sarkok bemutatják a szereplőjüket. Utána mindenki átáll egy másik sarokba, és onnan reagál.\n5. Közös kör: melyik szemszöget volt a legnehezebb megérteni?", "caution": "Az anyagi helyzetet érintő szereplőnél figyelj arra, hogy senki ne érezze magát kipécézve. A helyzet legyen egyértelműen kitalált.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC06-9", "theme_id": "t06", "name": "Ami a víz alatt van", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "9", "description": "A jéghegy-modellel megbeszéljük, mi minden lehet egy viselkedés mögött, amit kívülről nem látunk.", "tools": "tábla, cetlik", "keywords": "empátia, jéghegy, viselkedés mögötti okok, ítélkezésmentesség", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Rajzolj egy jéghegyet a táblára. A víz felett a látható viselkedés: „mindig késik”, „bunkó”, „nem csinálja meg a házit”.\n2. Kiscsoportok cetlikre írják, mi lehet a víz alatt: fáradtság, otthoni gond, szégyen, félelem, munka.\n3. A cetliket felragasztják a víz alá.\n4. Zárás: legközelebb, ha ilyet látsz, mit kérdezhetsz?", "caution": "Ne konkrét osztálytársakról beszéljetek. Mondd ki: megérteni valakit nem jelenti azt, hogy mindent el kell fogadni tőle.", "variants": null}, {"id": "VC06-10", "theme_id": "t06", "name": "A másik oldal", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Vitát rendezünk egy iskolai kérdésről, de mindenki a saját véleményével ellentétes oldalt képviseli.", "tools": "papír, toll", "keywords": "nézőpontváltás, vita, érvelés, empátia, kritikus gondolkodás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Válassz egy nem megosztó iskolai kérdést: legyen-e telefontilalom az órákon; kötelező-e a dresszkód; legyen-e több szabadon választható óra.\n2. Mindenki felírja a saját véleményét, aztán abba a csapatba áll, amelyik az ellenkezőjét képviseli.\n3. A csapatok 10 percben érveket gyűjtenek, majd vitáznak, felváltva szólva.\n4. A végén mindenki elmondja: melyik érv győzött meg legalább egy kicsit?", "caution": "Kerüld a politikailag vagy vallásilag megosztó témákat. A cél a másik nézőpont megértése, nem a győzelem.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC06-11", "theme_id": "t06", "name": "Mit értettem meg?", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "11", "description": "Visszatekintünk a vitára: mit értettünk meg a másik oldalról, és hogyan beszélünk olyanokkal, akik mást gondolnak.", "tools": "papír, toll", "keywords": "empátia, reflexió, véleménykülönbség, párbeszéd", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Egyénileg: Mi volt nehéz a másik oldal képviseletében? Mit értettem meg, amit eddig nem?\n2. Párban: Kivel szoktam olyan kérdésről beszélni, amiben nem értünk egyet? Hogyan szokott ez menni?\n3. Közösen gyűjtsetek szabályokat a jó vitához („nem a személyt bírálom”, „először visszamondom, amit értettem”).", "caution": "Ha a vita során feszültség alakult ki, itt van rá idő, hogy lezárjátok.", "variants": null}, {"id": "VC07-6", "theme_id": "t07", "name": "Zsiráf és sakál", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "7", "description": "Sakálnyelvű (bántó) mondatokat írunk át zsiráfnyelvűre (érzésekről és kérésekről szólóra).", "tools": "mondatkártyák, a zsiráf és a sakál fotója (a vetíthető diák között)", "keywords": "erőszakmentes kommunikáció, zsiráfnyelv, átírás, én-üzenet", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mutasd be a két figurát: a sakál vádol és címkéz („Te mindig…”), a zsiráf (a legnagyobb szívű szárazföldi állat) elmondja, mit érez és mit kér.\n2. Párban kapnak 5–6 sakálmondatot („Hülye vagy, elrontottad!”, „Soha nem figyelsz rám!”).\n3. Átírják zsiráfnyelvre („Bosszús vagyok, mert elromlott. Segítenél megjavítani?”).\n4. Néhány pár felolvassa vagy eljátssza a kettőt.", "caution": "A figuráktól játékos marad a gyakorlat. A sakál-mondatoknál ne használjatok valódi csúnya szavakat.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC07-7", "theme_id": "t07", "name": "Kérés vagy követelés?", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Könnyű", "grade": "7", "description": "Mondatokat válogatunk szét kérésre és követelésre, és megbeszéljük, mitől működik jobban a kérés.", "tools": "mondatcsíkok", "keywords": "kérés, követelés, kommunikáció, udvariasság, erőszakmentes kommunikáció", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Párban mondatcsíkokat válogatnak két csoportba: kérés („Segítenél?”) vagy követelés („Add ide azonnal!”).\n2. A követeléseket átírják kéréssé.\n3. Közös beszélgetés: Mi a különbség? Mi történik, ha valaki nemet mond egy kérésre? És egy követelésre?\n4. Zárás: egy kérés, amit ezen a héten valakinek elmondok.", "caution": "Mondd ki, hogy a kérésre nemet is lehet mondani: éppen ettől kérés, és nem követelés.", "variants": null}, {"id": "VC07-8", "theme_id": "t07", "name": "Mi a szükséglet?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Helyzetekben megkeressük az érzés mögötti szükségletet, szükségletkártyák segítségével.", "tools": "szükségletkártyák (tisztelet, nyugalom, összetartozás, szabadság, biztonság, elismerés stb.)", "keywords": "szükségletek, érzések, erőszakmentes kommunikáció, önismeret", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Tegyél ki 15–20 szükségletkártyát (tisztelet, nyugalom, összetartozás, szabadság, biztonság, elismerés, igazságosság, pihenés).\n2. Olvass fel helyzeteket: „Dühös vagyok, mert a csoportmunkában én csináltam mindent.” „Szomorú vagyok, mert nem hívtak meg.”\n3. Kiscsoportban kiválasztják, milyen szükséglet sérült.\n4. Mindenki keres egy saját helyzetet, és megnevezi a mögötte lévő szükségletet.", "caution": "Egy helyzet mögött több szükséglet is lehet: ez rendben van. A saját helyzetet nem kell megosztani.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC07-9", "theme_id": "t07", "name": "Nemet mondani bántás nélkül", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "9", "description": "Gyakoroljuk, hogyan mondjunk nemet úgy, hogy közben elismerjük a másik szükségletét is.", "tools": "papír, toll", "keywords": "nemet mondás, asszertivitás, erőszakmentes kommunikáció, határok", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Írd fel a mondat vázát: „Látom, hogy neked fontos …, és én most nem tudom/akarom …, mert nekem fontos … Mit szólnál ahhoz, ha …?”\n2. Párban gyakorolják kitalált helyzeteken: a barát a házidat kéri; buliba hívnak, de tanulnod kell.\n3. A társ visszajelez: mennyire érezte magát elutasítva?", "caution": "Jól kapcsolódik a „Kortárs nyomás” témához. Mondd el, hogy a nemet mondás is lehet tiszteletteljes.", "variants": null}, {"id": "VC07-10", "theme_id": "t07", "name": "Egy nehéz üzenet", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Megírunk egy nehéz üzenetet (pl. szülőnek, lakótársnak, tanárnak) a négy lépés szerint, és párban visszajelzést kérünk rá.", "tools": "papír, toll", "keywords": "erőszakmentes kommunikáció, nehéz beszélgetés, üzenet, négy lépés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki választ egy nehéz helyzetet, valósat vagy kitaláltat: elmondani a szüleinek, hogy más szakra menne; jelezni egy lakótársnak, hogy zavarja valami; kérni egy tanártól egy jegy átbeszélését.\n2. Megírják az üzenetet a négy lépés szerint: megfigyelés, érzés, szükséglet, kérés.\n3. Párban felolvassák, és a társ visszajelez: hol hangzik vádnak? Mi érthető?\n4. Javítanak rajta.", "caution": "Az üzenetet nem kell elküldeni. Ha valaki valós, nehéz helyzetről ír, ne kelljen a csoport előtt felolvasnia.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC07-11", "theme_id": "t07", "name": "Amikor engem kritizálnak", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "11", "description": "Gyakoroljuk, hogyan hallgassuk meg a kritikát úgy, hogy meghalljuk mögötte a másik szükségletét.", "tools": "szerepkártyák", "keywords": "kritika fogadása, empátia, erőszakmentes kommunikáció, önreflexió", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Beszéljétek meg: mit szoktunk csinálni, ha kritizálnak? (Védekezünk, visszatámadunk, elhallgatunk.)\n2. Párban az egyik egy kitalált kritikát mond („Sosem segítesz itthon!”).\n3. A másik nem védekezik, hanem rákérdez a mögötte lévő érzésre és szükségletre („Úgy érzed, egyedül maradtál a házimunkával?”).\n4. Cserélnek, majd közösen megbeszélik, milyen volt.", "caution": "Ez nem azt jelenti, hogy minden kritikát el kell fogadni. A cél az, hogy előbb megértsük, és csak utána reagáljunk.", "variants": null}, {"id": "VC08-6", "theme_id": "t08", "name": "A konfliktuslépcső", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "7", "description": "Egy kitalált vita lépéseit sorba rendezzük, és megkeressük, hol lehetett volna megállítani.", "tools": "eseménykártyák (egy-egy lépés kártyánként)", "keywords": "konfliktus, eszkaláció, megelőzés, vita, döntési pontok", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Írj 7–8 kártyát egy kitalált vita lépéseivel: valaki elveszi a másik tollát; a másik visszaszól; elhangzik egy csúnya szó; lökdösődni kezdenek; mások is beszállnak; kiabálnak; bejön a tanár.\n2. Kiscsoportban sorba rendezik a kártyákat egy lépcsőn.\n3. Megjelölik, melyik lépésnél lehetett volna megállni, és mit kellett volna mondani vagy tenni.\n4. Közösen összevetitek, és felírjátok a legjobb „megállítókat”.", "caution": "Ne hasonlítson valódi osztálybeli esetre. Mondd ki: minél korábban állunk meg, annál könnyebb.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC08-7", "theme_id": "t08", "name": "A jó bocsánatkérés", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Könnyű", "grade": "7", "description": "Megbeszéljük, mitől igazi egy bocsánatkérés, és gyakoroljuk a lépéseit.", "tools": "papír, toll", "keywords": "bocsánatkérés, kibékülés, felelősségvállalás, konfliktus", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Közösen gyűjtsétek: milyen a rossz bocsánatkérés? („Bocs, de te kezdted.”)\n2. Írd fel a jó bocsánatkérés négy lépését: mit tettem; sajnálom, mert …; mit teszek másképp; mit tehetek, hogy jobb legyen?\n3. Párban egy kitalált helyzetre gyakorolják.\n4. Zárás: kinek mondanál most szívesen egy bocsánatkérést? (Nem kell megosztani.)", "caution": "A bocsánatkérést nem lehet kikényszeríteni. Mondd el, hogy nem mindig fogadják el rögtön, és ez is rendben van.", "variants": null}, {"id": "VC08-8", "theme_id": "t08", "name": "Közvetítés hármasban", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Hármasban kipróbáljuk az egyszerű mediációt: két fél és egy közvetítő, aki nem dönt, csak segít.", "tools": "szerepkártyák, a mediáció lépései a táblán", "keywords": "mediáció, közvetítés, konfliktuskezelés, szerepjáték, megoldáskeresés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Írd fel a lépéseket: mindkét fél elmondja a saját szemszögét; a közvetítő visszamondja; mindkét fél elmondja, mire van szüksége; közösen keresnek megoldást; megállapodnak.\n2. Hármas csoportokban dolgoznak, kitalált helyzetekkel (közös projekt, kölcsönadott és el nem hozott holmi, kibeszélés).\n3. Három, egyenként hétperces kört játszanak, így mindenki minden szerepet kipróbál.\n4. A közvetítő mondja el, mi volt nehéz.", "caution": "A közvetítő ne adjon tanácsot, és ne döntsön. A kör végén mindenki „rázza le” magáról a szerepét.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC08-9", "theme_id": "t08", "name": "Mi volt nehéz a közvetítőnek?", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "9", "description": "Visszatekintünk a mediációra: mi segítette a megállapodást, és mikor érdemes valódi konfliktusban közvetítőt kérni.", "tools": "papír, toll", "keywords": "mediáció, reflexió, konfliktuskezelés, segítségkérés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Közös beszélgetés: Melyik szerep volt a legnehezebb? Mikor jutottatok el megállapodásig, és mi segített?\n2. Gyűjtsétek össze: mikor jó, ha egy harmadik ember segít (és ki lehet az: barát, osztálytárs, osztályfőnök)?\n3. Mondd el, van-e az iskolában kortárs mediáció vagy más segítő lehetőség.", "caution": "Ha valódi konfliktus jön elő, ne itt oldjátok meg: ajánld fel a segítséget külön.", "variants": null}, {"id": "VC08-10", "theme_id": "t08", "name": "Tárgyalás érdekek mentén", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Szerepjátékban tárgyalunk, és megkülönböztetjük az álláspontot (amit kérek) az érdektől (amiért kérem).", "tools": "szerepkártyák", "keywords": "tárgyalás, érdekek, álláspont, win-win, konfliktuskezelés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Magyarázd el: az álláspont az, amit kérünk („Menjünk Bécsbe!”), az érdek az, amiért kérjük („Szeretnék várost látni”, „Nem akarok sokat utazni”).\n2. A kiscsoportok kapnak egy helyzetet: kevés pénzből kell megtervezniük az osztály ballagási kirándulását, és mindenki mást szeretne. Mindenki kap egy szerepkártyát a saját álláspontjával és titkos érdekével.\n3. 15 percig tárgyalnak. Olyan megoldást keresnek, amely a legtöbb érdeket kielégíti.\n4. A csoportok bemutatják a megoldásukat.", "caution": "Hívd fel a figyelmet arra, mennyi minden megoldható, ha az érdekekről beszélünk, nem az álláspontokról.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC08-11", "theme_id": "t08", "name": "Az én konfliktusmintáim", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Mély", "grade": "11", "description": "Mindenki végiggondolja, milyen mintákat hozott a családjából és a barátaitól a vitákba, és melyiket szeretné megtartani.", "tools": "papír, toll", "keywords": "konfliktusminták, reflexió, család, önismeret, változás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Egyénileg válaszolnak: Hogyan vitatkoztak nálunk otthon? Én mit csinálok egy vitában (elhallgatok, kiabálok, elmegyek, megoldást keresek)? Ki tanított erre?\n2. Felírják: melyik mintát szeretném megtartani, és melyiket elengedni?\n3. Párban azt osztják meg, amit szeretnének.\n4. Közös kör: egy dolog, amit a következő vitában másképp csinálok.", "caution": "A családi minták érzékenyek lehetnek. Senkinek ne kelljen a családjáról beszélnie. Ha valaki otthoni bántalmazásra utal, beszélj vele négyszemközt, és kövesd az iskola eljárásrendjét.", "variants": null}, {"id": "VC09-6", "theme_id": "t09", "name": "A lebegő bot", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "7", "description": "Egy könnyű botot mindenki csak ujjhegyen tarthat, és közösen kell letenni a földre – ami meglepően nehéz.", "tools": "egy hosszú, könnyű rúd (pl. sátorrúd, hulahopp-karika)", "keywords": "együttműködés, csapatjáték, kommunikáció, türelem, mozgás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. A 6–8 fős csoportok két sorban állnak, egymással szemben. Mindenki kinyújtja a mutatóujját, és a botot az ujjaikra teszed.\n2. A feladat: tegyék le a botot a földre úgy, hogy mindenki ujja végig hozzáérjen. Ha valakié elválik, újrakezdik.\n3. A bot általában felfelé megy: hagyd, hogy rájöjjenek, miért.\n4. Két-három próbálkozás után két percet kapnak a tervezésre, aztán újra próbálkoznak.\n5. Végül beszéljétek meg, mi segített.", "caution": "A bot valamiért mindig felfelé indul, ez a gyakorlat lényege. Figyelj arra, hogy a hibáztatás ne egy emberre irányuljon.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC09-7", "theme_id": "t09", "name": "Mi ment jól, mi nem?", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Könnyű", "grade": "7", "description": "A lebegő bot után megbeszéljük, ki mit csinált a csapatban, és mit vinnénk át a csoportmunkákba.", "tools": "csomagolópapír, filcek", "keywords": "reflexió, csapatmunka, szerepek, kommunikáció", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Közös beszélgetés: Mi volt nehéz? Ki adott ötletet? Ki irányított? Ki figyelt?\n2. Készítsetek plakátot „Jó csapatmunka nálunk” címmel, 4–5 szabállyal.\n3. Zárás: melyik szabályt tudnátok a következő csoportmunkában (órán) is használni?", "caution": "Dicsérd meg a csendesebb, de figyelő szerepeket is, ne csak a hangosakat.", "variants": null}, {"id": "VC09-8", "theme_id": "t09", "name": "Túlélés a Holdon", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Egyénileg, majd csoportban rangsorolunk tárgyakat egy kitalált holdi túléléshez, és összevetjük az eredményt a szakértői rangsorral.", "tools": "a tárgylista és a szakértői rangsor (NASA-feladat) kinyomtatva", "keywords": "csoportos döntés, együttműködés, érvelés, konszenzus, NASA-feladat", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Ismertesd a helyzetet: az űrhajó 300 km-re a bázistól lezuhant a Holdon. 15 tárgy maradt épen (oxigénpalack, víz, térkép, gyufa stb.).\n2. Egyénileg mindenki rangsorolja a tárgyakat fontosság szerint (5 perc).\n3. Kiscsoportban közös rangsort készítenek, egyetértésre törekedve (15 perc).\n4. Mutasd meg a szakértői rangsort. Mindenki kiszámolja, mennyire tért el az egyéni és a csoportos rangsor a szakértőitől.", "caution": "Gyakran a csoportos rangsor jobb, mint a legtöbb egyéni: ez a beszélgetés alapja. Ne a győztesre koncentrálj, hanem a folyamatra.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC09-9", "theme_id": "t09", "name": "Egyedül vagy együtt?", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "9", "description": "Megbeszéljük, mikor jobb a csoportos döntés, és mi segítette vagy akadályozta a közös rangsort.", "tools": "papír, toll", "keywords": "csoportos döntés, reflexió, konszenzus, csoportdinamika", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Közös beszélgetés: Kinek lett jobb az egyéni, és kinek a csoportos eredménye? Miért?\n2. Kiscsoportban: Ki győzött meg kit? Volt, akit nem hallgattak meg, pedig igaza volt?\n3. Gyűjtsétek össze, mi segíti a jó csoportos döntést (mindenki megszólal, érvelünk, nem a leghangosabb dönt).", "caution": "Figyelj azokra, akiket a csoport „lehengerelt”. Kérdezd meg őket is, hogyan élték meg.", "variants": null}, {"id": "VC09-10", "theme_id": "t09", "name": "Közös projekt tervezése", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Kiscsoportokban megtervezünk egy valódi kis projektet az iskolának, szerepekkel, feladatokkal és határidőkkel.", "tools": "csomagolópapír, filcek", "keywords": "projekttervezés, együttműködés, felelősség, szerepek, közösség", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kiscsoportonként válasszanak egy ötletet: jótékonysági nap, könyvcsere, segítség az alsóbb évesek beilleszkedéséhez, egy közös program.\n2. A plakátra felírják: mi a cél, milyen lépések vezetnek oda, ki mit csinál, mire van szükség, és mikorra készülnek el.\n3. A csoportok 3 percben bemutatják a tervüket.\n4. Ha van rá lehetőség, a csoport kiválaszt egyet, és meg is valósítja.", "caution": "A legjobb, ha egy terv valóban megvalósul. Egyeztess előre az iskolavezetéssel, mire van lehetőség.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC09-11", "theme_id": "t09", "name": "Milyen szerepet töltök be?", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "11", "description": "Megismerjük a jellemző csapatszerepeket, és mindenki megnézi, melyiket szokta, és melyiket szeretné kipróbálni.", "tools": "a csapatszerepek rövid leírása a táblán", "keywords": "csapatszerepek, önismeret, együttműködés, erősségek", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Írj fel 6–8 szerepet röviden: ötletgazda, szervező, megvalósító, kapcsolattartó, ellenőrző, csapatösszetartó, kritikus gondolkodó.\n2. Mindenki megjelöli, melyik szerepben érzi magát otthon, és melyikben nem.\n3. Kiscsoportban megnézik: milyen szerepek vannak meg a csapatukban, és mi hiányzik?\n4. Zárás: egy szerep, amit a következő közös munkában kipróbálok.", "caution": "Mondd el, hogy ezek nem végleges címkék: egy ember több szerepet is betölthet, és fejlődhet.", "variants": null}, {"id": "VC10-6", "theme_id": "t10", "name": "Kedvességfa", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "7", "description": "Közös fát készítünk, amelynek leveleire a csoport tagjairól írunk kedves, konkrét mondatokat.", "tools": "csomagolópapír fa rajzzal, levél alakú cetlik, filcek", "keywords": "pozitív visszajelzés, hála, osztályközösség, kedvesség", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Rajzolj egy nagy fát (törzzsel és ágakkal) csomagolópapírra, és tedd ki.\n2. Mindenki kap egy-egy osztálytárs nevét (húzással), és több levélre ír róla kedves, konkrét mondatot („Segítettél, amikor elfelejtettem a könyvemet.”).\n3. A leveleket felragasztják a fára, a név mellé.\n4. Közösen végigolvassátok a fát.", "caution": "Nézd át a leveleket, mielőtt felragasztják őket, és figyelj arra, hogy mindenkiről írjanak legalább egyet.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC10-7", "theme_id": "t10", "name": "Amire büszke vagyok", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Könnyű", "grade": "7", "description": "Mindenki összegyűjti, mire büszke a tanévből, és megosztja a csoporttal.", "tools": "papír, színes ceruzák", "keywords": "önértékelés, büszkeség, fejlődés, lezárás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki rajzol egy érmet vagy kupát, és beleírja: mire vagyok büszke ebben a tanévben? (Iskolában, otthon, barátságban, sportban.)\n2. Körben mindenki megmutatja és elmondja egy mondatban.\n3. A társak tapssal vagy egy kedves szóval reagálnak.", "caution": "A kis dolgok is számítanak: ha valaki nem talál semmit, segíts neki egy konkrét megfigyeléssel.", "variants": null}, {"id": "VC10-8", "theme_id": "t10", "name": "Hogyan adjunk jó visszajelzést?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "9", "description": "Megtanuljuk a jó visszajelzés szabályait, és helyzeteken gyakoroljuk, hogyan adjunk konkrét, a viselkedésről szóló visszajelzést, javaslattal együtt.", "tools": "helyzetkártyák", "keywords": "visszajelzés, építő kritika, kommunikáció, konkrétság", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Írd fel a jó visszajelzés három szabályát: legyen konkrét; a viselkedésről szóljon, ne a személyről; legyen benne javaslat.\n2. Mutass rossz és jó példát: „Uncsi volt a kiselőadásod.” → „A bevezetőt érdekesnek találtam, a végén viszont nehéz volt követni, mert gyorsan beszéltél. Talán lassabban.”\n3. Párban helyzetkártyákon gyakorolják (kiselőadás, közös projekt, egy barát viselkedése).\n4. A társ visszajelez: mennyire volt használható?", "caution": "Mondd ki, hogy a jó visszajelzés nem a hiba kiemelése, hanem segítség a fejlődéshez.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC10-9", "theme_id": "t10", "name": "Visszajelzés fogadása", "type": "Feldolgozás", "type_order": 4, "minutes": 25, "depth": "Közepes", "grade": "9", "description": "Gyakoroljuk, hogyan fogadjuk a visszajelzést védekezés nélkül: meghallgatom, rákérdezek, megköszönöm.", "tools": "papír, toll", "keywords": "visszajelzés fogadása, kritika, önfejlesztés, kommunikáció", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Beszéljétek meg: hogyan szoktunk reagálni, ha visszajelzést kapunk? (Védekezünk, magyarázkodunk, megsértődünk.)\n2. Írd fel a három lépést: meghallgatom; rákérdezek, ha nem világos; megköszönöm, és eldöntöm, mit kezdek vele.\n3. Párban az egyik egy kitalált visszajelzést ad, a másik a három lépéssel reagál. Cserélnek.\n4. Zárás: mikor kaptál olyan visszajelzést, ami sokat segített?", "caution": "A visszajelzést nem kötelező elfogadni: meg lehet köszönni, és utána eldönteni, mit kezdünk vele.", "variants": null}, {"id": "VC10-10", "theme_id": "t10", "name": "Erősség és javaslat", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Kiscsoportban mindenki kap egy erősséget és egy fejlődési javaslatot a társaitól, név szerint, de kedvesen.", "tools": "cetlik két színben", "keywords": "360 fokos visszajelzés, erősségek, fejlődés, őszinteség, tapasztalt csoport", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Alakítsatok 4–5 fős csoportokat olyanokból, akik jól ismerik egymást.\n2. Mindenki minden társának két ce
