e húzódjon el a gyakorlat.", "variants": null}, {"id": "VC10-111", "theme_id": "t10", "name": "Visszajelzés az osztályfőnöki óráknak", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "A diákok visszajelzést adnak az órákról és az osztályfőnöknek: mi segített, mi hiányzott, mit változtatnának.", "tools": "névtelen visszajelző lap, cetlik három színben", "keywords": "visszajelzés, programértékelés, részvétel, fejlesztés, hang", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mondd el: most ti adtok visszajelzést nekem és a programnak. Őszintén, de tisztelettel.\n2. Mindenki névtelenül kitölt három színű cetlit: zöld – ami segített; sárga – ami lehetne jobb; kék – ötlet a jövőre.\n3. Kiscsoportok csoportosítják a cetliket, és összefoglalják a legfontosabbakat.\n4. Meghallgatod a csoportok összefoglalóját, és csak kérdezel, nem védekezel.\n5. Feldolgozás: Milyen volt visszajelzést adni egy felnőttnek? Mit érzel, amikor a véleményed számít? Melyik ötletet próbálnánk ki együtt jövőre?", "caution": "Fogadd nyitottan a kritikát. Mutass példát arra, hogyan lehet visszajelzést védekezés nélkül fogadni.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC12-111", "theme_id": "t12", "name": "Kik maradnak?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Végiggondoljuk, mely barátságaink maradhatnak meg az iskola után, és mit tehetünk azért, hogy a fontos kapcsolatok túléljék a változásokat.", "tools": "A4-es lapok koncentrikus körökkel", "keywords": "barátság, kapcsolati háló, változás, ápolás, jövő", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki rajzol három kört maga köré: legbelső kör – akikre bármikor számíthatok; középső – akikkel jó, de nem ilyen közeli; külső – ismerősök.\n2. Elhelyezi a barátait (lehet csak kezdőbetűvel vagy jellel).\n3. Bejelöli, kikkel szeretné megtartani a kapcsolatot az iskola után.\n4. Kiscsoportok összegyűjtik, mi tartja életben a barátságot távolság és változás mellett.\n5. Feldolgozás: Kik kerültek közelebb az elmúlt években, és kik távolabb? Mit tehetsz most egy fontos barátságért? Hogyan jelzed valakinek, hogy fontos neked?", "caution": "A köröket senkinek ne kelljen megmutatnia.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC12-112", "theme_id": "t12", "name": "Kiállás", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "11", "description": "Felnőttkori helyzeteken (munkahely, egyetem, utca) gyakoroljuk, hogyan álljunk ki valakiért, akit kirekesztenek vagy bántanak, biztonságosan.", "tools": "helyzetkártyák, a „5 D” lista (közvetlen fellépés, figyelemelterelés, segítség hívása, utólagos támogatás, dokumentálás)", "keywords": "kiállás, szemtanú, bátorság, biztonság, szolidaritás", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mutasd be az 5 D-t, és beszéljétek meg, melyik mikor biztonságos.\n2. Kiscsoportok kapnak egy helyzetet (pl. egy kollégát rendszeresen kigúnyolnak; a villamoson valakit zaklatnak; egy csoportchatben valakit lejáratnak).\n3. Mindegyik helyzetre kiválasztanak 2 D-t, és pontosan kitalálják, mit mondanának vagy tennének.\n4. Bemutatják, a többiek kiegészítik.\n5. Feldolgozás: Melyik D a legkönnyebb neked, és melyik a legnehezebb? Miért nem lép közbe sokszor senki? Mit tennél, ha te lennél a bántott fél?", "caution": "Emeld ki: a saját biztonság az első. A közvetlen fellépés nem mindig jó választás.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC13-111", "theme_id": "t13", "name": "Egy nap offline", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Megtervezünk egy 24 órás digitális szünetet, előre végiggondoljuk a nehézségeket, és a következő alkalommal megbeszéljük a tapasztalatokat.", "tools": "A4-es lapok", "keywords": "digitális szünet, szokások, függőség, tudatosság, kísérlet", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mikor voltál utoljára 24 órán át telefon nélkül? Milyen volt?\n2. Mindenki megtervezi a saját offline napját: melyik napon, mit kapcsol ki (lehet csak a közösségi média), mi lesz helyette, kinek szól előre.\n3. Felírja, mitől fél (pl. lemaradok valamiről, unatkozom), és mit tesz, ha jön a késztetés.\n4. Párban egymás „offline-társai” lesznek: a következő alkalom előtt megkérdezik egymást, hogy ment.\n5. Feldolgozás: Mi a legnehezebb az offline napban? Mire számítasz, mit fogsz nyerni? A következő alkalom elején beszéljétek meg: mi derült ki rólad a kísérletből?", "caution": "A kísérlet önkéntes. Ha valakinek a telefon biztonsági okból kell (pl. család), alkalmazkodjatok.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC13-112", "theme_id": "t13", "name": "MI a tanulásban", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Megbeszéljük, mikor segít a mesterséges intelligencia a tanulásban, és mikor veszi el tőlünk a tanulást, és közös szabályokat fogalmazunk meg.", "tools": "helyzetkártyák, skála a padlón (1 = segít tanulni, 10 = helyettem dolgozik)", "keywords": "mesterséges intelligencia, tanulás, etika, becsületesség, digitális kompetencia", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Olvass fel helyzeteket (pl. megkérdezem az MI-t, mit jelent egy fogalom; vele íratom meg a fogalmazást; kérem, hogy kérdezzen ki; összefoglaltatom vele ": "Mit hagyunk az utolsó évre?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Megtervezzük, mit szeretnénk még együtt átélni az utolsó évben, és mit hagyunk magunk után a csoportként.", "tools": "csomagolópapír, cetlik", "keywords": "utolsó év, tervezés, közösség, örökség, célok", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mi az, amit 12.-ben mindenképp szeretnétek együtt megcsinálni?\n2. Mindenki felír 2–3 ötletet (közös program, egy hagyomány, valami az iskolának).\n3. A csoport rangsorolja az ötleteket, és kiválaszt 2–3-at.\n4. Mindegyikhez felelőst és első lépést keresnek.\n5. Feldolgozás: Mire szeretnétek, hogy emlékezzenek rólatok az iskolában? Mi lenne a csoport „öröksége”? Mit vállalsz te belőle?", "caution": "Ügyelj, hogy az ötletek megvalósíthatók legyenek, és mindenki hangja számítson.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC17-112", "theme_id": "t17", "name": "Üzenet a ballagóknak", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "11", "description": "Levelet írunk a 12.-eseknek a ballagásuk előtt: mit tanultunk tőlük, mit kívánunk nekik.", "tools": "levélpapír, borítékok", "keywords": "búcsú, hála, kapcsolat a felsőbbévesekkel, lezárás, hagyomány", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mit láttatok a 12.-esektől az évek alatt? Mit tanultatok tőlük?\n2. Kiscsoportok vagy egyénileg leveleket írnak a 12.-es csoportnak vagy egy-egy ismert diáknak.\n3. A levelekbe beleírják: egy emléket, egy köszönetet, egy kívánságot.\n4. Megbeszélitek, hogyan juttatjátok el őket (pl. a 12.-esek utolsó óráján).\n5. Feldolgozás: Milyen érzés lesz egy év múlva neked ballagni? Mit szeretnél, hogy a 11.-esek írjanak neked? Mit tanulsz ebből a búcs ", "grade": "12", "description": "Megrajzoljuk a saját határainkat különböző területeken (testi, érzelmi, idő, pénz, digitális), és gyakoroljuk, hogyan jelezzük őket felnőtt kapcsolatokban.", "tools": "A3-as lapok, filcek", "keywords": "határok, önvédelem, kapcsolatok, asszertivitás, felnőttkor", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mutasd be a határok területeit: testi, érzelmi, idő, pénz, digitális.\n2. Mindenki megrajzolja a térképét: területenként mi rendben van, mi a szürke zóna, és mi a határ.\n3. Párban gyakorolják egy-egy határ kimondását (pl. „Ezt nem szeretném.” „Most nem érek rá.” „Pénzt nem adok kölcsön.”).\n4. Beszéljétek meg, mi történik, ha valaki rendszeresen átlépi a határainkat.\n5. Feldolgozás: Melyik területen a legnehezebb határt húznod? Kinél tartod a legkönnyebben a határaidat? Mit tennél, ha egy kapcsolatban folyamatosan átlépik őket?", "caution": "A testi határoknál légy tapintatos. Ha bántalmazásra utaló jel kerül elő, kezeld négyszemközt, szakember bevonásával.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC15-121", "theme_id": "t15", "name": "Vizsganap-terv", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "12", "description": "Részletesen megtervezzük a vizsganapot és az előtte lévő estét: mit eszünk, mikor fekszünk, mit csinálunk, ha leblokkolunk.", "tools": "A4-es lapok", "keywords": "vizsga, stressz, tervezés, blokkolás, felkészülés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: mi a legrosszabb, ami egy vizsganapon történhet veled? Gyűjtsétek a félelmeket névtelenül.\n2. Mindenki megtervezi a vizsga előtti estét és a vizsganapot óráról órára.\n3. Közösen összegyűjtitek, mit lehet tenni, ha a vizsgán leblokkolsz (légzés, egy könnyebb feladattal kezdeni, inni egy kortyot, felírni a kulcsszavakat).\n4. Mindenki felír magának egy „vizsgamondatot”, amit leblokkolás esetén mond magának.\n5. Feldolgozás: Melyik félelmed csökkent a terv után? Mi a te vizsgamondatod? Ki az, aki a vizsganapon szurkolhat neked?", "caution": "Ha valaki nagyon erős vizsgaszorongásról beszél, ajánld fel az iskolapszichológust.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC15-122", "theme_id": "t15", "name": "Ha elfogy az energia", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Mély", "grade": "12", "description": "Megismerjük a kiégés és a túlterhelés korai jeleit, és tervet készítünk arra, hogyan előzzük meg az érettségi évben.", "tools": "jelek listája, A4-es lapok", "keywords": "kiégés, túlterhelés, energia, pihenés, megelőzés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mutasd be a túlterhelés jeleit (állandó fáradtság, cinizmus, „minek”, alvászavar, elszigetelődés, gyakori betegség).\n2. Mindenki megjelöli magának, melyiket érezte az elmúlt hónapban (nem kell megosztani).\n3. Kiscsoportok összegyűjtik, mi tölt fel igazán (nem csak elvonja a figyelmet), és mi a különbség a pihenés és a görgetés között.\n4. Mindenki megírja az „energia-tervét”: heti pihenőidő, egy feltöltő tevékenység, egy ember, akinek szól, ha fogy az energia.\n5. Feldolgozás: Hol tartasz most az energiádat tekintve egy 1–10-es skálán? Mi az első jel nálad, hogy kezd elfogyni? Mit vállalsz a következő hétre?", "caution": "Ha valaki komoly kimerültségről vagy reménytelenségről beszél, beszélj vele négyszemközt, és irányítsd szakemberhez.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC16-121", "theme_id": "t16", "name": "Több út", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Közepes", "grade": "12", "description": "Megismerjük az érettségi utáni alternatív utakat (gap year, szakképzés, munka, külföld, halasztás), és oldjuk a „csak egy jó út van” nyomást.", "tools": "történetkártyák különböző életutakról", "keywords": "pályaválasztás, alternatívák, gap year, rugalmasság, döntés", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Kérdezd meg: kinek az az érzése, hogy ha most nem jól dönt, elrontja az életét?\n2. Kiscsoportok kapnak egy-egy életút-történetet (pl. valaki halasztott egy évet és dolgozott; valaki egyetemet váltott; valaki szakmát tanult, aztán egyetemre ment).\n3. Megbeszélik: mi volt jó ebben az útban? Mi volt nehéz? Mit tanulhatunk belőle?\n4. Gyűjtsétek a táblára, hány úton lehet eljutni ugyanoda.\n5. Feldolgozás: Mit változtat rajtad, hogy több jó út van? Melyik alternatívát érdemes végiggondolnod? Kivel beszélnél erről?", "caution": "Ne rangsorold az utakat. Figyelj azokra, akiknek a család nagyon szűk utat jelöl ki.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC16-122", "theme_id": "t16", "name": "Első saját költségvetés", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "12", "description": "Elkészítjük egy kitalált első egyetemi vagy munkás hónap költségvetését, és megbeszéljük, milyen érzelmi döntések rejlenek a pénzügyekben.", "tools": "költségvetés-sablon, kitalált bevételek és kiadások", "keywords": "pénzügyi tudatosság, költségvetés, önállóság, döntés, felnőttkor", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Oszd ki a sablont egy kitalált bevétellel (pl. ösztöndíj + diákmunka) és listával a kiadásokról (albérlet, rezsi, étel, közlekedés, telefon, szórakozás).\n2. Párban elkészítik a hónap költségvetését úgy, hogy maradjon tartalék is.\n3. Adj egy váratlan helyzetet (pl. elromlik a laptop; meghívnak egy drága hétvégére). Mit teszne ", "description": "Mindenki egy apró, szimbolikus ajándékot készít a csoportnak (egy szó, rajz, idézet), és megosztja, mit kapott a közösségtől.", "tools": "kartonlapok, filcek, egy doboz a közös ajándékoknak", "keywords": "hála, közösség, szimbólum, búcsú, emlék", "source": "Lélektér – évfolyamsávos kiegészítés", "instructions": "1. Mindenki kap egy kartont, és készít rá valamit, ami a csoportot jelképezi neki (szó, rajz, idézet, közös poén).\n2. Körben mindenki bemutatja és elmondja: „Ezt kaptam tőletek…”\n3. A kartonokat egy dobozba gyűjtitek, és eldönthetitek, mi legyen vele (fotó, kiállítás, egy évfolyam-találkozón felbontjátok).\n4. Készítsetek közös fényképet a kartonokkal.\n5. Feldolgozás: Mit jelentett neked ez a csoport? Mit adnál tovább ebből a jövőbeli közösségeidnek? Mit kívánsz a csoportnak?", "caution": "Hagyj teret a meghatódásnak. A doboz sorsáról a csoport döntsön.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC01-51", "theme_id": "t01", "name": "Az osztályunk címere", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Kiscsoportok közös címert terveznek: mi jellemző ránk, és mi fontos nekünk együtt.", "tools": "A3-as lapok, filcek, ragasztó", "keywords": "osztályközösség, címer, közös értékek, csoportépítés", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mutass egy-két címert (város, focicsapat), és kérdezd meg: mit üzennek a képek?\n2. 5–6 fős csoportok négy mezőre osztják a lapot: amit szeretünk együtt csinálni; egy állat, ami illik hozzánk; egy szó, ami fontos nekünk; egy szabály, ami nélkül nem megy.\n3. 15 perc alatt megrajzolják, és kitalálnak egy jelmondatot.\n4. Minden csoport 1 percben bemutatja a címerét.\n5. Feldolgozás: Miben hasonlítottak a címerek? Melyik szabály szerepelt többször is? A címereket kitesszük a falra, és az év során vissza-visszatérünk hozzájuk.", "caution": "Figyelj, hogy a csoportban mindenki rajzolhasson, ne csak a legügyesebbek.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC01-52", "theme_id": "t01", "name": "Szabálydetektívek", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Hétköznapi osztálytermi helyzeteket vizsgálunk meg nyomozóként: melyik szabály hiányzott, és melyik segítene?", "tools": "helyzetkártyák, nagyító (játékból vagy rajzolva)", "keywords": "szabályok, osztályszabályok, felelősség, közös megállapodás", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mondd el: ma nyomozók vagytok. Minden „bűnügy” egy osztálytermi helyzet, ahol valami félrement.\n2. Párok kapnak egy helyzetet (pl. mindenki egyszerre kiabál; valaki elveszi más tolltartóját; valakit kinevetnek, amikor hibázik).\n3. Kitalálják: mi volt a baj? Milyen szabály segített volna? Hogyan lehetne ezt pozitívan megfogalmazni (pl. „Egyszerre egy ember beszél”)?\n4. A szabályokat felírjátok a táblára, és közösen kiválasztjátok az 5 legfontosabbat.\n5. Feldolgozás: Melyik szabályt a legnehezebb betartani? Mi történjen, ha valaki megszegi? Az 5 szabályból plakát készülhet a terembe.", "caution": "A helyzetek ne utaljanak valódi osztálytársakra.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC02-51", "theme_id": "t02", "name": "Érzelem-színek", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Minden érzéshez színt választunk, és megbeszéljük, miért pont azt. Kiderül, hogy ugyanazt az érzést másképp látjuk.", "tools": "színes lapok vagy ceruzák, érzelemkártyák", "keywords": "érzelmek, színek, kifejezés, egyéni különbségek", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Írj fel öt érzést a táblára: öröm, szomorúság, düh, félelem, nyugalom.\n2. Mindenki mindegyikhez kiválaszt egy színt, és színes ponttal jelöli a saját lapján.\n3. Párban összehasonlítják: ugyanazt a színt választották?\n4. Közösen összeszámoljátok: melyik érzésnél egyeztek a legtöbben, és melyiknél volt a legtöbbféle szín?\n5. Feldolgozás: Miért választottad ezt a színt? Milyen színű vagy ma? Mit jelent, hogy mások ugyanarra az érzésre más színt gondolnak?", "caution": "Nincs jó vagy rossz szín: hangsúlyozd, hogy mindenki másképp érzi.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC02-52", "theme_id": "t02", "name": "Érzelem-barkochba", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Egy diák gondol egy érzésre, a többiek eldöntendő kérdésekkel próbálják kitalálni. Közben új érzésszavakat tanulunk.", "tools": "érzelemkártyák (a táblára is írhatod)", "keywords": "érzelemszókincs, kérdezés, érzelmek, játék", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Írj fel 15–20 érzésszót a táblára (pl. büszke, csalódott, ideges, hálás, zavart, féltékeny, izgatott).\n2. Egy önként jelentkező titokban kiválaszt egyet. A többiek csak igen–nem kérdéseket tehetnek fel (pl. „Kellemes érzés?” „Érzed a hasadban?” „Születésnapon szoktad érezni?”).\n3. Aki kitalálja, az következik. Játsszatok 4–5 kört.\n4. A végén mindenki kiválaszt egy szót, amit eddig nem nagyon használt.\n5. Feldolgozás: Melyik kérdés segített a legtöbbet? Melyik érzést volt a legnehezebb kitalálni? Mikor érezted ezt az érzést legutóbb?", "caution": "Ha valaki nem szeretne szerepelni, kérdezőként is részt vehet.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC03-51", "theme_id": "t03", "name": "Nyugi-eszköztár", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Kipróbálunk öt egyszerű nyugtató technikát, és mindenki elkészíti a saját nyugi-kártyáját.", "tools": "kartonlapok, színes ceruzák", "keywords": "önszabályozás, nyugtatás, légzés, technikák", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kérdezd meg: mit csinálsz, ha nagyon dühös vagy ideges vagy?\n2. Próbáljatok ki együtt öt technikát, mindegyiket fél percig: virág-gyertya légzés (szagold a virágot, fújd el a gyertyát); számolás 10-ig lassan; ököl-szorítás és elengedés; 5 dolog, amit látok; képzeletbeli kedvenc hely.\n3. Mindenki pontozza magában: melyik segített a legjobban?\n4. Mindenki elkészíti a nyugi-kártyáját a három kedvenc technikájával, rajzzal.\n5. Feldolgozás: Melyik technika volt a legfurcsább, és melyik a legjobb? Hol tartod a kártyádat? Mikor fogod legközelebb használni?", "caution": "Mutasd meg te is a technikákat, így a gyerekek bátrabban csinálják.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC03-52", "theme_id": "t03", "name": "A dühös sárkány", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Egy mesén keresztül megbeszéljük, mi történik, amikor elönt a düh, és hogyan „szelídíthetjük meg” a sárkányunkat.", "tools": "egy rövid, saját mese a dühös sárkányról (vagy a táblára írt történet), rajzlapok", "keywords": "düh, indulatkezelés, mese, önszabályozás", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mesélj el egy rövid történetet egy kis sárkányról, aki ha dühös lesz, mindent felgyújt, aztán megtanul megállni.\n2. Kérdezd meg: mit érez a sárkány a teste melyik részében, mielőtt tüzet fúj? Mi segített neki megállni?\n3. Mindenki lerajzolja a saját dühsárkányát, és mellé írja: mi dühíti fel, és mi szelídíti meg.\n4. Párban megmutatják egymásnak a sárkányukat.\n5. Feldolgozás: Milyen jelekből tudod, hogy jön a sárkány? Mi a te legjobb sárkányszelídítő trükköd? Kinek tudsz szólni, ha a sárkány túl nagy?", "caution": "A düh nem rossz, csak a „tűzfújás” árthat. Ezt mondd ki.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC04-51", "theme_id": "t04", "name": "Én-csillag", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Mindenki egy csillag öt ágába ír magáról: mit szeret, miben ügyes, mire büszke, mi nehéz neki, és mit szeretne megtanulni.", "tools": "A4-es lapok csillagrajzzal, színes ceruzák", "keywords": "önismeret, erősségek, célok, bemutatkozás", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Rajzolj egy nagy ötágú csillagot, és írd az ágakhoz: Szeretem… Ügyes vagyok… Büszke vagyok… Nehéz nekem… Szeretném megtanulni…\n2. Mindenki kitölti a saját csillagát, a közepére a nevét írja és egy rajzot magáról.\n3. Párban bemutatják egymásnak a csillagukat, csak amennyit szeretnének.\n4. A csillagokat ki is tehetitek a falra csillagos égként.\n5. Feldolgozás: Melyik ágat volt a legkönnyebb kitölteni, és melyiket a legnehezebb? Mit tudtál meg a párodról, amit eddig nem tudtál?", "caution": "A „Nehéz nekem” ágat senkinek ne kelljen megmutatnia.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC04-52", "theme_id": "t04", "name": "Erősség-medál", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Mindenki kap a társaitól egy papírmedált, amelyre egy erősségét írják. Megtanuljuk észrevenni egymás jó tulajdonságait.", "tools": "papírkorongok vagy kartonok zsinórral, filcek, erősséglista a táblán", "keywords": "erősségek, pozitív visszajelzés, önbizalom, osztályközösség", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Gyűjtsetek közösen 20 erősséget a táblára (pl. segítőkész, vicces, bátor, türelmes, kreatív, jó csapattárs).\n2. Mindenki húz egy nevet (titokban), és annak a társának készít egy medált: ráírja az erősséget, és rajzol mellé valamit.\n3. Körben átadják a medálokat, és egy mondatban elmondják, miért ezt az erősséget választották.\n4. Mindenki felveheti a medálját.\n5. Feldolgozás: Milyen érzés volt kapni? És adni? Hol tudod ezt az erősségedet a héten használni?", "caution": "Nézd át a medálokat átadás előtt. Ha valaki hiányzik, te készíts neki medált.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC05-51", "theme_id": "t05", "name": "Telefonjáték másképp", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "A régi „telefonjáték” segítségével megtapasztaljuk, mennyi minden elvész, ha nem figyelünk, és megtanuljuk a visszakérdezést.", "tools": "egy-két előre megírt rövid üzenet", "keywords": "figyelem, hallgatás, visszakérdezés, félreértés", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Két sorban állva játsszatok telefonjátékot egy kicsit bonyolult mondattal (pl. „Csütörtökön a piros sapkás Bence három zsemlét visz a kirándulásra.”).\n2. Nézzétek meg, mi jött ki a végén. Mi veszett el?\n3. Második kör: most mindenki, aki megkapja az üzenetet, visszakérdez („Jól hallottam, hogy…?”), mielőtt továbbadja.\n4. Hasonlítsátok össze a két kört.\n5. Feldolgozás: Miért segít a visszakérdezés? Mikor fordult elő veled, hogy rosszul hallottál valamit? Hogyan figyelsz, ha valaki fontosat mond?", "caution": "A nagy létszámú osztályt két-három sorra oszd, így gyorsabb a játék.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC05-52", "theme_id": "t05", "name": "A jó hallgató szuperereje", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Összegyűjtjük, mitől lesz valaki jó hallgató, és párban gyakoroljuk a „szuperhős-hallgatást”.", "tools": "rajzlapok, témakártyák", "keywords": "hallgatás, figyelem, szemkontaktus, kérdezés", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kérdezd meg: ki a legjobb hallgató, akit ismertek? Mit csinál, amikor beszélsz hozzá?\n2. Rajzoljatok közösen egy „hallgató szuperhőst” a táblára: nagy fülek (figyel), szemek (rám néz), csukott száj (nem vág közbe), kérdőjel (kérdez).\n3. Párban az egyik 1 percig mesél egy témáról (pl. kedvenc állatom), a másik szuperhősként hallgat, aztán egy kérdést tesz fel. Csere.\n4. Néhány pár elmondja, milyen volt.\n5. Feldolgozás: Melyik szuperképesség a legnehezebb? Mikor nehéz figyelni? Kire fogsz ezen a héten szuperhősként figyelni?", "caution": "A témák legyenek könnyűek és vidámak.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC06-51", "theme_id": "t06", "name": "Hogy érezheti magát?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Képregény-helyzetekben megkeressük, mit érezhet a szereplő, és mit tehetnénk, hogy jobban legyen.", "tools": "helyzetkártyák egyszerű rajzokkal vagy leírással", "keywords": "empátia, érzések felismerése, segítés, kedvesség", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mutass egy helyzetet: „Lili egyedül ül az udvaron, a többiek fociznak.” Kérdezd meg: mit érezhet Lili?\n2. Kiscsoportok kapnak egy-egy helyzetet (pl. valaki elejtette az ebédjét; valakit nem hívtak meg a szülinapra; valaki új az osztályban).\n3. Megbeszélik: mit érezhet? Mit gondolhat? Mit tehetnénk mi?\n4. Bemutatják egy rövid jelenetben a segítő mozdulatot vagy mondatot.\n5. Feldolgozás: Miből tudjuk, mit érez valaki, ha nem mondja? Mikor segítettél utoljára valakinek? Kinek tudnál ezen a héten jobb napot szerezni?", "caution": "A helyzetek legyenek kitaláltak.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC06-52", "theme_id": "t06", "name": "Kedvesség-küldetés", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Mindenki húz egy titkos kedvesség-küldetést, amit a héten teljesít, és a következő órán beszámol.", "tools": "küldetéskártyák (pl. köszönj valakinek, akivel ritkán beszélsz; segíts otthon kérés nélkül; dicsérj meg valakit)", "keywords": "kedvesség, empátia, figyelem, közösség", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kérdezd meg: mi a legkedvesebb dolog, amit valaki mostanában tett érted?\n2. Mindenki húz egy küldetéskártyát, és titokban tartja.\n3. Közösen gyűjtsetek még ötleteket a táblára: hogyan lehet valakinek apró örömet szerezni?\n4. Mindenki felírja a kártyájára, kinek és mikor teljesíti a küldetést.\n5. Feldolgozás: Mit gondolsz, mit fog érezni az, akinek kedveskedsz? Mit érzel te majd? A következő óra elején, aki szeretné, elmeséli, hogyan sikerült.", "caution": "A küldetések legyenek egyszerűek és biztonságosak.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC07-51", "theme_id": "t07", "name": "Csúnya szó, szép szó", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Bántó mondatokat alakítunk át olyanná, amelyek elmondják, mi bánt, de nem bántanak.", "tools": "mondatkártyák", "keywords": "kommunikáció, én-üzenet, kedves beszéd, érzések", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Olvass fel egy mondatot: „Te mindig mindent elrontasz!” Kérdezd meg: mit érez, aki ezt hallja?\n2. Mutasd be a varázsképletet: „Amikor…, akkor én… érzem magam, mert… Szeretném, ha…”\n3. Párban átalakítanak 3–4 bántó mondatot (pl. „Hagyj békén, idegesítő vagy!” „Te csaltál!”).\n4. Néhány pár felolvassa a régi és az új mondatot.\n5. Feldolgozás: Melyik mondatot volt a legnehezebb átírni? Hogyan hat az új mondat a másikra? Mikor fogod használni a varázsképletet?", "caution": "Ne valós osztálytársakra utaló mondatokat használj.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC07-52", "theme_id": "t07", "name": "Kérni tudni kell", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Gyakoroljuk, hogyan kérjünk úgy, hogy a másik szívesen teljesítse, és hogyan fogadjuk el, ha nemet mond.", "tools": "helyzetkártyák", "keywords": "kérés, udvariasság, nemet mondás elfogadása, kommunikáció", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mutass két kérést: „Add ide a ceruzád!” és „Kölcsönadnád a ceruzádat egy percre? Elfelejtettem az enyémet.” Melyikre mondanál szívesebben igent?\n2. Gyűjtsétek a jó kérés hozzávalóit: kedves hang, ok, pontosan mit kérek, köszönöm.\n3. Párban helyzetkártyákon gyakorolnak (pl. hogy halkabban beszéljen valaki; hogy beállhass a játékba; segítséget a házihoz).\n4. Második körben a pár néha nemet mond. Hogyan fogadja ezt a kérő?\n5. Feldolgozás: Mi a különbség a kérés és a parancs között? Milyen érzés, ha nemet mondanak? Mit kérsz majd valakitől a héten?", "caution": "Hangsúlyozd, hogy a „nem” is rendben van.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC08-51", "theme_id": "t08", "name": "A veszekedés lépcsője", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Egy kitalált vitán megnézzük, hogyan lesz egy apróságból nagy veszekedés, és hol lehet megállni.", "tools": "egy lépcsőrajz a táblán, a vita lépései kártyákon", "keywords": "konfliktus, eszkaláció, megállás, békülés", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Rajzolj egy lépcsőt. Olvasd fel a vita lépéseit összekeverve (pl. Dani véletlenül meglöki Bencét; Bence visszalöki; Dani csúnyát mond; Bence elveszi a labdáját; mindketten kiabálnak).\n2. Kiscsoportok sorba rendezik a lépéseket alulról felfelé.\n3. Megkeresik: hol lehetett volna megállni? Mit mondhatott volna valaki az egyes lépcsőfokokon?\n4. Bemutatják a „lefelé vezető” mondataikat.\n5. Feldolgozás: Melyik lépcsőfokon a legnehezebb megállni? Mi segít lejönni a lépcsőn? Kinek szólhatsz, ha nem tudjátok egyedül megoldani?", "caution": "A történet legyen kitalált.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC08-52", "theme_id": "t08", "name": "Békülés-kerék", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Elkészítjük az osztály békülés-kerekét: nyolc mód arra, hogyan oldhatunk meg egy kis vitát egyedül.", "tools": "nagy papírkör nyolc cikkel, filcek", "keywords": "konfliktusmegoldás, békülés, választás, önállóság", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kérdezd meg: mit lehet csinálni, ha összevesztél valakivel, és nincs ott felnőtt?\n2. Gyűjtsetek ötleteket, és válasszatok ki nyolcat a kerékre (pl. sorsolás, felváltva, bocsánatkérés, közös megoldás, szünet és újrakezdés, más játék választása, megosztás, segítség kérése).\n3. Kiscsoportok kapnak egy-egy vitát, és a keréken kiválasztják a legjobb megoldást.\n4. Elmondják, miért azt választották.\n5. Feldolgozás: Melyik megoldás a kedvenced? Melyik nem működne mindig? A kereket kitehetjük a terembe, és ha vita van, megnézhetjük.", "caution": "A kerék legyen a gyerekek ötleteiből, ne csak a tiedből.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC09-51", "theme_id": "t09", "name": "Közös építmény", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Kiscsoportok papírpoharakból tornyot építenek úgy, hogy mindenki csak egy szabály szerint segíthet. Megtapasztaljuk, hogy mindenkire szükség van.", "tools": "papírpoharak (csoportonként 15–20), szabálykártyák", "keywords": "együttműködés, szerepek, csapatmunka, kommunikáció", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. 5–6 fős csoportok poharakat kapnak, és mindenki húz egy titkos szabálykártyát (pl. csak bal kézzel dolgozhatsz; nem beszélhetsz; csak te mondhatod meg, hova kerüljön a pohár; csak kérdezhetsz).\n2. 10 perc alatt a lehető legmagasabb tornyot kell építeniük.\n3. Megmérik, megtapsolják a tornyokat.\n4. Felfedik a szabályaikat egymásnak.\n5. Feldolgozás: Milyen volt a szabályod szerint dolgozni? Kire figyeltél a legjobban? Miért volt szükség mindenkire?", "caution": "Ha valaki frusztrált lesz, segíts neki megfogalmazni, mi nehéz.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC09-52", "theme_id": "t09", "name": "Csapatkapitány egy napra", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Felváltva vezetünk egy közös játékot, és megbeszéljük, milyen egy jó kapitány.", "tools": "egyszerű csoportjáték (pl. sorba rendeződés születésnap szerint szavak nélkül)", "keywords": "vezetés, követés, csapat, felelősség", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kérdezd meg: milyen egy jó csapatkapitány? Gyűjtsétek a táblára.\n2. Játsszatok egy rövid feladatot (pl. alkossatok egy betűt a testetekkel; építsetek „gépet”, amelyben mindenki egy alkatrész). Minden körben más a kapitány.\n3. A kapitány dönti el, hogyan oldják meg; a többiek segítenek.\n4. 3–4 kör után beszéljétek meg.\n5. Feldolgozás: Milyen volt kapitánynak lenni? És követni? Mi kell ahhoz, hogy a csapat jól dolgozzon együtt?", "caution": "Figyelj, hogy a csendesebbek is lehessenek kapitányok.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC10-51", "theme_id": "t10", "name": "Köszönő-lánc", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Papírcsíkokra köszönetet írunk az osztálytársainknak, és ezekből közös láncot fűzünk.", "tools": "színes papírcsíkok, ragasztó vagy tűzőgép", "keywords": "hála, köszönet, osztályközösség, pozitív visszajelzés", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kérdezd meg: mi az, amit egy osztálytársad tett, és szívesen megköszönnéd?\n2. Mindenki legalább két papírcsíkra ír egy-egy köszönetet egy osztálytársának (névvel).\n3. A csíkokat láncszemekké ragasztjátok, és összefűzitek egy hosszú lánccá.\n4. Felolvastok néhány köszönetet, és kiteszitek a láncot a terembe.\n5. Feldolgozás: Milyen volt köszönetet írni? Kapni? Figyelj, hogy mindenki neve szerepeljen a láncon!", "caution": "Gondoskodj róla, hogy mindenki kapjon köszönetet; ha valaki kimarad, írj neki te.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC10-52", "theme_id": "t10", "name": "Visszanézek az évre", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Az év végén lerajzoljuk, mit tanultunk, mi esett jól, és mire vagyunk büszkék.", "tools": "A4-es lapok négy mezővel, színes ceruzák", "keywords": "visszatekintés, büszkeség, hála, év vége", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Oszd négy mezőre a lapot: amit megtanultam; ami jólesett; amire büszke vagyok; amit jövőre szeretnék.\n2. Mindenki rajzzal vagy szavakkal kitölti.\n3. Párban megmutatják egymásnak.\n4. Aki szeretné, egy mezőt megoszt az osztállyal.\n5. Feldolgozás: Mire vagy a legbüszkébb? Kinek köszönheted? Mit kívánsz az osztálynak jövőre?", "caution": "Ha valakinek nehéz éve volt, a „jólesett” mezőbe apróság is kerülhet.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC12-51", "theme_id": "t12", "name": "Ki nincs még a körben?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Egy körjátékkal megtapasztaljuk, milyen kimaradni, és kitaláljuk, hogyan vehetjük észre és hívhatjuk be azt, aki kimaradt.", "tools": "hely a körjátékhoz", "keywords": "befogadás, kirekesztés, barátság, figyelem", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Játsszatok egy gyors körjátékot (pl. aki szereti a fagyit, lépjen be a körbe). Utána kérdezd meg: milyen volt kint maradni egy-egy körben?\n2. Beszélgessetek: hol fordul elő, hogy valaki kimarad (játék, csapatválasztás, ebéd)?\n3. Kiscsoportok kitalálnak egy-egy „behívó mondatot” (pl. „Gyere, játssz velünk!” „Ülj ide mellénk!”).\n4. Eljátsszák egy rövid jelenetben.\n5. Feldolgozás: Miért nem vesszük észre néha, ha valaki egyedül van? Mit érez, akit behívnak? Kit hívsz majd be a héten?", "caution": "A játékban a „kintmaradás” legyen rövid és változó, mindenki kerüljön néha kívülre és belülre is.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC12-52", "theme_id": "t12", "name": "A jó barát receptje", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Közös „receptet” írunk a jó barátságról: milyen hozzávalók kellenek hozzá?", "tools": "A4-es lapok receptsablonnal", "keywords": "barátság, tulajdonságok, kapcsolatok, kedvesség", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mutass egy receptet (hozzávalók, elkészítés). Ma a jó barátság receptjét írjuk meg.\n2. Kiscsoportok összegyűjtik a hozzávalókat (pl. 2 kanál türelem, egy csipet humor, sok meghallgatás) és az elkészítést (pl. „Ha szomorú, ülj mellé.”).\n3. Felolvassák a receptjeiket.\n4. Közösen kiválasztjátok a három legfontosabb hozzávalót.\n5. Feldolgozás: Melyik hozzávalóból adsz te a legtöbbet a barátaidnak? Melyikből adnál többet? Mi történik, ha egy hozzávaló hiányzik?", "caution": "Figyelj azokra, akiknek kevés barátjuk van, és ne kérdezd őket név szerint a barátaikról.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC13-51", "theme_id": "t13", "name": "A képernyő-időjárás", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Megnézzük, hogyan érezzük magunkat képernyőzés előtt és után, és mi más tölthet fel.", "tools": "A4-es lapok, színes ceruzák", "keywords": "képernyőidő, hangulat, szokások, egyensúly", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kérdezd meg: mit szeretsz a legjobban csinálni a telefonon, tableten vagy gépen?\n2. Mindenki rajzol két időjárás-képet: milyen vagyok, mielőtt elkezdek képernyőzni, és milyen vagyok, ha már nagyon sokáig csinálom.\n3. Párban összehasonlítják a rajzaikat.\n4. Közösen gyűjtsetek „napsütéses” programokat képernyő nélkül.\n5. Feldolgozás: Mi történik veled, ha túl sokáig nézed a képernyőt? Mi az a képernyő nélküli program, amit ezen a héten kipróbálsz?", "caution": "Ne ítélkezz: a cél a saját érzések észrevétele.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC13-52", "theme_id": "t13", "name": "Okosan online", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Kitalált helyzeteken gyakoroljuk, mit tegyünk, ha online valami furcsa, ijesztő vagy bántó dolog történik.", "tools": "helyzetkártyák, közlekedési lámpa (piros, sárga, zöld lap)", "keywords": "online biztonság, segítségkérés, magánszféra, kommentek", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mutasd be a lámpát: zöld – rendben van; sárga – állj meg és gondold át; piros – szólj egy felnőttnek.\n2. Olvass fel helyzeteket (pl. egy ismeretlen arra kér, küldj fotót magadról; valaki csúnyát ír rólad; egy játékban azt írják, adj meg egy jelszót; egy vicces videót kapsz a barátodtól).\n3. Mindenki felemeli a színt, amit választana. Beszéljétek meg az eltéréseket.\n4. Gyűjtsétek össze, kinek szólhatnak, ha baj van.\n5. Feldolgozás: Melyik helyzet volt a legnehezebb? Miért fontos szólni egy felnőttnek? Mit nem osztasz meg soha online?", "caution": "Ha egy gyerek valós online bántalmazásról beszél, vedd komolyan, és vonj be segítőt.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC14-51", "theme_id": "t14", "name": "Nem, köszönöm!", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Vidám jelenetekben gyakoroljuk, hogyan mondjunk nemet a barátainknak, ha valamit nem szeretnénk.", "tools": "helyzetkártyák", "keywords": "nemet mondás, kortárs nyomás, bátorság, barátság", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kérdezd meg: miért nehéz nemet mondani a barátainknak?\n2. Gyűjtsetek nemet mondó mondatokat (pl. „Nem, köszönöm!” „Ezt most kihagyom.” „Nem szeretném, de csináljunk mást!”).\n3. Hármasban gyakorolnak: ketten kérnek valamit (pl. csússzunk le a korlátról; ne álljunk szóba vele; adjuk oda a házinkat lemásolni), a harmadik nemet mond. Csere.\n4. Néhány csoport bemutatja.\n5. Feldolgozás: Melyik mondat volt a legkönnyebb? Milyen érzés volt nemet mondani? Mi segít, ha többen kérnek tőled valamit?", "caution": "A kérések legyenek egyszerűek és ártalmatlanok.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC14-52", "theme_id": "t14", "name": "A kisbárány és a nyáj", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Egy mozgásos játékban megtapasztaljuk, milyen a többséget követni, és milyen bátran a saját utunkat járni.", "tools": "semmi különleges (a terem két oldala: „igen” és „nem”)", "keywords": "csoportnyomás, követés, önállóság, bátorság", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mondj állításokat (pl. „A pizza a legjobb étel.” „Jobb nyáron születni.” „A kutya jobb, mint a macska.”). Aki egyetért, a terem egyik oldalára áll, aki nem, a másikra.\n2. Néhány kör után kérd meg őket, hogy most csukott szemmel döntsenek, és csak utána nézzenek körül.\n3. Kérdezd meg: más volt csukott szemmel dönteni? Előfordult, hogy azért mentél valahova, mert a barátod is oda ment?\n4. Mondjatok példákat, amikor jó követni a többieket (pl. tűzriadó), és amikor jobb a saját fejünk után menni.\n5. Feldolgozás: Milyen érzés volt egyedül állni az egyik oldalon? Mi segít kitartani a véleményed mellett? Hogyan bátoríthatjuk azt, aki egyedül van?", "caution": "Az állítások legyenek vidámak és semlegesek, és dicsérd meg azt, aki egyedül is a saját oldalára állt.  👥 Nagy létszámnál is működik az egész osztállyal; a megbeszélésnél csak néhányan szóljanak, mindig mások.", "variants": null}, {"id": "VC15-51", "theme_id": "t15", "name": "Dolgozat előtt", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Megbeszéljük, mit érzünk dolgozat előtt, és kipróbálunk egy-két technikát, ami segít.", "tools": "rajzlapok", "keywords": "dolgozat, izgulás, stressz, technikák", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kérdezd meg: hol érzed a testedben, ha izgulsz egy dolgozat előtt? Gyűjtsétek a táblára (gyomor, kéz, szív).\n2. Mondd el: az izgulás normális, a testünk felkészül. De ha túl erős, tudunk segíteni magunkon.\n3. Próbáljatok ki két technikát: 4-es légzés (be 4, bent 4, ki 4) és a „biztató mondat” (pl. „Felkészültem, menni fog.”).\n4. Mindenki felír magának egy biztató mondatot egy kis kártyára.\n5. Feldolgozás: Melyik technika segített? Mit csinálsz dolgozat előtti este? Kinek szólhatsz, ha nagyon izgulsz?", "caution": "Ha valaki nagyon szorong a dolgozatoktól, beszélj vele és a szüleivel.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC15-52", "theme_id": "t15", "name": "Az én napirendem", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Lerajzoljuk egy napunkat, és megnézzük, jut-e elég idő alvásra, játékra, mozgásra és tanulásra.", "tools": "A4-es lapok nagy körrel (napóra)", "keywords": "napirend, egyensúly, alvás, játék, stressz", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Rajzolj egy nagy kört, mint egy óralap. Kérdezd meg: mi minden fér bele egy napba?\n2. Mindenki felosztja a saját napját cikkekre: alvás, iskola, tanulás, játék, mozgás, képernyő, család.\n3. Párban összehasonlítják: kinél mi a legnagyobb cikk?\n4. Beszéljétek meg: mi kell ahhoz, hogy ne legyünk fáradtak és idegesek?\n5. Feldolgozás: Melyik cikk kicsi nálad, pedig nagyobb kellene? Mit tudnál változtatni a héten? Ki segíthet ebben otthon?", "caution": "Ne hasonlítgasd a családok napirendjét; figyelj a különböző otthoni helyzetekre.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC16-51", "theme_id": "t16", "name": "Ha választhatnék", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Játékos döntési helyzetekben megnézzük, hogyan döntünk, és mi segít jól választani.", "tools": "döntéskártyák (pl. tengerpart vagy hegyek; kutya vagy macska; repülni vagy láthatatlannak lenni)", "keywords": "döntés, választás, indoklás, egyéni különbségek", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Olvass fel „ezt vagy azt” kérdéseket. A terem két oldala a két választás, mindenki odaáll, amit választana.\n2. Minden kérdésnél kérdezz meg 1–2 gyereket: miért ezt választottad?\n3. Utána egy komolyabb döntés jön (pl. melyik szakkörre menjek; elmondjam-e anyának, hogy elrontottam valamit). Kiscsoportok összegyűjtik: mi szól mellette, mi ellene?\n4. Megbeszélik, kitől kérnének tanácsot.\n5. Feldolgozás: Melyik döntés volt könnyű, és melyik nehéz? Mi segít, ha nem tudsz dönteni? Ki az, akitől tanácsot kérsz?", "caution": "A komolyabb döntéseket kitalált helyzetként mutasd be.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC16-52", "theme_id": "t16", "name": "Ha nagy leszek", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Lerajzoljuk, mivel szeretnénk foglalkozni, ha felnövünk, és megnézzük, mit tanulhatunk már most hozzá.", "tools": "rajzlapok, színes ceruzák", "keywords": "jövő, álmok, érdeklődés, tanulás", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kérdezd meg: mi szerettél volna lenni óvodásként? És most?\n2. Mindenki lerajzolja magát felnőttként, abban, amit szívesen csinálna.\n3. A rajz alá felírja: mit kell ehhez tudni? Mit tanulhatok már most?\n4. Kiállítást rendeztek a rajzokból, és körbejártok.\n5. Feldolgozás: Melyik rajz lepett meg? Mi az, amit már most elkezdhetsz? Rendben van-e, ha később megváltozik az álmod?", "caution": "Hangsúlyozd, hogy minden álom érték, és bármikor változhat.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC17-51", "theme_id": "t17", "name": "Az évünk kincsei", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Kincsesládába gyűjtjük az év legszebb emlékeit, és együtt felolvassuk őket.", "tools": "doboz, színes cetlik", "keywords": "év vége, emlékek, hála, közösség", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mindenki ír két cetlit: egy szép emléket az évből, és egy dolgot, amit az osztálytól kapott.\n2. A cetliket bedobják a kincsesládába.\n3. Sorban húztok és felolvastok.\n4. Mindenki elmondja, melyik emlék tetszett neki a legjobban.\n5. Feldolgozás: Mire emlékszel majd a legszívesebben? Mit viszel magaddal a nyárra? Mit kívánsz az osztálynak a 6. évre?", "caution": "Nézd át a cetliket, mielőtt felolvasod őket.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC17-52", "theme_id": "t17", "name": "Nyári útravaló", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "5", "description": "Mindenki kap az osztálytól egy útravaló-borítékot kedves üzenetekkel a nyárra.", "tools": "borítékok névvel, kis cetlik", "keywords": "búcsú, pozitív visszajelzés, nyár, közösség", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Tegyétek ki a borítékokat, mindegyikre egy név kerül.\n2. Mindenki legalább 5 borítékba ír egy rövid, kedves üzenetet (pl. „Köszi, hogy…”, „Jó nyarat, mert…”).\n3. Figyelj, hogy minden borítékba kerüljön elég üzenet.\n4. Mindenki megkapja a borítékját, és hazaviheti (nem kell most elolvasni).\n5. Feldolgozás: Milyen érzés lesz otthon elolvasni? Mit kívánsz a nyárra egy szóban? Mire készülsz a 6. osztályban?", "caution": "Csak kedves üzenet kerülhet a borítékokba; nézd át őket, mielőtt kiosztod.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC01-61", "theme_id": "t01", "name": "Osztályunk térképe", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Lerajzoljuk az osztályunkat mint egy szigetet: hol jó lenni, hol vannak veszélyes helyek, és mi kell ahhoz, hogy mindenki biztonságban legyen.", "tools": "csomagolópapír, filcek", "keywords": "osztályközösség, biztonság, szabályok, közös kép", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kiscsoportok egy szigetet rajzolnak, ami az osztályt jelképezi.\n2. Berajzolják: kedvenc helyek (amikor jó együtt lenni), veszélyes zónák (amikor valaki megsérülhet, pl. csúfolás, kiabálás), hidak (ami összeköt).\n3. Minden veszélyes zóna mellé írnak egy „táblát”, vagyis egy szabályt, ami véd.\n4. Bemutatják a szigeteiket.\n5. Feldolgozás: Melyik veszélyes zóna szerepelt a legtöbbször? Melyik táblát tennénk ki az osztályban is? Mit tehetsz te, hogy a sziget biztonságos legyen?", "caution": "A veszélyes zónák ne konkrét emberekről szóljanak.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC01-62", "theme_id": "t01", "name": "Félidős szabályellenőrzés", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Megnézzük, mennyire tartjuk a közös szabályainkat, és mi segítene jobban.", "tools": "a szabályplakát vagy a szabályok listája, három színű matrica", "keywords": "szabályok, önértékelés, közös megállapodás", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Tedd ki a szabályokat (vagy gyűjtsétek össze őket).\n2. Mindenki minden szabály mellé ragaszt egy színt: zöld – jól megy; sárga – néha megy; piros – nem megy.\n3. Nézzétek meg, melyik szabály kapta a legtöbb pirosat.\n4. Kiscsoportok ötletet gyűjtenek, mi segítene ennél a szabálynál.\n5. Feldolgozás: Miért nehéz pont ezt a szabályt betartani? Mit tehetsz te érte? Változtassunk-e valamelyik szabályon?", "caution": "Ne keress bűnöst; a cél a közös javítás.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC02-61", "theme_id": "t02", "name": "Érzelem-hőtérkép", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Feltérképezzük, milyen helyzetekben milyen érzések jönnek elő az iskolában, és mennyire erősek.", "tools": "táblázat a táblán (helyzetek × érzések), pöttyök", "keywords": "érzelmek, helyzetek, intenzitás, önmegfigyelés", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Írj fel 5 iskolai helyzetet (dolgozat, szünet, felelés, tesióra, ebéd) és 5 érzést (öröm, izgulás, unalom, düh, nyugalom).\n2. Mindenki pöttyöt ragaszt oda, amit a legtöbbször érez az adott helyzetben.\n3. Nézzétek meg a „hőtérképet”: hol van a legtöbb pötty?\n4. Beszéljétek meg a meglepő eredményeket.\n5. Feldolgozás: Mi lepett meg a hőtérképen? Mit tudnánk tenni, hogy egy-egy helyzet kellemesebb legyen? Kinek mondanád el, ha valami rendszeresen rossz érzés?", "caution": "A pöttyök névtelenek maradjanak.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC02-62", "theme_id": "t02", "name": "Érzelem-szobrok", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Csoportokban szoborrá dermedünk egy érzés kifejezésére, a többiek kitalálják.", "tools": "érzelemkártyák", "keywords": "érzelmek, testbeszéd, nem verbális jelek, játék", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kiscsoportok húznak egy érzelemkártyát (pl. csalódottság, büszkeség, zavar, megkönnyebbülés).\n2. 2 perc alatt kitalálnak egy közös szobrot, amely ezt fejezi ki.\n3. Egyenként bemutatják, a többiek kitalálják az érzést.\n4. Megbeszélitek, mi árulta el az érzést (arc, kéz, testtartás, távolság).\n5. Feldolgozás: Melyik érzést volt a legnehezebb megmutatni? Mit árul el a testünk akkor is, ha nem beszélünk? Hogyan veszed észre, ha egy barátod szomorú?", "caution": "Senkit ne kényszeríts a szerepre; lehet „rendező” is.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC03-61", "theme_id": "t03", "name": "Stop – gondolkodj – cselekedj", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Egy háromlépéses módszerrel gyakoroljuk, hogyan ne reagáljunk elsőre, ha felhúznak minket.", "tools": "helyzetkártyák, három kártya: STOP, GONDOLKODJ, CSELEKEDJ", "keywords": "önszabályozás, impulzuskontroll, döntés, indulat", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mutasd be a három lépést: STOP (állj meg, vegyél levegőt), GONDOLKODJ (mi történt, mit szeretnék?), CSELEKEDJ (válassz egy jó lépést).\n2. Párok kapnak egy helyzetet (pl. valaki elrontja a rajzodat; kinevetnek egy rossz válasz miatt; a tesód elvette a cuccodat).\n3. Végigmennek a három lépésen, és két jó cselekvést is kitalálnak.\n4. Néhány pár eljátssza.\n5. Feldolgozás: Melyik lépés a legnehezebb? Mi segít megállni? Mikor használtad volna ezt a múlt héten?", "caution": "A helyzetek legyenek kitaláltak.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC03-62", "theme_id": "t03", "name": "Aggódás-doboz", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Megtanuljuk, hogy az aggodalmakat el is lehet tenni egy időre, és mindenki készít egy saját aggódás-dobozt.", "tools": "kis dobozok vagy borítékok, cetlik, díszítőanyag", "keywords": "aggódás, szorongás, technikák, önnyugtatás", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kérdezd meg: mi jár a fejedben este, amikor nem tudsz elaludni?\n2. Mondd el: az aggodalmat le lehet írni és el lehet tenni, holnap is ráér. Aki szeretné, másnap megmutathatja egy felnőttnek.\n3. Mindenki díszít egy kis dobozt vagy borítékot.\n4. Felír egy kisebb aggodalmat egy cetlire, és beteszi (senki nem olvassa el).\n5. Feldolgozás: Milyen érzés volt betenni a cetlit? Kinek mutatnád meg, ha egy aggodalom túl nagy? Mikor használnád otthon a dobozt?", "caution": "Ha egy gyerek nagyon nyugtalan, vagy komoly aggodalma van, beszélj vele négyszemközt.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC04-61", "theme_id": "t04", "name": "Az én térképem", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Mindenki megrajzolja a saját „térképét”: a helyeket, embereket és tevékenységeket, ahol a legjobban érzi magát.", "tools": "A3-as lapok, színes ceruzák", "keywords": "önismeret, erőforrások, kapcsolatok, kedvenc helyek", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mondd el: mindenkinek van egy belső térképe azokról a helyekről, ahol jól érzi magát.\n2. Mindenki lerajzolja a térképét: kedvenc helyek, fontos emberek, kedvenc tevékenységek, és egy „kincses hely”, ahol a legjobban érzi magát.\n3. Párban megmutatják egymásnak.\n4. Kiállítást rendeztek, aki szeretné, kiteszi a térképét.\n5. Feldolgozás: Hova mész, ha rossz napod van? Ki van rajta a térképeden? Mi az, ami még hiányzik a térképedről?", "caution": "Nem mindenkinek van könnyű otthoni helyzete; a térképen bármilyen hely szerepelhet.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC04-62", "theme_id": "t04", "name": "Mi tesz boldoggá?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Összegyűjtjük, mitől vagyunk boldogok, és megnézzük, ebből mennyi van a saját kezünkben.", "tools": "cetlik, két kör a táblán: „Rajtam múlik” és „Nem rajtam múlik”", "keywords": "boldogság, önismeret, kontroll, értékek", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mindenki felír három dolgot, amitől boldog (pl. focizni, a nagymamámnál lenni, ha jó jegyet kapok).\n2. A cetliket elhelyezitek a két körben: rajtam múlik, vagy nem rajtam múlik.\n3. Nézzétek meg: melyik körben van több?\n4. Kiscsoportok összegyűjtik, hogyan lehet minél több „boldog pillanatot” beépíteni a hétbe.\n5. Feldolgozás: Meglepett, mennyi minden múlik rajtad? Mi az az egy boldog dolog, amit a héten megcsinálsz? Kinek tudsz te örömet okozni?", "caution": "Ha valaki szomorú vagy nem talál boldog dolgot, segíts apró példákkal.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC05-61", "theme_id": "t05", "name": "Kérdezz okosan!", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Gyakoroljuk a nyitott kérdéseket, amelyekkel többet tudhatunk meg a másikról.", "tools": "kérdéskártyák", "keywords": "nyitott kérdés, kíváncsiság, beszélgetés, hallgatás", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mutasd meg a különbséget: „Jó volt a hétvégéd?” (igen/nem) és „Mi volt a hétvégéd legjobb része?” (sokat lehet mondani).\n2. Párban az egyik mond egy témát (pl. a kedvenc játékom), a másik csak nyitott kérdéseket tehet fel 2 percig. Csere.\n3. Gyűjtsétek a legjobb kérdéseket a táblára.\n4. Próbáljátok ki egy új párral.\n5. Feldolgozás: Melyik kérdésre volt a legjobb válaszolni? Mit tudtál meg, amit eddig nem? Kinek teszel fel ilyen kérdést otthon?", "caution": "A témák legyenek könnyűek.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC05-62", "theme_id": "t05", "name": "Mi változott?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Kétszer hallgatunk meg egy rövid történetet, de a második változatban egy részlet megváltozik. Aki igazán figyel, észreveszi.", "tools": "2–3 rövid, saját történet", "keywords": "figyelem, hallgatás, részletek, koncentráció", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Olvass fel egy 4–5 mondatos történetet (pl. egy kirándulásról, színekkel, nevekkel, számokkal).\n2. Olvasd fel újra, de egy részletet megváltoztatsz. Aki észreveszi, feltartja a kezét, és megmondja, mi változott.\n3. Párban is játsszák: az egyik mesél, aztán újramondja egy változtatással, a másik figyel. Csere.\n4. Beszéljétek meg, mi segített figyelni.\n5. Feldolgozás: Mi tereli el a figyelmedet, amikor valaki beszél hozzád? Mi segít jobban figyelni? Kire figyelsz majd igazán a héten?", "caution": "A történetek legyenek rövidek és vidámak.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC06-61", "theme_id": "t06", "name": "Empátia-tükör", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Párban egymás tükörképei leszünk, és megtapasztaljuk, milyen figyelni a másikra, és ráhangolódni.", "tools": "halk zene (nem kötelező)", "keywords": "empátia, ráhangolódás, figyelem, nem verbális kapcsolat", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Párok szemben állnak. Az egyik lassan mozog, a másik a tükörképe: pontosan ugyanazt csinálja.\n2. 1 perc után csere. Harmadik körben nincs vezető: próbáljanak meg együtt mozogni úgy, hogy ne lehessen tudni, ki irányít.\n3. Utána a párok egy érzést mutatnak arccal és testtel, a tükör utánozza, és kitalálja.\n4. Beszéljétek meg, milyen volt.\n5. Feldolgozás: Mi kellett ahhoz, hogy jó tükör legyél? Hasonlít ez arra, amikor megértünk valakit? Kire hangolódnál rá jobban a héten?", "caution": "A lassú mozgás a lényeg; figyelj, hogy senki ne nevesse ki a párját.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC06-62", "theme_id": "t06", "name": "Láthatatlan hátizsák", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Mindenki láthatatlan hátizsákot hord: dolgokat, amelyek nehezek neki, de mások nem látják. Megbeszéljük, mit tehetünk egymásért.", "tools": "egy hátizsák, cetlik", "keywords": "empátia, rejtett nehézségek, megértés, kedvesség", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mutass egy hátizsákot, és tegyél bele néhány cetlit kitalált terhekkel (pl. „Rosszul aludtam.” „Beteg a kutyám.” „Veszekedtem a tesómmal.”).\n2. Kérdezd meg: mi történik, ha valaki ilyen hátizsákkal jön iskolába? Hogyan viselkedhet?\n3. Mindenki névtelenül felír egy dolgot, ami néha nehéz a hátizsákjában (nem kötelező).\n4. Felolvasol néhányat, és közösen kitaláltok könnyítő ötleteket.\n5. Feldolgozás: Miért nem látjuk mások hátizsákját? Mit tehetünk, ha valaki morcos vagy szomorú? Mi könnyíti a te hátizsákodat?", "caution": "Nézd át a cetliket felolvasás előtt; ha komoly gondra utaló cetlit találsz, kezeld négyszemközt.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC07-61", "theme_id": "t07", "name": "Zsiráfnyelv", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Megismerjük a zsiráfnyelvet: úgy mondjuk el, mi bánt, hogy elmondjuk az érzésünket és a kérésünket.", "tools": "zsiráf- és sakálrajz, mondatkártyák", "keywords": "EMK, zsiráfnyelv, érzések, kérés", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mutasd be a két állatot: a sakál bánt és vádol („Te mindig…”), a zsiráf (a legnagyobb szívű szárazföldi állat) elmondja, mit érez és mit kér.\n2. Olvass fel sakálmondatokat (pl. „Te vagy a hibás!” „Soha nem figyelsz!”).\n3. Párban átírják őket zsiráfnyelvre: „Amikor…, én… érzem magam. Kérlek…”\n4. Felolvassák a zsiráfmondatokat.\n5. Feldolgozás: Melyik nyelvet hallod többször? Miért nehezebb zsiráful beszélni? Mikor próbálod ki a héten?", "caution": "A zsiráf és a sakál fotóját a 7.-es „Zsiráf és sakál” gyakorlat vetítéséből is megmutathatod.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC07-62", "theme_id": "t07", "name": "Mire van szükségem?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Megtanuljuk, hogy minden érzés mögött egy szükséglet van (pihenés, figyelem, igazság, játék), és gyakoroljuk, hogyan kérjük.", "tools": "szükségletkártyák (pl. pihenés, figyelem, segítség, igazság, játék, nyugalom, barátság)", "keywords": "szükségletek, érzések, kérés, EMK", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mondd el: ha rossz érzésünk van, valamire szükségünk van. Pl. dühös vagyok, mert igazságot szeretnék.\n2. Mutasd a szükségletkártyákat, és beszéljétek meg, mit jelentenek.\n3. Párban helyzeteket kapnak (pl. a tesód mindig bejön a szobádba; senki nem figyel rád a csoportmunkában; fáradt vagy, de még edzésre kell menni), és megkeresik az érzést és a szükségletet.\n4. Mindegyikhez kérést fogalmaznak („Szeretném, ha…”).\n5. Feldolgozás: Melyik szükséglet a legfontosabb neked mostanában? Miért könnyebb panaszkodni, mint kérni? Mit kérsz majd valakitől a héten?", "caution": "A helyzetek legyenek kitaláltak.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC08-61", "theme_id": "t08", "name": "Hűtő mondatok", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Összegyűjtjük, milyen mondatok „melegítik” fel a vitát, és milyenek hűtik le, és jelenetekben kipróbáljuk őket.", "tools": "két oszlop a táblán (hőmérő-rajz)", "keywords": "vita, deeszkaláció, szavak, konfliktus", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Rajzolj egy hőmérőt. Kérdezd meg: milyen mondatoktól forrósodik fel egy vita? (pl. „Te mindig…”, „Na és?”, kiabálás.)\n2. Gyűjtsetek hűtő mondatokat is (pl. „Mondd el, mi a baj.” „Igazad van abban, hogy…” „Tartsunk szünetet.”).\n3. Párban eljátszanak egy kitalált vitát (pl. ki ül elöl az autóban; ki választ játékot) először forró, aztán hűtő mondatokkal.\n4. Néhány pár bemutatja.\n5. Feldolgozás: Melyik hűtő mondat működött a legjobban? Melyik forró mondatot mondod te is néha? Mit mondasz legközelebb, ha forrósodik a vita?", "caution": "A vita legyen kitalált és könnyed.  👥 Nagy létszámnál (25 fő fölött): párban dolgozzatok, és csak néhány pár ossza meg a gondolatait az osztállyal.", "variants": null}, {"id": "VC08-62", "theme_id": "t08", "name": "Békebíró", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Hármasban kipróbáljuk az egyszerű közvetítést: két vitázó és egy békebíró, aki nem dönt, csak segít meghallgatni egymást.", "tools": "helyzetkártyák, békebíró-kártya a lépésekkel", "keywords": "közvetítés, konfliktusmegoldás, meghallgatás, igazságosság", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mutasd be a békebíró lépéseit: 1. Mindketten elmondják, mi történt (a másik nem szól közbe). 2. Mindketten elmondják, mit éreznek. 3. Ötletet gyűjtenek. 4. Megállapodnak.\n2. Hármas csoportok kapnak egy kitalált vitát (pl. ki ül az ablak mellett; ki választja a játékot).\n3. Eljátsszák, a békebíró vezeti. Kétszer cserélnek.\n4. Néhány csoport elmondja a megállapodását.\n5. Feldolgozás: Milyen volt békebírónak lenni? Mi segített a megállapodásban? Mikor kell felnőttet hívni?", "caution": "A viták legyenek kitaláltak és könnyűek.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC09-61", "theme_id": "t09", "name": "Néma sorba rendeződés", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Beszéd nélkül kell sorba állnunk különböző szempontok szerint. Megnézzük, hogyan működünk együtt szavak nélkül.", "tools": "semmi különleges", "keywords": "együttműködés, nem verbális kommunikáció, figyelem, csapat", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kérd, hogy az osztály álljon sorba beszéd nélkül: születésnap szerint (január–december).\n2. Ellenőrizzétek: ki áll rossz helyen?\n3. Második kör: lábméret, harmadik kör: a keresztnév kezdőbetűje szerint.\n4. Kérdezd meg, hogyan sikerült megértetni magukat.\n5. Feldolgozás: Ki segített a legtöbbet? Mi volt nehéz szavak nélkül? Mit tanultatok egymásról?", "caution": "Nagy létszámnál két csoportban is játszhatjátok, és versenyezhetnek.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC09-62", "theme_id": "t09", "name": "Közös mese", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Közösen írunk egy mesét úgy, hogy mindenki csak egy mondatot tehet hozzá. Megnézzük, hogyan építünk egymás ötleteire.", "tools": "papírlapok, toll", "keywords": "együttműködés, kreativitás, figyelem, egymásra építés", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kiscsoportok (5–6 fő) kapnak egy kezdőmondatot (pl. „Egy reggel a tanterem ablakán egy sárkány kopogott…”).\n2. Körben mindenki hozzátesz egy mondatot, úgy, hogy az előzőre építsen. Három kör.\n3. A csoport ad a mesének egy befejezést és címet.\n4. Felolvassák a meséket.\n5. Feldolgozás: Milyen volt más ötletére építeni? Volt, hogy a te ötleted másfelé vitte a mesét? Miért jobb néha együtt alkotni?", "caution": "Figyelj, hogy mindenki sorra kerüljön, és senkit ne nevessenek ki a mondatáért.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC10-61", "theme_id": "t10", "name": "Dicséret-zápor", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Egy körben mindenki kap a társaitól egy-egy konkrét dicséretet. Megtanuljuk, mitől jó egy dicséret.", "tools": "székek körben (vagy kisebb körök)", "keywords": "dicséret, pozitív visszajelzés, konkrétság, osztályközösség", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mutasd meg a különbséget: „Ügyes vagy.” és „Tetszett, ahogy segítettél Annának a feladatban.” Melyik ér többet?\n2. Alakítsatok 6–8 fős köröket. Egyvalaki a kör közepére áll (vagy a székén marad), a többiek egy-egy konkrét dicséretet mondanak neki.\n3. Mindenki sorra kerül.\n4. A dicsért csak annyit mond: „Köszönöm.”\n5. Feldolgozás: Milyen volt dicséretet kapni? Melyik esett a legjobban? Miért nehéz néha elfogadni a dicséretet?", "caution": "Gondoskodj róla, hogy mindenki kapjon kedves, konkrét mondatokat.  👥 Nagy létszámnál (25 fő fölött): alakítsatok 2–3 kisebb kört (10–15 fő), hogy mindenki sorra kerüljön, és ne húzódjon el a gyakorlat.", "variants": null}, {"id": "VC10-62", "theme_id": "t10", "name": "Hálanapló-kezdő", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Elkezdjük a hálanaplót: minden nap három jó dolgot írunk fel, és megnézzük, mit változtat.", "tools": "kis füzetek vagy lapok", "keywords": "hála, pozitív gondolkodás, napló, szokás", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kérdezd meg: mi volt ma három jó dolog, akármilyen apróság?\n2. Mindenki felírja a saját hármat (pl. finom volt az ebéd, nevettem a barátommal, sütött a nap).\n3. Aki szeretné, megoszt egyet.\n4. Mindenki eldönti, hogy egy hétig este folytatja-e a naplót.\n5. Feldolgozás: Nehéz volt hármat találni? Mit gondolsz, mi változik, ha minden este ezt csinálod? A következő órán beszámolhatsz.", "caution": "Ha valakinek nehéz időszaka van, egy jó dolog is elég.  👥 Nagy létszámnál (25 fő fölött): párokban vagy 4–5 fős csoportokban dolgozzatok, és csak néhányan osszák meg a gondolataikat az egész osztállyal.", "variants": null}, {"id": "VC12-61", "theme_id": "t12", "name": "Klikkek és körök", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Megbeszéljük, miért alakulnak ki zárt társaságok, és mit tehetünk, hogy senki ne maradjon kívül.", "tools": "kötél vagy kréta egy kör jelzéséhez, helyzetkártyák", "keywords": "klikk, befogadás, kirekesztés, osztályközösség", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kérdezd meg: mi jó abban, ha van egy baráti társaságod? Mi lehet benne rossz?\n2. Kiscsoportok kapnak egy helyzetet (pl. egy új lány próbál beszélgetni egy csapattal, de nem figyelnek rá; csak bizonyos gyerekek ülhetnek egy asztalnál).\n3. Megbeszélik: hogyan érezheti magát, aki kint van? Mit tehetne a társaság egy tagja?\n4. Bemutatják a megoldásukat.\n5. Feldolgozás: Lehet-e jó barátságunk úgy, hogy közben nyitottak vagyunk másokra is? Mit tehetsz te a héten egy nyitottabb osztályért?", "caution": "Ne nevezz meg valódi társaságokat az osztályból.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC12-62", "theme_id": "t12", "name": "Kiállni valakiért", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Megnézzük, mit tehet az, aki látja, hogy valakit bántanak, és milyen biztonságos lépések vannak.", "tools": "helyzetkártyák, a „Három S” a táblán: Segíts, Szólj, Szólíts meg később", "keywords": "bántás, szemlélő, kiállás, segítségkérés", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Mutasd be a három lépést: Segíts (ha biztonságos, szólj közbe); Szólj egy felnőttnek; Szólítsd meg később azt, akit bántottak.\n2. Kiscsoportok kapnak egy helyzetet (pl. valakit kicsúfolnak a ruhája miatt; valakinek elrejtik a táskáját).\n3. Kitalálják, mit tehetnének mind a három lépésnél.\n4. Bemutatják.\n5. Feldolgozás: Miért nem szól közbe sokszor senki? Melyik lépés a legkönnyebb neked? Ki az a felnőtt, akihez fordulhatsz?", "caution": "Hangsúlyozd, hogy a felnőttnek szólni nem árulkodás, hanem segítség.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC13-61", "theme_id": "t13", "name": "Az első saját telefon", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Összegyűjtjük, milyen szabályok segítenek okosan használni az első saját telefont, és ki mit tart fontosnak.", "tools": "nagy lap két oszloppal", "keywords": "telefonhasználat, szabályok, felelősség, biztonság", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Kérdezd meg: kinek van saját telefonja? Mit szeretsz benne a legjobban?\n2. Kiscsoportok összegyűjtenek 5 „okos telefonos szabályt” (pl. evés közben nincs telefon; este 9 után a telefon a nappaliban alszik; nem küldök fotót másról engedély nélkül).\n3. Bemutatják, és közösen kiválasztjátok a legjobbakat.\n4. Beszéljétek meg, melyik szabály a legnehezebb.\n5. Feldolgozás: Melyik szabályt tartod már most? Melyiket próbálod ki? Mit tennél, ha valami rossz történne a telefonodon?", "caution": "Nem mindenkinek van telefonja: figyelj, hogy ez ne legyen kínos.  👥 Nagy létszámnál (25 fő fölött): 6–7 csoporttal dolgozzatok (4–5 fő), és csak 2–3 csoport mutassa be az eredményét, a többiek egy-egy mondattal egészítsék ki.", "variants": null}, {"id": "VC13-62", "theme_id": "t13", "name": "Igaz vagy kamu?", "type": "Fő gyakorlat", "type_order": 3, "minutes": 35, "depth": "Könnyű", "grade": "6", "description": "Néhány furcsa „hírt” vizsgálunk meg, és megtanuljuk, hogyan ellenőrizzük, igaz-e valami, amit online látunk.", "tools": "4–5 kitalált hír kártyán (vegyesen igaz és kamu)", "keywords": "álhír, ellenőrzés, kritikus gondolkodás, online", "source": "Lélektér – osztályfőnöki kiegészítés", "instructions": "1. Olvass fel furcsa híreket (pl. „Egy kutya megtanult biciklizni.” „Holnaptól betiltják a házi feladatot.”). Mindenki tippel: igaz vagy kamu?\n2. Mutasd be a kamuszűrőt: Ki mondja?
